<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>SIM Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0a0a1a,#0f172a,#1a0a2e);min-height:100vh;font-family:"Noto Sans Thai",Sarabun,sans-serif;color:white}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.3);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
window.onerror=function(msg,src,line){
  var r=document.getElementById("root");
  if(r&&!r.innerHTML){r.innerHTML='<div style="padding:40px;text-align:center;color:white;"><div style="font-size:48px">⚠️</div><div style="font-size:18px;margin-top:16px">โหลดแอปไม่สำเร็จ</div><div style="color:#8b8fa8;font-size:13px;margin-top:8px">กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต แล้วรีเฟรชหน้านี้</div><button onclick="location.reload()" style="margin-top:20px;padding:10px 24px;background:#4f46e5;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit">🔄 รีเฟรช</button></div>';}
};
</script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// Firebase
const FB="https://simtracker-3a70d-default-rtdb.asia-southeast1.firebasedatabase.app";
const DB={path:"/sims",ls:"sims_v2",arc:"/sims_archived"};
const toKey=s=>String(s).replace(/[.#$[\]\/]/g,"_");
const arcFB=s=>fbS(DB.arc+"/"+toKey(s.serial),s).catch(()=>{});
const searchArc=async serial=>{
  try{const d=await fbG(DB.arc+"/"+toKey(serial));if(d&&d.serial)return{...d,_archived:true};}catch(e){}
  return null;
};
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const fbG=p=>fetch(FB+p+".json").then(r=>r.json());
const fbS=(p,d)=>fetch(FB+p+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const fbP=(p,d)=>fetch(FB+p+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const fbD=p=>fetch(FB+p+".json",{method:"DELETE"});

const loadAll=async()=>{
  let loc=[];try{loc=JSON.parse(lsG(DB.ls)||"[]");}catch(e){}
  try{
    const d=await Promise.race([fbG(DB.path),new Promise((_,r)=>setTimeout(()=>r("to"),3000))]);
    if(d&&typeof d==="object"&&!d.error){
      const fb=Object.values(d).filter(s=>s&&s.serial);
      if(fb.length>0){
        const locMap={};loc.forEach(s=>{locMap[s.serial]=s;});
        const merged=fb.map(s=>{const ls=locMap[s.serial];return ls?{...s,printed:s.printed||ls.printed||false,scannedByCustomer:s.scannedByCustomer||ls.scannedByCustomer||false}:s;});
        lsS(DB.ls,JSON.stringify(merged));
        return{sims:merged,bot:lsG("tg_bot")||"",chat:lsG("tg_chat")||""};
      }
    }
  }catch(e){}
  return{sims:loc,bot:lsG("tg_bot")||"",chat:lsG("tg_chat")||""};
};
const saveAll=(sims)=>{lsS(DB.ls,JSON.stringify(sims));const obj={};sims.forEach(s=>{obj[toKey(s.serial)]=s;});fbS(DB.path,obj).catch(()=>{});};
const addFB=s=>fbS(DB.path+"/"+toKey(s.serial),s).catch(()=>{});
const updFB=(serial,u)=>fbP(DB.path+"/"+toKey(serial),u).catch(()=>{});
const delFB=serial=>fbD(DB.path+"/"+toKey(serial)).catch(()=>{});
const tgSend=(bot,chat,text)=>{
  if(!bot||!chat)return;
  fetch("https://api.telegram.org/bot"+bot+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text})}).catch(()=>{});
};
const genNo=used=>{let n;do{n=String(Math.floor(Math.random()*99999)+1);}while(used.has(n));return n;};
const fmtD=ts=>ts?new Date(ts).toLocaleDateString("th-TH"):"-";
const todayS=()=>new Date().toISOString().slice(0,10);
const makeURL=(s,t,bot,chat,phone)=>{
  let u="https://programsimpro-del.github.io/Sim/?s="+encodeURIComponent(s)+"&t="+encodeURIComponent(t);
  if(bot)u+="&tgbot="+encodeURIComponent(bot);
  if(chat)u+="&tgchat="+encodeURIComponent(chat);
  if(phone)u+="&phone="+encodeURIComponent(phone);
  return u;
};

const C={
  card:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:16,margin:"12px 12px 0"},
  h3:{color:"#e2e8f0",fontSize:15,fontWeight:700,marginBottom:12},
  inp:{width:"100%",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 14px",color:"white",fontSize:14,outline:"none"},
  btnP:{background:"linear-gradient(135deg,#4f46e5,#7c3aed)",border:"none",borderRadius:10,padding:"10px 18px",color:"white",fontWeight:700,cursor:"pointer",fontSize:14},
  btnS:{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 14px",color:"#e2e8f0",fontWeight:600,cursor:"pointer",fontSize:13},
  btnD:{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"8px 12px",color:"#f87171",cursor:"pointer",fontSize:12},
  btnX:{background:"rgba(239,68,68,0.2)",border:"1px solid rgba(239,68,68,0.5)",borderRadius:10,padding:"10px 14px",color:"#f87171",fontWeight:700,cursor:"pointer"},
  th:{padding:"8px 10px",background:"rgba(255,255,255,0.06)",color:"#94a3b8",fontSize:12,fontWeight:600,textAlign:"left",borderBottom:"1px solid rgba(255,255,255,0.08)"},
  td:{padding:"10px",borderBottom:"1px solid rgba(255,255,255,0.05)",color:"#e2e8f0",fontSize:13},
};

function QR({text,size}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!text)return;
    ref.current.innerHTML="";
    try{new QRCode(ref.current,{text,width:size||120,height:size||120,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});}catch(e){}
  },[text,size]);
  return React.createElement("div",{ref,style:{background:"white",padding:4,borderRadius:4,display:"inline-block"}});
}

function QRModal({sim,bot,chat,onClose}){
  const url=makeURL(sim.serial,sim.trackingNo,bot,chat,sim.phone||"");
  const ft=sim.simType==="free"?" (ฟรีเน็ตเดือนแรก)":"";
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"white",borderRadius:16,padding:20,maxWidth:300,width:"100%",textAlign:"center",color:"#000"}} onClick={e=>e.stopPropagation()}>
        <QR text={url} size={180}/>
        {sim.phone
          ?<div style={{fontWeight:700,marginTop:8,fontSize:13}}>📞 {sim.phone}</div>
          :<div style={{color:"#d97706",marginTop:8,fontSize:12}}>📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>}
        <div style={{fontWeight:700,marginTop:4,fontSize:13}}>ซิมหมายเลข: {sim.trackingNo}{ft}</div>
        <div style={{fontSize:10,marginTop:4,color:"#444",lineHeight:1.5}}>สแกน QR Code เพื่อรับบาร์โค้ดซิมและลงทะเบียนซิมที่นี่</div>
        <div style={{fontSize:10,fontWeight:800,marginTop:3}}>⚠️ ต้องสแกนลงทะเบียนผ่าน QR Code นี้เท่านั้น</div>
        <div style={{fontSize:9,fontWeight:700,marginTop:5,borderTop:"1px solid #ddd",paddingTop:5,lineHeight:1.6}}>
          ⚠️ สำคัญมาก !!! ห้ามลงทะเบียนซิมหลังเวลา 17:00 น.<br/>
          เพราะจะทำให้ซิมใช้งานไม่ได้<br/>
          ถ้าเกิน 17:00 น. ต้องรอลงทะเบียนวันถัดไป<br/>
          ทางร้านหยุดให้บริการทุกวันอาทิตย์และวันหยุดนักขัตฤกษ์
        </div>
        <a href={url} target="_blank" rel="noopener noreferrer" style={{display:"block",marginTop:10,padding:"8px 16px",background:"#4f46e5",color:"white",borderRadius:8,textDecoration:"none",fontWeight:700,fontSize:13}}>🔗 ทดสอบ QR</a>
        <button onClick={onClose} style={{...C.btnS,width:"100%",marginTop:8,color:"#000"}}>ปิด</button>
      </div>
    </div>
  );
}

function Scanner({onScan,sims}){
  const [serial,setSerial]=useState("");
  const [phone,setPhone]=useState("");
  const [code,setCode]=useState("K");
  const [camS,setCamS]=useState(false);
  const [camP,setCamP]=useState(false);
  const [msgS,setMsgS]=useState("");
  const [msgP,setMsgP]=useState("");
  const [prev,setPrev]=useState("");
  const [rsv,setRsv]=useState("");
  const svRef=useRef(null),pvRef=useRef(null),pcRef=useRef(null);
  const srRef=useRef(null),ocrRef=useRef(null),cool=useRef(false);

  const calcP=useCallback((val)=>{
    if(!val.trim()){setPrev("");setRsv("");return;}
    const ex=sims.find(s=>s.serial===val.trim());
    if(ex){setPrev("⚠️ มีอยู่แล้ว: "+ex.trackingNo);setRsv("");return;}
    const n=genNo(new Set(sims.map(s=>s.trackingNo)));
    setRsv(n);setPrev("เลขติดตามซิม: "+(code?code+n:n));
  },[sims,code]);

  useEffect(()=>{
    if(!camS){
      if(srRef.current){try{srRef.current.reset();}catch(e){}srRef.current=null;}
      setMsgS("");return;
    }
    setCamP(false);
    const start=()=>{
      if(!window.ZXing||!svRef.current)return;
      const h=new Map();
      h.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS,[window.ZXing.BarcodeFormat.CODE_128,window.ZXing.BarcodeFormat.CODE_39,window.ZXing.BarcodeFormat.EAN_13]);
      h.set(window.ZXing.DecodeHintType.TRY_HARDER,true);
      const r=new window.ZXing.BrowserMultiFormatReader(h);
      srRef.current=r;setMsgS("🔍 ชี้กล้องที่บาร์โค้ดซีเรียล...");
      r.decodeFromVideoDevice(null,svRef.current,res=>{
        if(res&&!cool.current&&res.getText().length>=10){
          cool.current=true;
          const t=res.getText().trim();
          setSerial(t);calcP(t);
          setMsgS("✅ ได้ซีเรียล: "+t.slice(0,14)+"...");
          setCamS(false);
          setTimeout(()=>{cool.current=false;},1500);
        }
      });
    };
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
      .then(st=>{if(svRef.current){svRef.current.srcObject=st;svRef.current.play();}if(window.ZXing)start();else{const sc=document.createElement("script");sc.src="https://unpkg.com/@zxing/library@latest/umd/index.min.js";sc.onload=start;document.head.appendChild(sc);}})
      .catch(e=>setMsgS("❌ "+e.message));
    return()=>{if(srRef.current){try{srRef.current.reset();}catch(e){}srRef.current=null;}};
  },[camS]);

  useEffect(()=>{
    if(!camP){if(ocrRef.current){clearInterval(ocrRef.current);ocrRef.current=null;}setMsgP("");return;}
    setCamS(false);
    const runOCR=()=>{
      if(!pvRef.current||!pcRef.current)return;
      const v=pvRef.current,cv=pcRef.current;
      cv.width=v.videoWidth;cv.height=v.videoHeight;
      cv.getContext("2d").drawImage(v,0,0);
      if(!window.Tesseract)return;
      window.Tesseract.recognize(cv,"eng",{tessedit_char_whitelist:"0123456789"}).then(({data:{text}})=>{
        const m=text.replace(/\D/g,"").match(/0[689]\d{8}/);
        if(m){setPhone(m[0]);setMsgP("✅ เบอร์: "+m[0]);clearInterval(ocrRef.current);ocrRef.current=null;setCamP(false);}
      }).catch(()=>{});
    };
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
      .then(st=>{
        if(pvRef.current){pvRef.current.srcObject=st;pvRef.current.play();}
        setMsgP("🔍 ชี้กล้องที่เบอร์โทร...");
        const lt=cb=>{if(window.Tesseract){cb();return;}const sc=document.createElement("script");sc.src="https://unpkg.com/tesseract.js@4/dist/tesseract.min.js";sc.onload=cb;document.head.appendChild(sc);};
        lt(()=>{ocrRef.current=setInterval(runOCR,1500);});
      }).catch(e=>setMsgP("❌ "+e.message));
    return()=>{if(ocrRef.current){clearInterval(ocrRef.current);ocrRef.current=null;}};
  },[camP]);

  const go=()=>{
    if(!serial.trim())return;
    onScan(serial.trim(),rsv||null,phone.trim()||null,code||null);
    setSerial("");setPhone("");setPrev("");setRsv("");
  };

  return(
    <div style={C.card}>
      <h3 style={C.h3}>📷 ยิงเลขซีเรียลซิม</h3>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14}}>
        <span style={{color:"#94a3b8",fontSize:13,fontWeight:600}}>โค้ดซิม:</span>
        {["K","L"].map(k=>(
          <button key={k} onClick={()=>setCode(k)}
            style={{padding:"8px 24px",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:15,
              background:code===k?(k==="K"?"linear-gradient(135deg,#4f46e5,#7c3aed)":"linear-gradient(135deg,#059669,#10b981)"):"rgba(255,255,255,0.06)",
              color:code===k?"white":"#8b8fa8"}}>{k}</button>
        ))}
      </div>

      <div style={{background:"rgba(16,185,129,0.06)",border:"1px solid rgba(16,185,129,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{color:"#6ee7b7",fontSize:13,fontWeight:700}}>📞 เบอร์โทร</span>
          <button onClick={()=>setCamP(v=>!v)} style={{...camP?C.btnX:C.btnS,fontSize:12,padding:"6px 14px"}}>{camP?"🔴 ปิด":"📷 สแกนเบอร์"}</button>
        </div>
        {camP&&<div style={{marginBottom:8}}>
          <video ref={pvRef} style={{width:"100%",borderRadius:10,border:"2px solid #10b981",display:"block"}} playsInline muted/>
          <canvas ref={pcRef} style={{display:"none"}}/>
          <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,textAlign:"center",background:"rgba(16,185,129,0.1)",color:"#6ee7b7"}}>{msgP||"กำลังเตรียม..."}</div>
        </div>}
        <div style={{display:"flex",gap:8}}>
          <input style={{...C.inp,flex:1}} value={phone} onChange={e=>setPhone(e.target.value.replace(/[^0-9]/g,""))} placeholder="OCR อัตโนมัติ หรือกรอกเอง" maxLength={10} inputMode="numeric"/>
          {phone&&<button onClick={()=>setPhone("")} style={{...C.btnD,padding:"8px 10px"}}>✕</button>}
        </div>
        {phone&&<div style={{color:"#6ee7b7",fontSize:12,marginTop:4}}>✅ {phone}</div>}
        {!phone&&serial&&<div style={{color:"#f59e0b",fontSize:11,marginTop:4}}>📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>}
      </div>

      <div style={{background:"rgba(79,70,229,0.06)",border:"1px solid rgba(79,70,229,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{color:"#a5b4fc",fontSize:13,fontWeight:700}}>📋 เลขซีเรียลซิม</span>
          <button onClick={()=>setCamS(v=>!v)} style={{...camS?C.btnX:C.btnS,fontSize:12,padding:"6px 14px"}}>{camS?"🔴 ปิด":"📷 สแกนซีเรียล"}</button>
        </div>
        {camS&&<div style={{marginBottom:8}}>
          <div style={{position:"relative"}}>
            <video ref={svRef} style={{width:"100%",borderRadius:10,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
            <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(99,102,241,0.8)",transform:"translateY(-50%)"}}/>
          </div>
          <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,textAlign:"center",background:"rgba(79,70,229,0.1)",color:"#a5b4fc"}}>{msgS||"กำลังเตรียม..."}</div>
        </div>}
        <div style={{display:"flex",gap:8}}>
          <input style={{...C.inp,flex:1}} value={serial} onChange={e=>{setSerial(e.target.value);calcP(e.target.value);}} placeholder="สแกนหรือกรอกเลขซีเรียล" onKeyDown={e=>e.key==="Enter"&&go()}/>
          <button style={{...C.btnP,opacity:serial.trim()?1:0.4}} onClick={go} disabled={!serial.trim()}>เพิ่ม ➕</button>
        </div>
      </div>

      {prev&&<div style={{padding:"10px 16px",background:prev.startsWith("⚠️")?"rgba(245,158,11,0.12)":"rgba(79,70,229,0.15)",border:"1px solid rgba(167,139,250,0.5)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{color:"#94a3b8",fontSize:12}}>{prev.startsWith("⚠️")?"⚠️ ซีเรียลซ้ำ":"เลขติดตาม ("+code+"):"}</span>
        <span style={{color:"#a78bfa",fontSize:24,fontWeight:800}}>{prev.startsWith("⚠️")?prev.replace("⚠️ มีอยู่แล้ว: ",""):prev.replace("เลขติดตามซิม: ","")}</span>
      </div>}

      {sims.length>0&&<div style={{...C.card,margin:"12px 0 0",padding:12}}>
        <div style={{color:"#8b8fa8",fontSize:12,fontWeight:600,marginBottom:8}}>🕐 เพิ่มล่าสุด</div>
        {sims.slice(0,5).map(s=><div key={s.serial} style={{padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
          <div style={{color:"white",fontFamily:"monospace",fontSize:12}}>{s.serial}</div>
          <div style={{color:"#a78bfa",fontSize:11}}>เลขติดตาม: {s.trackingNo}</div>
        </div>)}
      </div>}
    </div>
  );
}
function QRMain({sims,bot,chat,onMarkPrinted,onUnmarkPrinted,onDeleteSim,onPreview}){
  const [sub,setSub]=useState("new");
  const [sel,setSel]=useState([]);
  const [q,setQ]=useState("");
  const [printing,setPrinting]=useState(false);
  const notP=sims.filter(s=>!s.printed),done=sims.filter(s=>s.printed);
  const cur=sub==="new"?notP:done;
  const fl=cur.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const tog=s=>setSel(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s]);

  const moveToDone=()=>{
    if(!sel.length)return;
    const mv=[...sel];setSel([]);
    setTimeout(()=>{onMarkPrinted(mv);setTimeout(()=>setSub("done"),400);},50);
  };

  const doPrint=async()=>{
    const tp=sims.filter(s=>sel.includes(s.serial));
    if(!tp.length)return;
    setPrinting(true);
    const qm={};
    for(const s of tp){
      const url=makeURL(s.serial,s.trackingNo,bot,chat,s.phone||"");
      await new Promise(res=>{
        const d=document.createElement("div");
        d.style.cssText="position:absolute;left:-9999px;top:-9999px";
        document.body.appendChild(d);
        try{
          new QRCode(d,{text:url,width:200,height:200,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
          setTimeout(()=>{
            const cv=d.querySelector("canvas");
            if(cv)qm[s.serial]=cv.toDataURL();
            try{document.body.removeChild(d);}catch(e){}
            res();
          },400);
        }catch(e){try{document.body.removeChild(d);}catch(e2){}res();}
      });
    }
    const PR=JSON.parse(lsG("sim_print_prefs")||'{"w":100,"h":75,"q":40,"f":8}');
    const cards=tp.map(s=>{
      const ft=s.simType==="free"?" (ฟรีเน็ตเดือนแรก)":"";
      const ph=s.phone?'<div class="ph">📞 '+s.phone+'</div>':'<div class="pw">📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>';
      const img=qm[s.serial]?'<img src="'+qm[s.serial]+'" width="200" height="200" style="width:'+PR.q+'mm;height:'+PR.q+'mm"/>':"";"";

function Summary({sims,bot,chat}){

    </div>

    <h4 style={{color:"#e2e8f0",fontSize:13,fontWeight:700,margin:"16px 0 8px"}}>📅 สรุปรายวัน</h4>
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>{["วันที่","เพิ่มซิม","ลงทะเบียน"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
        <tbody>{Object.entries(sm).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,v])=>(
          <tr key={date} style={{background:date===today?"rgba(5,150,105,0.08)":"transparent"}}>
            <td style={{...C.td,color:date===today?"#6ee7b7":"#e2e8f0"}}>{date}</td>
            <td style={{...C.td,textAlign:"center"}}>{v.a}</td>
            <td style={{...C.td,textAlign:"center",color:"#6ee7b7"}}>{v.sc}</td>
          </tr>
        ))}</tbody>
      </table>
    </div>
  </div>;
}

function Settings({bot,chat,setBot,setChat,onSave}){
  const [b,setB]=useState(bot),[cc,setCC]=useState(chat);
  return<div style={C.card}>
    <h3 style={C.h3}>⚙️ ตั้งค่า Telegram</h3>
    <div style={{marginBottom:12}}><div style={{color:"#94a3b8",fontSize:12,marginBottom:6}}>Bot Token</div><input style={C.inp} value={b} onChange={e=>setB(e.target.value)} placeholder="Bot Token..."/></div>
    <div style={{marginBottom:16}}><div style={{color:"#94a3b8",fontSize:12,marginBottom:6}}>Chat ID</div><input style={C.inp} value={cc} onChange={e=>setCC(e.target.value)} placeholder="Chat ID..."/></div>
    <button style={C.btnP} onClick={()=>{setBot(b);setChat(cc);lsS("tg_bot",b);lsS("tg_chat",cc);onSave();}}>💾 บันทึก</button>
  </div>;
}

function ArchivedTab(){
  const [sims,setSims]=useState([]);
  const [loading,setLoading]=useState(true);
  const [q,setQ]=useState("");
  const [found,setFound]=useState(null);
  const [searching,setSearching]=useState(false);

  useEffect(()=>{
    setLoading(true);
    fbG(DB.arc).then(d=>{
      if(d&&typeof d==="object"&&!d.error){
        const list=Object.values(d).filter(s=>s&&s.serial);
        list.sort((a,b)=>(b.printedAt||0)-(a.printedAt||0));
        setSims(list);
      }else setSims([]);
      setLoading(false);
    }).catch(()=>{setSims([]);setLoading(false);});
  },[st]);

  const search=async()=>{
    if(!q.trim())return;
    setSearching(true);setFound(null);
    const r=await searchArc(q.trim());
    setFound(r||false);
    setSearching(false);
  };

  const fl=sims.filter(s=>!q||s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));

  return<div style={C.card}>
    <h3 style={C.h3}>🗃️ ซิมที่พิมพ์แล้ว (Archive) — {sims.length} รายการ</h3>
    <div style={{color:"#8b8fa8",fontSize:12,marginBottom:12}}>ซิมเหล่านี้ถูกลบออกจากระบบหลักแล้ว แต่ลูกค้ายังใช้ QR ได้ปกติ</div>

    <div style={{display:"flex",gap:8,marginBottom:12}}>
      <input style={{...C.inp,flex:1}} value={q} onChange={e=>setQ(e.target.value)}
        placeholder="🔍 ค้นหา serial / เลขติดตาม..."
        onKeyDown={e=>e.key==="Enter"&&search()}/>
      <button style={C.btnP} onClick={search} disabled={searching}>{searching?"⏳":"🔍"}</button>
    </div>

    {found===false&&<div style={{padding:"10px 14px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,color:"#f87171",fontSize:13,marginBottom:10}}>❌ ไม่พบ serial นี้ใน archive</div>}
    {found&&<div style={{padding:"10px 14px",background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.3)",borderRadius:10,marginBottom:10}}>
      <div style={{color:"#6ee7b7",fontWeight:700,fontSize:13}}>✅ พบ: {found.serial}</div>
      <div style={{color:"#94a3b8",fontSize:12}}>เลขติดตาม: {found.trackingNo} · พิมพ์เมื่อ: {found.printedAt?new Date(found.printedAt).toLocaleString("th-TH"):"-"}</div>
      {found.phone&&<div style={{color:"#6ee7b7",fontSize:12}}>📞 {found.phone}</div>}
      {found.scannedByCustomer&&<div style={{color:"#a78bfa",fontSize:12}}>✅ ลูกค้าสแกนแล้ว {found.scannedAt?new Date(found.scannedAt).toLocaleString("th-TH"):""}</div>}
    </div>}

    {loading?<div style={{textAlign:"center",padding:32,color:"#8b8fa8"}}>⏳ กำลังโหลด...</div>:
    fl.length===0?<div style={{textAlign:"center",padding:32,color:"#8b8fa8"}}>📭 ยังไม่มีซิมใน archive</div>:
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr>
          <th style={C.th}>Serial</th>
          <th style={C.th}>เลขติดตาม</th>
          <th style={C.th}>เบอร์</th>
          <th style={C.th}>พิมพ์เมื่อ</th>
          <th style={C.th}>สถานะ</th>
        </tr></thead>
        <tbody>{fl.map(s=><tr key={s.serial}>
          <td style={{...C.td,fontFamily:"monospace",fontSize:11}}>{s.serial}</td>
          <td style={C.td}>{s.trackingNo}</td>
          <td style={C.td}>{s.phone||"-"}</td>
          <td style={{...C.td,fontSize:11}}>{s.printedAt?new Date(s.printedAt).toLocaleString("th-TH"):"-"}</td>
          <td style={C.td}>{s.scannedByCustomer?<span style={{color:"#6ee7b7",fontWeight:700}}>✅ สแกนแล้ว</span>:<span style={{color:"#f59e0b"}}>⏳ รอสแกน</span>}</td>
        </tr>)}</tbody>
      </table>
    </div>}
  </div>;
}

function App(){
  const [sims,setSims]=useState([]);
  const [bot,setBot]=useState("");
  const [chat,setChat]=useState("");
  const [tab,setTab]=useState("scanner");
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    const timeout=setTimeout(()=>setLoading(false),8000);
    loadAll().then(d=>{clearTimeout(timeout);setSims(d.sims||[]);setBot(d.bot);setChat(d.chat);setLoading(false);})
      .catch(()=>{clearTimeout(timeout);setLoading(false);});
  },[]);

  // Auto-poll Telegram getUpdates ทุก 10 วินาที — ตรวจจับข้อความที่ลูกค้าสแกน QR
  const tgOffsetRef=useRef(parseInt(lsG("tg_offset")||"0"));
  const botRef=useRef(bot);
  const chatRef=useRef(chat);
  useEffect(()=>{botRef.current=bot;},[bot]);
  useEffect(()=>{chatRef.current=chat;},[chat]);

  const applyScanned=(serial)=>{
    const now=Date.now();
    let found=null;
    setSims(prev=>{
      let hit=false;
      const next=prev.map(s=>{
        if(s.serial!==serial||s.scannedByCustomer)return s;
        hit=true;
        found={...s,scannedByCustomer:true,scannedAt:now};
        updFB(serial,{scannedByCustomer:true,scannedAt:now});
        return{...s,scannedByCustomer:true,scannedAt:now};
      });
      if(hit)lsS(DB.ls,JSON.stringify(next));
      return hit?next:prev;
    });
    return found;
  };

  useEffect(()=>{
    if(!bot)return;
    const poll=async()=>{
      try{
        const offset=tgOffsetRef.current;
        const res=await fetch("https://api.telegram.org/bot"+botRef.current+"/getUpdates?timeout=0&offset="+offset);
        const data=await res.json();
        if(!data.ok||!data.result?.length)return;
        let maxId=offset;
        for(const upd of data.result){
          if(upd.update_id>=maxId)maxId=upd.update_id+1;
          const txt=upd.message?.text||upd.channel_post?.text||"";
          const m=txt.match(/เลขซีเรียลซิม[: \t]*([^\s\n]+)/)||txt.match(/serial[: ]+([^\s\n]+)/i)||txt.match(/s=([^&\s]+)/);
          if(m&&m[1]){
            const serial=m[1].trim();
            setTimeout(()=>{
              const s=applyScanned(serial);
              if(s){
                setToast({msg:"🔔 ลูกค้าสแกนซิมหมายเลข "+s.trackingNo+" แล้ว ✅",type:"ok"});
                setTimeout(()=>setToast(null),6000);
              }
            },100);
          }
        }
        if(maxId!==offset){
          tgOffsetRef.current=maxId;
          lsS("tg_offset",String(maxId));
        }
      }catch(e){}
    };
    poll();
    const iv=setInterval(poll,10000);
    return()=>clearInterval(iv);
  },[bot]);

  const t3=(msg,type)=>{setToast({msg,type:"ok",...(type?{type}:{})});setTimeout(()=>setToast(null),3000);};

  const addSim=(serial,rsv,phone,code)=>{
    if(sims.find(s=>s.serial===serial)){t3("⚠️ "+serial+" มีอยู่แล้ว","warn");return;}
    const raw=rsv||genNo(new Set(sims.map(s=>s.trackingNo)));
    const trk=code?code+raw:raw;
    const ns={serial,trackingNo:trk,phone:phone||"",simCode:code||"",scannedByCustomer:false,scannedAt:null,createdAt:Date.now(),printed:false};
    setSims(prev=>{const u=[ns,...prev];lsS(DB.ls,JSON.stringify(u));addFB(ns);return u;});
    t3("✅ เพิ่มซิม (เลขติดตาม: "+trk+")");
  };

  const delSim=serial=>{
    if(!confirm("ลบซิม "+serial+" ?"))return;
    setSims(prev=>{const u=prev.filter(s=>s.serial!==serial);saveAll(u);delFB(serial);return u;});
    t3("🗑️ ลบแล้ว","warn");
  };

  const updPhone=(serial,phone)=>{
    setSims(prev=>{const u=prev.map(s=>s.serial===serial?{...s,phone}:s);saveAll(u);updFB(serial,{phone});return u;});
    t3(phone?"✅ บันทึกเบอร์ "+phone:"✅ ลบเบอร์แล้ว");
  };

  const markP=serials=>{
    setSims(prev=>{
      const now=Date.now();
      const toArc=prev.filter(s=>serials.includes(s.serial));
      toArc.forEach(s=>{arcFB({...s,printed:true,printedAt:now});delFB(s.serial);});
      const u=prev.filter(s=>!serials.includes(s.serial));
      lsS(DB.ls,JSON.stringify(u));
      return u;
    });
    t3("✅ พิมพ์แล้ว — ย้ายซิม "+serials.length+" รายการออกจากระบบ (ค้นหาได้ที่แท็บ 🗃️)");
  };

  const unmarkP=async(serial)=>{
    const found=await searchArc(serial);
    if(found){
      const restored={...found,printed:false};delete restored._archived;
      setSims(prev=>{
        if(prev.find(s=>s.serial===serial))return prev;
        const u=[restored,...prev];
        lsS(DB.ls,JSON.stringify(u));
        addFB(restored);
        fbD(DB.arc+"/"+toKey(serial)).catch(()=>{});
        return u;
      });
      t3("↩️ ดึงซิมกลับจาก archive แล้ว");
    }else{t3("⚠️ ไม่พบซิมใน archive","warn");}
  };

  const markSc=serial=>{
    const now=Date.now();
    setSims(prev=>prev.map(s=>{
      if(s.serial!==serial)return s;
      tgSend(bot,chat,"🔔 ลูกค้าสแกน QR Code แล้ว!\n📋 เลขซีเรียลซิม: "+s.serial+"\n📞 เบอร์โทร: "+(s.phone||"รับหลังลงทะเบียนซิม")+"\n🔢 เลขติดตาม: "+s.trackingNo+"\n⏰ เวลา: "+new Date(now).toLocaleString("th-TH")+"\n✅ ระบบอัปเดตสถานะอัตโนมัติแล้ว");
      updFB(s.serial,{scannedByCustomer:true,scannedAt:now});
      return{...s,scannedByCustomer:true,scannedAt:now};
    }));
    t3("✅ อัปเดตสถานะแล้ว");
  };


  const pc=sims.filter(s=>!s.scannedByCustomer).length;
  const sc=sims.filter(s=>s.scannedByCustomer).length;

  const tabs=[
    {id:"scanner",label:"📷 ยิงซิม"},
    {id:"qr",label:"🔲 QR Code ("+sims.length+")"},
    {id:"archived",label:"🗃️ Archive"},
    {id:"pending",label:"⏳ รอสแกน ("+pc+")"},
    {id:"scanned",label:"📋 ลงทะเบียนแล้ว ("+sc+")"},
    {id:"list",label:"📋 รายการ"},
    {id:"summary",label:"📊 สรุป"},
    {id:"settings",label:"⚙️ ตั้งค่า"},
  ];

  if(loading)return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0a0a1a,#0f172a,#1a0a2e)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"white",fontFamily:"sans-serif",gap:16}}>
      <div style={{fontSize:52}}>📶</div>
      <div style={{fontSize:18,fontWeight:700}}>SIM Tracker</div>
      <div style={{color:"#8b8fa8",fontSize:13}}>กำลังโหลดข้อมูลจาก Firebase...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(255,255,255,0.1)",borderTop:"3px solid #a78bfa",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
    </div>
  );

  return(
    <div style={{minHeight:"100vh"}}>
      {toast&&<div style={{position:"fixed",top:20,right:16,zIndex:9999,background:toast.type==="ok"?"#059669":"#d97706",color:"white",padding:"10px 18px",borderRadius:12,fontWeight:600,fontSize:14,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast.msg}</div>}
      {modal&&<QRModal sim={modal} bot={bot} chat={chat} onClose={()=>setModal(null)}/>}

      <div style={{background:"rgba(15,15,40,0.95)",backdropFilter:"blur(20px)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
        <div style={{width:40,height:40,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📶</div>
        <div style={{flex:1}}><div style={{color:"white",fontWeight:800,fontSize:16}}>SIM Tracker</div><div style={{color:"#8b8fa8",fontSize:11,display:"flex",alignItems:"center",gap:4}}><span style={{width:6,height:6,borderRadius:"50%",background:"#6ee7b7",display:"inline-block",boxShadow:"0 0 6px #6ee7b7"}}></span>ซิงค์อัตโนมัติทุก 15 วิ</div></div>
        <div style={{textAlign:"center"}}><div style={{color:"#a78bfa",fontWeight:800,fontSize:20}}>{sims.length}</div><div style={{color:"#8b8fa8",fontSize:10}}>ซิมทั้งหมด</div></div>
        <div style={{textAlign:"center"}}><div style={{color:"#6ee7b7",fontWeight:800,fontSize:20}}>{sims.filter(s=>s.scannedByCustomer&&new Date(s.scannedAt||0).toISOString().slice(0,10)===todayS()).length}</div><div style={{color:"#8b8fa8",fontSize:10}}>สแกนวันนี้</div></div>
      </div>

      <div style={{display:"flex",overflowX:"auto",borderBottom:"1px solid rgba(255,255,255,0.08)",background:"rgba(15,15,40,0.6)"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{padding:"12px 14px",border:"none",borderBottom:tab===t.id?"2px solid #a78bfa":"2px solid transparent",background:"transparent",color:tab===t.id?"#a78bfa":"#64748b",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:12,whiteSpace:"nowrap"}}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{padding:"0 0 80px"}}>
        {tab==="scanner"&&<Scanner onScan={addSim} sims={sims}/>}
        {tab==="qr"&&<QRMain sims={sims} bot={bot} chat={chat} onMarkPrinted={markP} onUnmarkPrinted={unmarkP} onDeleteSim={delSim} onPreview={s=>setModal(s)}/>}
        {tab==="archived"&&<ArchivedTab/>}
        {tab==="pending"&&<PendingTab sims={sims} onMarkScanned={markSc} onPreview={s=>setModal(s)}/>}
        {tab==="scanned"&&<ScannedTab sims={sims}/>}
        {tab==="list"&&<SimList sims={sims} onDelete={delSim} onUpdatePhone={updPhone}/>}
        {tab==="summary"&&<Summary sims={sims} bot={bot} chat={chat} />}
        {tab==="settings"&&<Settings bot={bot} chat={chat} setBot={setBot} setChat={setChat} onSave={()=>t3("✅ บันทึกแล้ว")}/>}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>

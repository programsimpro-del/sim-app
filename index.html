<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>SIM Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0a0a1a,#0f172a,#1a0a2e);min-height:100vh;font-family:'Noto Sans Thai','Sarabun',sans-serif;color:white}
input,button,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.3);border-radius:2px}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ===== FIREBASE =====
const FB = "https://simtracker-3a70d-default-rtdb.asia-southeast1.firebasedatabase.app";
const TYPES = {
  plain: { path:"/sims_plain", ls:"sim_plain_v1", label:"ซิมเปล่า",        emoji:"📦", color:"#4f46e5" },
  free:  { path:"/sims_free",  ls:"sim_free_v1",  label:"ซิมฟรีเดือนแรก", emoji:"🎁", color:"#059669" },
};
const toKey = s => String(s).replace(/[.#$[\]]/g,"_");
const lsGet = k => { try{return localStorage.getItem(k)}catch(e){return null} };
const lsSet = (k,v) => { try{localStorage.setItem(k,v)}catch(e){} };
const fbGet    = p => fetch(`${FB}${p}.json`).then(r=>r.json());
const fbSet    = (p,d) => fetch(`${FB}${p}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const fbPatch  = (p,d) => fetch(`${FB}${p}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const fbDelete = p => fetch(`${FB}${p}.json`,{method:"DELETE"});

const loadType = async (t) => {
  const cfg = TYPES[t], raw = lsGet(cfg.ls)||"[]";
  let local = []; try{local=JSON.parse(raw)}catch(e){}
  try {
    const d = await Promise.race([fbGet(cfg.path),new Promise((_,r)=>setTimeout(()=>r("to"),5000))]);
    if(d && typeof d==="object" && !d.error){
      const fb = Object.values(d).filter(s=>s&&s.serial);
      if(fb.length>0){lsSet(cfg.ls,JSON.stringify(fb));return fb;}
    }
  } catch(e){}
  return local;
};
const loadAll = async () => {
  const [plain,free] = await Promise.all([loadType("plain"),loadType("free")]);
  return { plain, free, bot:lsGet("tg_bot")||"", chat:lsGet("tg_chat")||"" };
};
const saveType = (sims,t) => {
  const cfg=TYPES[t]; lsSet(cfg.ls,JSON.stringify(sims));
  const obj={}; sims.forEach(s=>{obj[toKey(s.serial)]=s;});
  fbSet(cfg.path,obj).catch(()=>{});
};
const addToFB  = (s,t) => fbSet(`${TYPES[t].path}/${toKey(s.serial)}`,s).catch(()=>{});
const updFB    = (serial,u,t) => fbPatch(`${TYPES[t].path}/${toKey(serial)}`,u).catch(()=>{});
const delFB    = (serial,t) => fbDelete(`${TYPES[t].path}/${toKey(serial)}`).catch(()=>{});
const tgSend   = (bot,chat,text) => {
  if(!bot||!chat)return;
  fetch(`https://api.telegram.org/bot${bot}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text})}).catch(()=>{});
};

// ===== UTILS =====
const genNo = (used) => {
  let n; do{ n=String(Math.floor(Math.random()*99999)+1); }while(used.has(n));
  return n;
};
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString("th-TH") : "-";
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString("th-TH") : "-";
const todayStr = () => new Date().toISOString().slice(0,10);

// ===== STYLES =====
const S = {
  root:{minHeight:"100vh"},
  card:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:16,margin:"12px 12px 0"},
  sectionTitle:{color:"#e2e8f0",fontSize:15,fontWeight:700,marginBottom:12},
  input:{width:"100%",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 14px",color:"white",fontSize:14,outline:"none"},
  btnP:{background:"linear-gradient(135deg,#4f46e5,#7c3aed)",border:"none",borderRadius:10,padding:"10px 18px",color:"white",fontWeight:700,cursor:"pointer",fontSize:14},
  btnS:{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 14px",color:"#e2e8f0",fontWeight:600,cursor:"pointer",fontSize:13},
  btnD:{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"8px 12px",color:"#f87171",cursor:"pointer",fontSize:12},
  btnDO:{background:"rgba(239,68,68,0.2)",border:"1px solid rgba(239,68,68,0.5)",borderRadius:10,padding:"10px 14px",color:"#f87171",fontWeight:700,cursor:"pointer"},
  btnG:{background:"rgba(5,150,105,0.2)",border:"1px solid rgba(5,150,105,0.4)",borderRadius:10,padding:"8px 14px",color:"#6ee7b7",cursor:"pointer",fontWeight:600},
  th:{padding:"8px 10px",background:"rgba(255,255,255,0.06)",color:"#94a3b8",fontSize:12,fontWeight:600,textAlign:"left",borderBottom:"1px solid rgba(255,255,255,0.08)"},
  td:{padding:"10px 10px",borderBottom:"1px solid rgba(255,255,255,0.05)",color:"#e2e8f0",fontSize:13},
};

// ===== SCANNER =====
function Scanner({ onScan, sims }) {
  const [serial, setSerial] = useState("");
  const [phone, setPhone] = useState("");
  const [simCode, setSimCode] = useState("K");
  const [camSerial, setCamSerial] = useState(false);
  const [camPhone, setCamPhone] = useState(false);
  const [msgSerial, setMsgSerial] = useState("");
  const [msgPhone, setMsgPhone] = useState("");
  const [preview, setPreview] = useState("");
  const [reserved, setReserved] = useState("");
  const svRef = useRef(null), pvRef = useRef(null), pcRef = useRef(null);
  const srRef = useRef(null), prRef = useRef(null), ocrRef = useRef(null), coolRef = useRef(false);

  const calcPreview = useCallback((val) => {
    if(!val.trim()){setPreview("");setReserved("");return;}
    const ex = sims.find(s=>s.serial===val.trim());
    if(ex){setPreview("⚠️ มีอยู่แล้ว: "+ex.trackingNo);setReserved("");return;}
    const n = genNo(new Set(sims.map(s=>s.trackingNo)));
    setReserved(n);
    setPreview("เลขติดตามซิม: "+(simCode?simCode+n:n));
  },[sims,simCode]);

  // กล้องซีเรียล
  useEffect(()=>{
    if(!camSerial){if(srRef.current){try{srRef.current.reset()}catch(e){}srRef.current=null;}setMsgSerial("");return;}
    setCamPhone(false);
    const start = () => {
      if(!window.ZXing||!svRef.current)return;
      const hints=new Map();
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS,[window.ZXing.BarcodeFormat.CODE_128,window.ZXing.BarcodeFormat.CODE_39,window.ZXing.BarcodeFormat.EAN_13]);
      hints.set(window.ZXing.DecodeHintType.TRY_HARDER,true);
      const r = new window.ZXing.BrowserMultiFormatReader(hints);
      srRef.current=r; setMsgSerial("🔍 ชี้กล้องที่บาร์โค้ดซีเรียล...");
      r.decodeFromVideoDevice(null,svRef.current,(res)=>{
        if(res&&!coolRef.current&&res.getText().length>=10){
          coolRef.current=true;
          const t=res.getText().trim();
          setSerial(t);calcPreview(t);setMsgSerial("✅ ซีเรียล: "+t.slice(0,16)+"...");
          setCamSerial(false);setTimeout(()=>{coolRef.current=false;},1500);
        }
      });
    };
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
      .then(st=>{if(svRef.current){svRef.current.srcObject=st;svRef.current.play();}})
      .catch(e=>setMsgSerial("❌ "+e.message));
    if(window.ZXing)start();
    else{const sc=document.createElement("script");sc.src="https://unpkg.com/@zxing/library@latest/umd/index.min.js";sc.onload=start;document.head.appendChild(sc);}
    return()=>{if(srRef.current){try{srRef.current.reset()}catch(e){}srRef.current=null;}};
  },[camSerial]);

  // กล้องเบอร์ (OCR)
  useEffect(()=>{
    if(!camPhone){if(prRef.current){try{prRef.current.reset()}catch(e){}prRef.current=null;}if(ocrRef.current){clearInterval(ocrRef.current);ocrRef.current=null;}setMsgPhone("");return;}
    setCamSerial(false);
    const runOCR=()=>{
      if(!pvRef.current||!pcRef.current)return;
      const v=pvRef.current,cv=pcRef.current;
      cv.width=v.videoWidth;cv.height=v.videoHeight;
      cv.getContext("2d").drawImage(v,0,0);
      if(!window.Tesseract)return;
      window.Tesseract.recognize(cv,"eng",{tessedit_char_whitelist:"0123456789"}).then(({data:{text}})=>{
        const m=text.replace(/\D/g,"").match(/0[689]\d{8}/);
        if(m){setPhone(m[0]);setMsgPhone("✅ เบอร์: "+m[0]);clearInterval(ocrRef.current);ocrRef.current=null;setCamPhone(false);}
      }).catch(()=>{});
    };
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
      .then(st=>{if(pvRef.current){pvRef.current.srcObject=st;pvRef.current.play();}setMsgPhone("🔍 ชี้กล้องที่เบอร์โทร...");
        const loadTess=(cb)=>{if(window.Tesseract){cb();return;}const sc=document.createElement("script");sc.src="https://unpkg.com/tesseract.js@4/dist/tesseract.min.js";sc.onload=cb;document.head.appendChild(sc);};
        loadTess(()=>{ocrRef.current=setInterval(runOCR,1500);});
      }).catch(e=>setMsgPhone("❌ "+e.message));
    return()=>{if(ocrRef.current){clearInterval(ocrRef.current);ocrRef.current=null;}};
  },[camPhone]);

  const go = () => {
    if(!serial.trim())return;
    onScan(serial.trim(),reserved||null,phone.trim()||null,simCode||null);
    setSerial("");setPhone("");setPreview("");setReserved("");
  };

  return (
    <div style={S.card}>
      <h3 style={S.sectionTitle}>📷 ยิงเลขซีเรียลซิม</h3>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14}}>
        <span style={{color:"#94a3b8",fontSize:13,fontWeight:600}}>โค้ดซิม:</span>
        {["K","L"].map(c=>(
          <button key={c} onClick={()=>setSimCode(c)}
            style={{padding:"8px 24px",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:15,
              background:simCode===c?(c==="K"?"linear-gradient(135deg,#4f46e5,#7c3aed)":"linear-gradient(135deg,#059669,#10b981)"):"rgba(255,255,255,0.06)",
              color:simCode===c?"white":"#8b8fa8"}}>
            {c}
          </button>
        ))}
      </div>

      {/* เบอร์โทร */}
      <div style={{background:"rgba(16,185,129,0.06)",border:"1px solid rgba(16,185,129,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{color:"#6ee7b7",fontSize:13,fontWeight:700}}>📞 เบอร์โทร</div>
          <button onClick={()=>setCamPhone(v=>!v)} style={{...camPhone?S.btnDO:S.btnS,fontSize:12,padding:"6px 14px"}}>
            {camPhone?"🔴 ปิดกล้อง":"📷 สแกนเบอร์"}
          </button>
        </div>
        {camPhone&&(
          <div style={{marginBottom:8}}>
            <video ref={pvRef} style={{width:"100%",borderRadius:10,border:"2px solid #10b981",display:"block"}} playsInline muted/>
            <canvas ref={pcRef} style={{display:"none"}}/>
            <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,textAlign:"center",background:"rgba(16,185,129,0.1)",color:"#6ee7b7"}}>{msgPhone||"กำลังเตรียม..."}</div>
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <input style={{...S.input,flex:1,borderColor:phone?"rgba(16,185,129,0.5)":"rgba(16,185,129,0.2)"}}
            value={phone} onChange={e=>setPhone(e.target.value.replace(/[^0-9]/g,""))}
            placeholder="OCR อัตโนมัติ หรือกรอกเอง" maxLength={10} inputMode="numeric"/>
          {phone&&<button onClick={()=>setPhone("")} style={{...S.btnD,padding:"8px 10px"}}>✕</button>}
        </div>
        {phone&&<div style={{color:"#6ee7b7",fontSize:12,marginTop:4}}>✅ {phone}</div>}
        {!phone&&serial&&<div style={{color:"#f59e0b",fontSize:11,marginTop:4}}>📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>}
      </div>

      {/* ซีเรียล */}
      <div style={{background:"rgba(79,70,229,0.06)",border:"1px solid rgba(79,70,229,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{color:"#a5b4fc",fontSize:13,fontWeight:700}}>📋 เลขซีเรียลซิม</div>
          <button onClick={()=>setCamSerial(v=>!v)} style={{...camSerial?S.btnDO:S.btnS,fontSize:12,padding:"6px 14px"}}>
            {camSerial?"🔴 ปิดกล้อง":"📷 สแกนซีเรียล"}
          </button>
        </div>
        {camSerial&&(
          <div style={{marginBottom:8}}>
            <div style={{position:"relative"}}>
              <video ref={svRef} style={{width:"100%",borderRadius:10,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
              <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(99,102,241,0.8)",transform:"translateY(-50%)"}}/>
            </div>
            <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,textAlign:"center",background:"rgba(79,70,229,0.1)",color:"#a5b4fc"}}>{msgSerial||"กำลังเตรียม..."}</div>
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <input style={{...S.input,flex:1,borderColor:serial?"rgba(99,102,241,0.5)":"rgba(99,102,241,0.2)"}}
            value={serial} onChange={e=>{setSerial(e.target.value);calcPreview(e.target.value);}}
            placeholder="สแกนหรือกรอกเลขซีเรียล" onKeyDown={e=>e.key==="Enter"&&go()}/>
          <button style={{...S.btnP,opacity:serial.trim()?1:0.4}} onClick={go} disabled={!serial.trim()}>เพิ่ม ➕</button>
        </div>
      </div>

      {preview&&(
        <div style={{padding:"10px 16px",background:preview.startsWith("⚠️")?"rgba(245,158,11,0.12)":"rgba(79,70,229,0.15)",border:`1px solid ${preview.startsWith("⚠️")?"rgba(245,158,11,0.4)":"rgba(167,139,250,0.5)"}`,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{color:"#94a3b8",fontSize:12}}>{preview.startsWith("⚠️")?"⚠️ ซีเรียลซ้ำ":`เลขติดตาม (${simCode}):`}</span>
          <span style={{color:preview.startsWith("⚠️")?"#fbbf24":"#a78bfa",fontSize:24,fontWeight:800,letterSpacing:2}}>
            {preview.startsWith("⚠️")?preview.replace("⚠️ มีอยู่แล้ว: ",""):preview.replace("เลขติดตามซิม: ","")}
          </span>
        </div>
      )}

      {/* เพิ่มล่าสุด */}
      {sims.length>0&&(
        <div style={{...S.card,margin:"12px 0 0",padding:12}}>
          <div style={{color:"#8b8fa8",fontSize:12,fontWeight:600,marginBottom:8}}>🕐 เพิ่มล่าสุด</div>
          {sims.slice(0,5).map(s=>(
            <div key={s.serial} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
              <div>
                <div style={{color:"white",fontFamily:"monospace",fontSize:12}}>{s.serial}</div>
                <div style={{color:"#a78bfa",fontSize:11}}>เลขติดตาม: {s.trackingNo}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ===== QR CODE =====
function QR({text,size=120}){
  const ref=useRef(null),inst=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    if(inst.current){try{ref.current.innerHTML="";}catch(e){}}
    try{inst.current=new QRCode(ref.current,{text,width:size,height:size,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});}catch(e){}
  },[text,size]);
  return <div ref={ref} style={{background:"white",padding:4,borderRadius:4,display:"inline-block"}}/>;
}

const makeQRUrl = (s,t,bot,chat,phone="") => {
  let u=`https://programsimpro-del.github.io/Sim/?s=${encodeURIComponent(s)}&t=${encodeURIComponent(t)}`;
  if(bot)u+=`&tgbot=${encodeURIComponent(bot)}`;
  if(chat)u+=`&tgchat=${encodeURIComponent(chat)}`;
  if(phone)u+=`&phone=${encodeURIComponent(phone)}`;
  return u;
};

// ===== QR CARD MODAL =====
function QRCard({sim,bot,chat,onClose}){
  const url = makeQRUrl(sim.serial,sim.trackingNo,bot,chat,sim.phone||"");
  const freeTag = sim.simType==="free"?" (ฟรีเน็ตเดือนแรก)":"";
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"white",borderRadius:16,padding:20,maxWidth:300,width:"100%",textAlign:"center",color:"#000"}} onClick={e=>e.stopPropagation()}>
        <QR text={url} size={180}/>
        {sim.phone?<div style={{fontWeight:700,marginTop:8}}>📞 {sim.phone}</div>:<div style={{color:"#d97706",marginTop:8}}>📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>}
        <div style={{fontWeight:700,marginTop:4}}>ซิมหมายเลข: {sim.trackingNo}{freeTag}</div>
        <div style={{fontSize:11,marginTop:4,color:"#444"}}>สแกน QR Code เพื่อรับบาร์โค้ดซิมและทำการลงทะเบียนซิมที่นี่</div>
        <div style={{fontSize:11,fontWeight:800,marginTop:4}}>⚠️ ต้องสแกนลงทะเบียนผ่าน QR Code นี้เท่านั้น</div>
        <div style={{fontSize:10,fontWeight:700,marginTop:6,borderTop:"1px solid #ccc",paddingTop:6,lineHeight:1.6}}>
          ⚠️ สำคัญมาก !!!<br/>
          ห้ามลงทะเบียนซิมหลังเวลา 17:00 น. โดยเด็ดขาด<br/>
          เพราะจะทำให้ซิมใช้งานไม่ได้<br/>
          ถ้าเกิน 17:00 น. ต้องรอลงทะเบียนวันถัดไป<br/>
          ทางร้านหยุดให้บริการทุกวันอาทิตย์และวันหยุดนักขัตฤกษ์
        </div>
        <a href={url} target="_blank" rel="noopener" style={{display:"block",marginTop:10,padding:"8px 16px",background:"#4f46e5",color:"white",borderRadius:8,textDecoration:"none",fontWeight:700}}>🔗 ทดสอบ QR</a>
        <button onClick={onClose} style={{...S.btnS,width:"100%",marginTop:8}}>ปิด</button>
      </div>
    </div>
  );
}

// ===== QR MAIN =====
function QRMain({sims,bot,chat,onMarkPrinted,onUnmarkPrinted,onDeleteSim,onPreview}){
  const [sub,setSub]=useState("new");
  const [sel,setSel]=useState([]);
  const [q,setQ]=useState("");
  const [printing,setPrinting]=useState(false);

  const notPrinted = sims.filter(s=>!s.printed);
  const printed = sims.filter(s=>s.printed);
  const cur = sub==="new"?notPrinted:printed;
  const fl = cur.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const tog = s => setSel(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s]);

  const moveToDone = () => {
    if(!sel.length)return;
    const toMove=[...sel];
    setSel([]);
    setTimeout(()=>{onMarkPrinted(toMove);setTimeout(()=>setSub("done"),400);},50);
  };

  const doPrint = async () => {
    const toPrint = sims.filter(s=>sel.includes(s.serial));
    if(!toPrint.length)return;
    setPrinting(true);
    const qrMap={};
    for(const s of toPrint){
      const url=makeQRUrl(s.serial,s.trackingNo,bot,chat,s.phone||"");
      await new Promise(res=>{
        const div=document.createElement("div");div.style.cssText="position:absolute;left:-9999px;top:-9999px";document.body.appendChild(div);
        try{
          new QRCode(div,{text:url,width:200,height:200,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
          setTimeout(()=>{const cv=div.querySelector("canvas");if(cv)qrMap[s.serial]=cv.toDataURL();try{document.body.removeChild(div);}catch(e){}res();},400);
        }catch(e){try{document.body.removeChild(div);}catch(e2){}res();}
      });
    }

    const PREF_KEY='sim_print_prefs';

max="297" style="width:55px;margin:0 4px;padding:4px;border:1px solid #999;border-radius:4px" oninput="upd()"/></label><label style="font-size:13px">QR(mm):<input id="q" type="number" value="${prefs.q}" min="20" max="80" style="width:50px;margin:0 4px;padding:4px;border:1px solid #999;border-radius:4px" oninput="upd()"/></label><label style="font-size:13px">ตัวอักษร(pt):<input id="f" type="number" value="${prefs.f}" min="5" max="16" style="width:50px;margin:0 4px;padding:4px;border:1px solid #999;border-radius:4px" oninput="upd()"/></label><label style="font-size:13px">แนว:<select id="ori" onchange="ori()" style="padding:4px;border:1px solid #999;border-radius:4px"><option value="portrait">แนวตั้ง</option><option value="landscape">แนวนอน</option></select></label></div><div class="grid">${cards}</div>\x3cscript>var PK='sim_print_prefs';function save(){try{localStorage.setItem(PK,JSON.stringify({w:+document.getElementById('w').value,h:+document.getElementById('h').value,q:+document.getElementById('q').value,f:+document.getElementById('f').value,orient:document.getElementById('ori').value}));}catch(e){}}function upd(){var w=+document.getElementById('w').value||100,h=+document.getElementById('h').value||75,q=+document.getElementById('q').value||40,f=+document.getElementById('f').value||8;document.querySelectorAll('.card').forEach(function(c){c.style.width=w+'mm';c.style.height=h+'mm';});document.querySelectorAll('.card img').forEach(function(i){i.style.width=q+'mm';i.style.height=q+'mm';});['phone','phone-wait','trk','lbl','must','warn'].forEach(function(cl,i){document.querySelectorAll('.'+cl).forEach(function(el){el.style.fontSize=[f+1,f+0.5,f+2,f-0.5,f,f-1][i]+'pt';});});var ps=document.getElementById('ps');if(!ps){ps=document.createElement('style');ps.id='ps';document.head.appendChild(ps);}ps.textContent='@media print{@page{size:'+w+'mm '+h+'mm;margin:0}.card{width:'+w+'mm!important;height:'+h+'mm!important}}';save();}function ori(){var o=document.getElementById('ori').value,w=+document.getElementById('w').value,h=+document.getElementById('h').value;if(o==='landscape'&&w<h){document.getElementById('w').value=h;document.getElementById('h').value=w;}else if(o==='portrait'&&w>h){document.getElementById('w').value=h;document.getElementById('h').value=w;}upd();}window.onload=function(){upd();};\x3c/script></body></html>`;

    const printedSerials=toPrint.map(s=>s.serial);
    onMarkPrinted(printedSerials);
    setSel([]);setPrinting(false);
    setTimeout(()=>setSub("done"),400);
    setTimeout(()=>{const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();}},200);
  };

  const subTabs=[
    {id:"new",  label:`🖨️ ยังไม่พิมพ์ (${notPrinted.length})`, color:"#a5b4fc"},
    {id:"done", label:`✅ พิมพ์แล้ว (${printed.length})`,       color:"#6ee7b7"},

  return (
    <div style={S.card}>
      <h3 style={{...S.sectionTitle,marginBottom:12}}>🔲 QR Code Serial Sim</h3>

              background:sub===t.id?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.04)",

                ✅ ย้ายไปพิมพ์แล้ว ({sel.length})

      {fl.length===0&&(
        <div style={{textAlign:"center",padding:36,color:"#8b8fa8"}}>

        </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(145px,1fr))",gap:10}}>
        {fl.map(s=>(
          <div key={s.serial} onClick={()=>tog(s.serial)}
            style={{background:sel.includes(s.serial)?"rgba(79,70,229,0.2)":"rgba(255,255,255,0.04)",
              border:`2px solid ${sel.includes(s.serial)?"#4f46e5":"rgba(255,255,255,0.08)"}`,
              borderRadius:12,padding:10,textAlign:"center",cursor:"pointer",position:"relative"}}>
            {sel.includes(s.serial)&&<div style={{position:"absolute",top:6,right:6,width:18,height:18,background:"#4f46e5",borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"white",fontWeight:700}}>✓</div>}
            <div style={{background:"#fff",borderRadius:8,padding:4,display:"inline-block",marginBottom:4}}>
              <QR text={makeQRUrl(s.serial,s.trackingNo,bot,chat,s.phone||"")} size={110}/>
            </div>
            {s.phone?<div style={{color:"#000",fontSize:10,fontWeight:700}}>📞 {s.phone}</div>:<div style={{color:"#000",fontSize:9}}>📞 รับหลังลงทะเบียน</div>}
            <div style={{display:"flex",alignItems:"center",gap:3,justifyContent:"center",marginTop:2}}>
              {s.simCode&&<span style={{background:s.simCode==="K"?"#4f46e5":"#059669",color:"white",fontSize:9,fontWeight:800,borderRadius:3,padding:"1px 4px"}}>{s.simCode}</span>}

            <div style={{display:"flex",gap:4,marginTop:6}}>

function EditPhone({sim,onUpdate}){
  const [edit,setEdit]=useState(false);
  const [val,setVal]=useState(sim.phone||"");
  if(edit)return(
    <div style={{display:"flex",gap:4}}>
      <input style={{...S.input,width:110,padding:"4px 8px",fontSize:12}} value={val} onChange={e=>setVal(e.target.value.replace(/[^0-9]/g,""))} maxLength={10} inputMode="numeric" autoFocus onKeyDown={e=>{if(e.key==="Enter"){onUpdate(sim.serial,val.trim());setEdit(false);}if(e.key==="Escape")setEdit(false);}}/>
      <button onClick={()=>{onUpdate(sim.serial,val.trim());setEdit(false);}} style={{...S.btnP,padding:"4px 8px",fontSize:11}}>✓</button>
      <button onClick={()=>setEdit(false)} style={{...S.btnS,padding:"4px 6px",fontSize:11}}>✕</button>
    </div>
  );
  return <div onClick={()=>setEdit(true)} style={{cursor:"pointer",minWidth:90}}>{sim.phone?<span style={{color:"#6ee7b7",fontSize:12,fontWeight:600}}>{sim.phone}</span>:<span style={{color:"#6b7280",fontSize:11,fontStyle:"italic"}}>+ เพิ่มเบอร์</span>}</div>;
}

function SimList({sims,onDelete,onUpdatePhone}){
  const [q,setQ]=useState("");const [pg,setPg]=useState(1);const pp=15;
  const [camScan,setCamScan]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const scanRef=useRef(null);const scanRdrRef=useRef(null);
  const fl=sims.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const pd=fl.slice((pg-1)*pp,pg*pp),pages=Math.ceil(fl.length/pp);

  useEffect(()=>{
    if(!camScan){if(scanRdrRef.current){try{scanRdrRef.current.reset();}catch(e){}scanRdrRef.current=null;}setScanMsg("");return;}
    const start=()=>{
      if(!window.ZXing||!scanRef.current)return;
      const hints=new Map();hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS,[window.ZXing.BarcodeFormat.CODE_128,window.ZXing.BarcodeFormat.CODE_39,window.ZXing.BarcodeFormat.EAN_13]);
      const r=new window.ZXing.BrowserMultiFormatReader(hints);scanRdrRef.current=r;setScanMsg("🔍 ชี้กล้องที่บาร์โค้ดซิม...");
      r.decodeFromVideoDevice(null,scanRef.current,(res)=>{if(res&&res.getText().length>=8){setQ(res.getText());setPg(1);setScanMsg("✅ พบ: "+res.getText());setCamScan(false);}});
    };
    if(window.ZXing)start();else{const sc=document.createElement("script");sc.src="https://unpkg.com/@zxing/library@latest/umd/index.min.js";sc.onload=start;document.head.appendChild(sc);}
    return()=>{if(scanRdrRef.current){try{scanRdrRef.current.reset();}catch(e){}scanRdrRef.current=null;}};
  },[camScan]);

  const csv=()=>{
    const h=["เลขซีเรียล","เลขติดตาม","เบอร์โทร","สถานะ","วันที่เพิ่ม"];
    const r=fl.map(s=>[s.serial,s.trackingNo,s.phone||"",s.scannedByCustomer?"✓":"-",fmtDate(s.createdAt)]);
    const blob=new Blob(["\uFEFF"+[h,...r].map(x=>x.join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
    Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:`sims_${todayStr()}.csv`}).click();
  };

  return (
    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <h3 style={{...S.sectionTitle,margin:0}}>📋 รายการซิมทั้งหมด ({fl.length})</h3>
        <button style={S.btnG} onClick={csv}>📥 Export CSV</button>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <input style={{...S.input,flex:1}} value={q} onChange={e=>{setQ(e.target.value);setPg(1);}} placeholder="🔍 ค้นหา..."/>
        <button onClick={()=>setCamScan(v=>!v)} style={{...camScan?S.btnDO:S.btnS,padding:"10px 14px"}}>{camScan?"🔴":"📷"}</button>
        {q&&<button onClick={()=>{setQ("");setPg(1);}} style={{...S.btnS,padding:"10px 10px",color:"#f87171"}}>✕</button>}
      </div>
      {camScan&&(
        <div style={{marginBottom:12}}>
          <video ref={scanRef} style={{width:"100%",borderRadius:10,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
          <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,textAlign:"center",background:"rgba(79,70,229,0.1)",color:"#a5b4fc"}}>{scanMsg||"กำลังเตรียม..."}</div>
        </div>
      )}
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr>{["#","เลขซีเรียล","เลขติดตาม","📞 เบอร์","สถานะ","วันที่","ลบ"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {pd.map((s,i)=>(
              <tr key={s.serial} style={{background:i%2===0?"rgba(255,255,255,0.02)":"transparent"}}>
                <td style={S.td}>{(pg-1)*pp+i+1}</td>
                <td style={{...S.td,fontFamily:"monospace",fontSize:11}}>{s.serial}</td>
                <td style={{...S.td,color:"#a78bfa",fontWeight:700}}>{s.trackingNo}</td>
                <td style={S.td}><EditPhone sim={s} onUpdate={onUpdatePhone}/></td>
                <td style={S.td}><span style={{padding:"2px 8px",borderRadius:99,fontSize:11,background:s.scannedByCustomer?"#064e3b":"#1e1b4b",color:s.scannedByCustomer?"#6ee7b7":"#a5b4fc"}}>{s.scannedByCustomer?"✓ ลงทะเบียน":"รอสแกน"}</span></td>
                <td style={{...S.td,fontSize:11,color:"#8b8fa8"}}>{fmtDate(s.createdAt)}</td>
                <td style={S.td}><button onClick={()=>onDelete(s.serial)} style={S.btnD}>🗑</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {pages>1&&(
        <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:12,flexWrap:"wrap"}}>
          {Array.from({length:pages},(_,i)=>(
            <button key={i} onClick={()=>setPg(i+1)} style={{...pg===i+1?S.btnP:S.btnS,padding:"6px 12px",fontSize:12}}>{i+1}</button>
          ))}
        </div>
      )}
    </div>
  );
}

// ===== SUMMARY =====
function Summary({sims,bot,chat,simType}){
  const [sending,setSending]=useState(false);
  const [lastSent,setLastSent]=useState("");
  const today=todayStr();
  const todayScanned=sims.filter(s=>s.scannedByCustomer&&s.scannedAt&&new Date(s.scannedAt).toISOString().slice(0,10)===today);
  const sm={};
  sims.forEach(s=>{const k=new Date(s.createdAt).toISOString().slice(0,10);if(!sm[k])sm[k]={a:0,sc:0};sm[k].a++;if(s.scannedByCustomer)sm[k].sc++;});

  const sendReport=async()=>{
    if(!bot||!chat){alert("กรุณาตั้งค่า Bot Token และ Chat ID ก่อน");return;}
    setSending(true);
    const now=new Date();
    const dateStr=now.toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"});
    const timeStr=now.toLocaleTimeString("th-TH");
    const typeName=TYPES[simType].emoji+" "+TYPES[simType].label;
    const lines=todayScanned.map((s,i)=>`${i+1}. ${s.serial}\n   📞 ${s.phone||"รับหลังลงทะเบียน"}\n   🔢 ซิมหมายเลข: ${s.trackingNo}\n   ⏰ ${s.scannedAt?new Date(s.scannedAt).toLocaleString("th-TH"):"-"}`).join("\n\n");
    const msg=`📊 รายงานประจำวัน ${typeName}\n📅 วันที่: ${dateStr} เวลา ${timeStr}\n${"─".repeat(28)}\n✅ ลงทะเบียนวันนี้: ${todayScanned.length} ซิม\n📦 ซิมทั้งหมด: ${sims.length} ซิม\n⏳ รอลงทะเบียน: ${sims.filter(s=>!s.scannedByCustomer).length} ซิม\n${"─".repeat(28)}\n`+(todayScanned.length>0?`📋 รายการวันนี้:\n\n${lines}`:"📋 ยังไม่มีลูกค้าลงทะเบียนวันนี้");
    try{
      const res=await fetch(`https://api.telegram.org/bot${bot}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text:msg})});
      if(res.ok){setLastSent(timeStr);alert("✅ ส่ง Report สำเร็จ!");}
      else alert("❌ ส่งไม่สำเร็จ กรุณาตรวจสอบ Bot Token และ Chat ID");
    }catch(e){alert("❌ "+e.message);}
    setSending(false);
  };

  return (
    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h3 style={{...S.sectionTitle,margin:0}}>📊 สรุปข้อมูล</h3>
        <button onClick={sendReport} disabled={sending} style={{...S.btnP,opacity:sending?0.6:1}}>
          {sending?"⏳ กำลังส่ง...":"📤 ส่ง Report Telegram"}
        </button>
      </div>
      {lastSent&&<div style={{background:"rgba(5,150,105,0.12)",border:"1px solid rgba(5,150,105,0.3)",borderRadius:10,padding:"8px 14px",marginBottom:12,fontSize:12,color:"#6ee7b7"}}>✅ ส่งล่าสุดเวลา {lastSent} น.</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
        {[{label:"ลงทะเบียนวันนี้",val:todayScanned.length,color:"#6ee7b7"},{label:"ซิมทั้งหมด",val:sims.length,color:"#a5b4fc"},{label:"รอลงทะเบียน",val:sims.filter(s=>!s.scannedByCustomer).length,color:"#fbbf24"}].map(item=>(
          <div key={item.label} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"12px 8px",textAlign:"center"}}>
            <div style={{color:item.color,fontSize:26,fontWeight:800}}>{item.val}</div>
            <div style={{color:"#8b8fa8",fontSize:11,marginTop:4}}>{item.label}</div>
          </div>
        ))}
      </div>
      <h4 style={{color:"#e2e8f0",fontSize:13,fontWeight:700,marginBottom:8}}>✅ ลงทะเบียนวันนี้ ({todayScanned.length})</h4>
      {todayScanned.length===0?<div style={{textAlign:"center",padding:20,color:"#8b8fa8"}}>ยังไม่มีลูกค้าลงทะเบียนวันนี้</div>:todayScanned.map((s,i)=>(
        <div key={s.serial} style={{background:"rgba(5,150,105,0.08)",border:"1px solid rgba(5,150,105,0.2)",borderRadius:10,padding:"10px 14px",marginBottom:8}}>
          <div style={{color:"white",fontFamily:"monospace",fontSize:12,fontWeight:700}}>{i+1}. {s.serial}</div>
          <div style={{color:"#6ee7b7",fontSize:11}}>📞 {s.phone||"รับหลังลงทะเบียน"}</div>
          <div style={{color:"#a78bfa",fontSize:11}}>🔢 {s.trackingNo}</div>
          {s.scannedAt&&<div style={{color:"#8b8fa8",fontSize:11}}>⏰ {new Date(s.scannedAt).toLocaleTimeString("th-TH")}</div>}
        </div>
      ))}
      <h4 style={{color:"#e2e8f0",fontSize:13,fontWeight:700,margin:"16px 0 8px"}}>📅 สรุปรายวัน</h4>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr>{["วันที่","เพิ่มซิม","ลงทะเบียน"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {Object.entries(sm).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,v])=>(
              <tr key={date} style={{background:date===today?"rgba(5,150,105,0.08)":"transparent"}}>
                <td style={{...S.td,color:date===today?"#6ee7b7":"#e2e8f0"}}>{date}</td>
                <td style={{...S.td,textAlign:"center"}}>{v.a}</td>
                <td style={{...S.td,textAlign:"center",color:"#6ee7b7"}}>{v.sc}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ===== SETTINGS =====
function Settings({bot,chat,setBot,setChat,onSave}){
  const [b,setB]=useState(bot);
  const [c,setC]=useState(chat);
  return (
    <div style={S.card}>
      <h3 style={S.sectionTitle}>⚙️ ตั้งค่า Telegram</h3>
      <div style={{marginBottom:12}}>
        <div style={{color:"#94a3b8",fontSize:12,marginBottom:6}}>Bot Token</div>
        <input style={S.input} value={b} onChange={e=>setB(e.target.value)} placeholder="1234567890:ABC..."/>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{color:"#94a3b8",fontSize:12,marginBottom:6}}>Chat ID</div>
        <input style={S.input} value={c} onChange={e=>setC(e.target.value)} placeholder="123456789"/>
      </div>
      <button style={S.btnP} onClick={()=>{setBot(b);setChat(c);lsSet("tg_bot",b);lsSet("tg_chat",c);onSave();}}>💾 บันทึก</button>
    </div>
  );
}

// ===== APP =====
function App(){
  const [simType,setSimType]=useState("plain");
  const [plainSims,setPlainSims]=useState([]);
  const [freeSims,setFreeSims]=useState([]);
  const [bot,setBot]=useState("");
  const [chat,setChat]=useState("");
  const [tab,setTab]=useState("scanner");
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  const [loading,setLoading]=useState(true);

  const sims = simType==="plain"?plainSims:freeSims;
  const setSims = fn => { if(simType==="plain")setPlainSims(fn); else setFreeSims(fn); };

  useEffect(()=>{
    loadAll().then(d=>{
      setPlainSims(d.plain||[]);
      setFreeSims(d.free||[]);
      setBot(d.bot);setChat(d.chat);
      setLoading(false);
    });
  },[]);

  const toast3=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const addSim=(serial,reserved=null,phone=null,simCode=null)=>{
    if(sims.find(s=>s.serial===serial)){toast3(`⚠️ ${serial} มีอยู่แล้ว`,"warn");return;}
    const raw=reserved||genNo(new Set(sims.map(s=>s.trackingNo)));
    const trackingNo=simCode?`${simCode}${raw}`:raw;
    const ns={serial,trackingNo,phone:phone||"",simCode:simCode||"",simType,scannedByCustomer:false,scannedAt:null,createdAt:Date.now(),printed:false};
    setSims(prev=>{const u=[ns,...prev];saveType(u,simType);addToFB(ns,simType);return u;});
    toast3(`✅ เพิ่มซิม (เลขติดตาม: ${trackingNo})`);
  };

  const delSim=(serial)=>{
    if(!confirm(`ลบซิม ${serial} ?`))return;
    setSims(prev=>{const u=prev.filter(s=>s.serial!==serial);saveType(u,simType);delFB(serial,simType);return u;});
    toast3("🗑️ ลบแล้ว","warn");
  };

  const updatePhone=(serial,phone)=>{
    setSims(prev=>{const u=prev.map(s=>s.serial===serial?{...s,phone}:s);saveType(u,simType);updFB(serial,{phone},simType);return u;});
    toast3(phone?`✅ บันทึกเบอร์ ${phone}`:"✅ ลบเบอร์แล้ว");
  };

  const markPrinted=(serials)=>{
    setSims(prev=>{
      const u=prev.map(s=>serials.includes(s.serial)?{...s,printed:true}:s);
      lsSet(TYPES[simType].ls,JSON.stringify(u));
      setTimeout(()=>serials.forEach(s=>updFB(s,{printed:true},simType)),100);
      return u;
    });
    toast3(`✅ ย้ายไปพิมพ์แล้ว ${serials.length} รายการ`);
  };

  const unmarkPrinted=(serial)=>{
    setSims(prev=>{const u=prev.map(s=>s.serial===serial?{...s,printed:false}:s);saveType(u,simType);updFB(serial,{printed:false},simType);return u;});
    toast3("↩️ ย้ายกลับยังไม่พิมพ์");
  };

  const markScanned=(serial)=>{
    const now=Date.now();
    setSims(prev=>prev.map(s=>{
      if(s.serial!==serial)return s;
      tgSend(bot,chat,`🔔 ลูกค้าสแกน QR Code แล้ว!\n📋 เลขซีเรียลซิม: ${s.serial}\n📞 เบอร์โทร: ${s.phone||"รับหลังลงทะเบียนซิม"}\n🔢 เลขติดตาม: ${s.trackingNo}\n⏰ เวลา: ${new Date(now).toLocaleString("th-TH")}\n\n✅ กรุณาอัปเดตสถานะในแอพ`);
      updFB(s.serial,{scannedByCustomer:true,scannedAt:now},simType);
      return {...s,scannedByCustomer:true,scannedAt:now};
    }));
    toast3("✅ อัปเดตสถานะแล้ว");
  };

  const pendingCount=sims.filter(s=>!s.scannedByCustomer).length;
  const scannedCount=sims.filter(s=>s.scannedByCustomer).length;

  const tabs=[
    {id:"scanner",label:"📷 ยิงซิม"},
    {id:"qr",label:`🔲 QR Code (${sims.length})`},
    {id:"pending",label:`⏳ รอสแกน (${pendingCount})`},
    {id:"scanned",label:`📋 ลงทะเบียนแล้ว (${scannedCount})`},
    {id:"list",label:"📋 รายการ"},
    {id:"summary",label:"📊 สรุป"},
    {id:"settings",label:"⚙️ ตั้งค่า"},
  ];

  if(loading)return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0a0a1a,#0f172a,#1a0a2e)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"white",fontFamily:"sans-serif",gap:16}}>
      <div style={{fontSize:52}}>📶</div>
      <div style={{fontSize:18,fontWeight:700}}>SIM Tracker</div>
      <div style={{color:"#8b8fa8",fontSize:13}}>กำลังโหลดข้อมูลจาก Firebase...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(255,255,255,0.1)",borderTop:"3px solid #a78bfa",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return (
    <div style={S.root}>
      {toast&&<div style={{position:"fixed",top:20,right:16,zIndex:9999,background:toast.type==="ok"?"#059669":"#d97706",color:"white",padding:"10px 18px",borderRadius:12,fontWeight:600,fontSize:14,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast.msg}</div>}
      {modal&&<QRCard sim={modal} bot={bot} chat={chat} onClose={()=>setModal(null)}/>}

      {/* Header */}
      <div style={{background:"rgba(15,15,40,0.95)",backdropFilter:"blur(20px)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
        <div style={{width:40,height:40,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📶</div>
        <div style={{flex:1}}>
          <div style={{color:"white",fontWeight:800,fontSize:16}}>SIM Tracker</div>
          <div style={{color:"#8b8fa8",fontSize:11}}>ระบบติดตามการเปิดใช้งานซิม</div>
        </div>
        <div style={{textAlign:"center"}}><div style={{color:"#a78bfa",fontWeight:800,fontSize:20}}>{sims.length}</div><div style={{color:"#8b8fa8",fontSize:10}}>ซิมทั้งหมด</div></div>
        <div style={{textAlign:"center"}}><div style={{color:"#6ee7b7",fontWeight:800,fontSize:20}}>{sims.filter(s=>s.scannedByCustomer&&new Date(s.scannedAt||0).toISOString().slice(0,10)===todayStr()).length}</div><div style={{color:"#8b8fa8",fontSize:10}}>สแกนวันนี้</div></div>
      </div>

      {/* SimType */}
      <div style={{background:"rgba(0,0,0,0.3)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"8px 12px",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{color:"#94a3b8",fontSize:12,fontWeight:600}}>ประเภทซิม:</span>
        {Object.entries(TYPES).map(([key,cfg])=>(
          <button key={key} onClick={()=>{setSimType(key);setTab("scanner");}}
            style={{padding:"7px 18px",border:"none",borderRadius:20,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,
              background:simType===key?cfg.color:"rgba(255,255,255,0.08)",
              color:simType===key?"white":"#8b8fa8",
              outline:simType===key?`2px solid ${cfg.color}`:"none"}}>
            {cfg.emoji} {cfg.label}
            {simType===key&&<span style={{marginLeft:6,background:"rgba(255,255,255,0.2)",borderRadius:99,padding:"1px 7px",fontSize:11}}>{sims.length}</span>}
          </button>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:"flex",overflowX:"auto",borderBottom:"1px solid rgba(255,255,255,0.08)",background:"rgba(15,15,40,0.6)"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{padding:"12px 14px",border:"none",borderBottom:tab===t.id?"2px solid #a78bfa":"2px solid transparent",background:"transparent",color:tab===t.id?"#a78bfa":"#64748b",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:12,whiteSpace:"nowrap"}}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{padding:"0 0 80px"}}>
        {tab==="scanner"&&<Scanner onScan={addSim} sims={sims}/>}
        {tab==="qr"&&<QRMain sims={sims} bot={bot} chat={chat} onMarkPrinted={markPrinted} onUnmarkPrinted={unmarkPrinted} onDeleteSim={delSim} onPreview={s=>setModal(s)}/>}
        {tab==="pending"&&<PendingTab sims={sims} onMarkScanned={markScanned} onPreview={s=>setModal(s)}/>}
        {tab==="scanned"&&<ScannedTab sims={sims}/>}
        {tab==="list"&&<SimList sims={sims} onDelete={delSim} onUpdatePhone={updatePhone}/>}
        {tab==="summary"&&<Summary sims={sims} bot={bot} chat={chat} simType={simType}/>}
        {tab==="settings"&&<Settings bot={bot} chat={chat} setBot={setBot} setChat={setChat} onSave={()=>toast3("✅ บันทึกแล้ว")}/>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>

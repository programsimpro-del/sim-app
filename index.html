<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ===== FIREBASE REALTIME DATABASE =====
const FB_URL  = "https://simtracker-3a70d-default-rtdb.asia-southeast1.firebasedatabase.app";
const K_BOT   = "simtracker_bot_v1";
const K_CHAT  = "simtracker_chat_v1";
// path แยกตามประเภทซิม
const SIM_PATHS = {
  plain: { fbPath: "/sims_plain", lsKey: "sim_plain_v1", label: "ซิมเปล่า",       color: "#4f46e5", emoji: "📦" },
  free:  { fbPath: "/sims_free",  lsKey: "sim_free_v1",  label: "ซิมฟรีเดือนแรก", color: "#059669", emoji: "🎁" },
};
const K_SIMS = "sim_plain_v1"; // compat

const lsGet = (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };

// แปลง serial เป็น Firebase key
const toKey = (serial) => String(serial).replace(/[.#$[\]]/g, "_");

// Firebase REST API
const fbGet    = (path) => fetch(`${FB_URL}${path}.json`).then(r => r.json());
const fbSet    = (path, data) => fetch(`${FB_URL}${path}.json`, { method:"PUT",    headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) });
const fbPatch  = (path, data) => fetch(`${FB_URL}${path}.json`, { method:"PATCH",  headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) });
const fbDelete = (path)       => fetch(`${FB_URL}${path}.json`, { method:"DELETE" });

// โหลดข้อมูลตามประเภทซิม
const loadSimsByType = async (simType) => {
  const cfg = SIM_PATHS[simType];
  const localRaw = lsGet(cfg.lsKey) || "[]";
  let localSims = [];
  try { localSims = JSON.parse(localRaw); } catch(e) {}
  try {
    const data = await Promise.race([
      fbGet(cfg.fbPath),
      new Promise((_, rej) => setTimeout(() => rej("timeout"), 5000))
    ]);
    if (data && typeof data === "object" && !data.error) {
      const fbSims = Object.values(data).filter(s => s && s.serial);
      if (fbSims.length > 0) {
        lsSet(cfg.lsKey, JSON.stringify(fbSims));
        return fbSims;
      }
    }
  } catch(e) {}
  return localSims;
};

const loadAll = async () => {
  const botToken = lsGet(K_BOT) || "";
  const chatId   = lsGet(K_CHAT) || "";
  const [simsPlain, simsFree] = await Promise.all([
    loadSimsByType("plain"),
    loadSimsByType("free"),
  ]);
  return { simsPlain, simsFree, botToken, chatId };
};

// บันทึกตามประเภท
const saveSimsByType = (sims, simType) => {
  const cfg = SIM_PATHS[simType];
  lsSet(cfg.lsKey, JSON.stringify(sims));
  const obj = {};
  sims.forEach(s => { obj[toKey(s.serial)] = s; });
  fbSet(cfg.fbPath, obj).catch(() => {});
};

// compat aliases (ใช้ใน component เดิม)
const saveSims = (sims) => {}; // ไม่ใช้แล้ว ใช้ saveSimsByType แทน
const saveBot  = (v) => lsSet(K_BOT, v);
const saveChat = (v) => lsSet(K_CHAT, v);

const addSimToGS = (sim, simType="plain") => {
  const cfg = SIM_PATHS[simType||"plain"];
  fbSet(`${cfg.fbPath}/${toKey(sim.serial)}`, sim).catch(() => {});
};
const updateSimInGS = (serial, updates, simType="plain") => {
  const cfg = SIM_PATHS[simType||"plain"];
  fbPatch(`${cfg.fbPath}/${toKey(serial)}`, updates).catch(() => {});
};
const deleteSimFromGS = (serial, simType="plain") => {
  const cfg = SIM_PATHS[simType||"plain"];
  fbDelete(`${cfg.fbPath}/${toKey(serial)}`).catch(() => {});
};

// ===== UTILITY =====
const genTracking = (existing) => {
  const d = Math.floor(Math.random() * 4) + 2;
  let n, t = 0;
  do { n = Math.floor(Math.random() * Math.pow(10, d)).toString().padStart(d, "0"); if (++t > 999) break; } while (existing.has(n));
  return n;
};
const fmtDate = (ts) => new Date(ts).toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
const todayKey = () => new Date().toISOString().slice(0, 10);
const tgSend = (bot, chat, text) => {
  if (!bot || !chat) return;
  fetch(`https://api.telegram.org/bot${bot}/sendMessage`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: chat, text }),
  }).catch(() => {});
};

const GITHUB_BASE = "https://programsimpro-del.github.io/Sim";
const makeQRUrl = (serial, trackingNo, bot="", chat="", phone="") => {
  let url = `${GITHUB_BASE}/?s=${encodeURIComponent(serial)}&t=${encodeURIComponent(trackingNo)}`;
  if (bot)   url += `&tgbot=${encodeURIComponent(bot)}`;
  if (chat)  url += `&tgchat=${encodeURIComponent(chat)}`;
  if (phone) url += `&phone=${encodeURIComponent(phone)}`;
  return url;
};

// ===== BARCODE =====
function Barcode({ value, w=320, h=56 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !value) return;
    const cv = ref.current, ctx = cv.getContext("2d");
    const segs = ["11010000100"];
    for (const ch of value) { let p=""; for (let i=0;i<11;i++) p+=((ch.charCodeAt(0)+32)>>i)&1?"1":"0"; segs.push(p); }
    segs.push("1100011101011");
    const full = segs.join(""), bw = Math.max(1, Math.floor((w-4)/full.length));
    cv.width = full.length*bw+4; cv.height = h;
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#000";
    for (let i=0;i<full.length;i++) if(full[i]==="1") ctx.fillRect(2+i*bw,0,bw,h);
  }, [value]);
  return <canvas ref={ref} style={{display:"block",margin:"0 auto",maxWidth:"100%"}} />;
}

// ===== QR =====
function QR({ text, size=130 }) {
  const ref = useRef(null);
  const [ok, setOk] = useState(false);
  useEffect(() => {
    if (!text || !ref.current) return;
    setOk(false);
    ref.current.innerHTML = "";
    try { new QRCode(ref.current, { text, width:size, height:size, colorDark:"#000", colorLight:"#fff", correctLevel: QRCode.CorrectLevel.M }); setOk(true); } catch(e) {}
  }, [text, size]);
  return (
    <div style={{position:"relative",width:size,height:size,background:"#fff",borderRadius:4}}>
      <div ref={ref}/>
      {!ok && <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#555"}}>Loading...</div>}
    </div>
  );
}

// ===== CUSTOMER MODAL =====

    if (navigator.clipboard) {
      navigator.clipboard.writeText(sim.serial).then(()=>setConfirmed(true)).catch(()=>{ sel(); try{document.execCommand("copy");}catch(e){} setConfirmed(true); });
    } else { sel(); try{document.execCommand("copy");}catch(e){} setConfirmed(true); }
  };

    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:999,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:14,overflowY:"auto"}}>

        </div>
        <div style={{fontSize:36,marginBottom:6}}>📱</div>
        <h2 style={{color:"white",fontSize:19,fontWeight:800,margin:"0 0 4px"}}>รับเลขซีเรียลซิมของคุณ</h2>
        <div style={{display:"inline-block",background:"rgba(167,139,250,0.15)",border:"1px solid rgba(167,139,250,0.3)",borderRadius:99,padding:"3px 14px",color:"#a78bfa",fontSize:12,fontWeight:700,marginBottom:14}}>เลขติดตาม: {sim.trackingNo}</div>
        <div style={{background:"white",borderRadius:12,padding:"12px 6px 8px",marginBottom:12}}>

        <div style={{background:"rgba(79,70,229,0.1)",border:"1px solid rgba(99,102,241,0.4)",borderRadius:12,padding:"11px",marginBottom:10}}>
          <div style={{color:"#c7d2fe",fontSize:13,fontWeight:700,marginBottom:7}}>เลขซีเรียลซิมของคุณ</div>
          <textarea ref={taRef} readOnly value={sim.serial} rows={2} onClick={sel} onFocus={sel} onTouchStart={()=>setTimeout(sel,50)}
            style={{width:"100%",padding:"9px 6px",background:"rgba(255,255,255,0.12)",border:"2px solid #6366f1",borderRadius:8,color:"white",fontSize:17,fontFamily:"monospace",fontWeight:700,letterSpacing:2,textAlign:"center",resize:"none",outline:"none",WebkitUserSelect:"text",userSelect:"text",cursor:"text",lineHeight:1.5,boxSizing:"border-box"}}/>
        </div>
        <button onClick={doCopy} style={{width:"100%",padding:"13px",background:confirmed?"linear-gradient(135deg,#059669,#10b981)":"linear-gradient(135deg,#4f46e5,#7c3aed)",color:"white",border:"none",borderRadius:11,fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:9,fontFamily:"inherit"}}>

// ===== SCANNED TAB =====
function ScannedTab({ sims }) {
  const [q, setQ] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");

  const fl = sims.filter(s => {
    if (!s.scannedByCustomer) return false;
    if (!(s.serial.toLowerCase().includes(q.toLowerCase()) || s.trackingNo.includes(q))) return false;
    if (dateFrom) {
      const d = new Date(s.scannedAt).toISOString().slice(0,10);
      if (d < dateFrom) return false;
    }
    if (dateTo) {
      const d = new Date(s.scannedAt).toISOString().slice(0,10);
      if (d > dateTo) return false;
    }
    return true;
  });

  const exportExcel = () => {
    const header = ["เลขซีเรียลซิม", "วันที่ลงทะเบียน", "เวลา", "สถานะ"];
    const rows = fl.map(s => [
      s.serial,
      fmtDate(s.scannedAt),
      fmtTime(s.scannedAt),
      "ลงทะเบียนซิมแล้ว"
    ]);
    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8"});
    const label = dateFrom||dateTo ? `_${dateFrom||""}${dateTo?"_to_"+dateTo:""}` : "";
    Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(blob),
      download: `sim_registered${label}_${todayKey()}.csv`
    }).click();
  };

  return (
    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <h3 style={{...S.sectionTitle,margin:0}}>📋 สแกนซิมลงทะเบียนแล้ว ({fl.length})</h3>
        <button style={S.btnG} onClick={exportExcel}>📥 Export Excel</button>
      </div>

      {/* ตัวกรองวันที่ */}
      <div style={{background:"rgba(79,70,229,0.08)",border:"1px solid rgba(79,70,229,0.25)",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
        <div style={{color:"#c7d2fe",fontSize:12,fontWeight:700,marginBottom:8}}>📅 กำหนดช่วงวันที่ (Export เฉพาะช่วงนี้)</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",flexDirection:"column",gap:4,flex:1,minWidth:130}}>
            <label style={{color:"#94a3b8",fontSize:11}}>ตั้งแต่วันที่</label>
            <input type="date" style={{...S.input,fontSize:13,padding:"8px 10px"}} value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4,flex:1,minWidth:130}}>
            <label style={{color:"#94a3b8",fontSize:11}}>ถึงวันที่</label>
            <input type="date" style={{...S.input,fontSize:13,padding:"8px 10px"}} value={dateTo} onChange={e=>setDateTo(e.target.value)}/>
          </div>
          <button style={{...S.btnS,alignSelf:"flex-end",padding:"8px 12px",fontSize:12}} onClick={()=>{setDateFrom("");setDateTo("");}}>ล้างวันที่</button>
        </div>
      </div>

      <input style={{...S.input,marginBottom:12}} value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 ค้นหาเลขซีเรียลหรือเลขติดตาม..."/>

      {fl.length===0&&<div style={{textAlign:"center",padding:40,color:"#8b8fa8"}}><div style={{fontSize:40,marginBottom:8}}>📭</div><div>ยังไม่มีข้อมูลในช่วงวันที่ที่เลือก</div></div>}

function PhoneScanner({ onFound }) {
  const vRef = useRef(null);
  const readerRef = useRef(null);
  const [msg, setMsg] = useState("🔍 ชี้กล้องไปที่เบอร์โทรบนซิม...");

  useEffect(() => {
    const start = () => {
      if (!window.ZXing || !vRef.current) return;
      const hints = new Map();
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        window.ZXing.BarcodeFormat.CODE_128,
        window.ZXing.BarcodeFormat.CODE_39,
        window.ZXing.BarcodeFormat.EAN_13,
      ]);
      const reader = new window.ZXing.BrowserMultiFormatReader(hints);
      readerRef.current = reader;
      reader.decodeFromVideoDevice(null, vRef.current, (result) => {
        if (result) {
          const text = result.getText().replace(/[^0-9]/g, "");
          // เบอร์ไทยมักขึ้นต้น 0 และมี 9-10 หลัก
          if (text.length >= 9 && text.length <= 10 && text.startsWith("0")) {
            onFound(text);
          } else if (text.length >= 9) {
            setMsg("✅ พบตัวเลข: " + text + " (กรอกเองถ้าไม่ใช่เบอร์)");
          }
        }
      });
    };
    if (window.ZXing) start();
    else {
      const sc = document.createElement("script");
      sc.src = "https://unpkg.com/@zxing/library@latest/umd/index.min.js";
      sc.onload = start;
      document.head.appendChild(sc);
    }
    return () => { if(readerRef.current){try{readerRef.current.reset();}catch(e){}} };
  }, []);

  return (
    <div style={{marginTop:10}}>
      <div style={{position:"relative",width:"100%",maxWidth:400}}>
        <video ref={vRef} style={{width:"100%",borderRadius:10,border:"2px solid #10b981",display:"block"}} playsInline muted/>
        <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(16,185,129,0.8)",transform:"translateY(-50%)"}}/>
      </div>
      <div style={{marginTop:6,padding:"6px 12px",background:"rgba(16,185,129,0.1)",borderRadius:8,fontSize:12,color:"#6ee7b7",textAlign:"center"}}>{msg}</div>
    </div>
  );
}

function Scanner({ onScan, sims }) {
  const [serial, setSerial] = useState("");
  const [phone, setPhone] = useState("");
  const [simCode, setSimCode] = useState("K");
  const [camSerial, setCamSerial] = useState(false); // กล้องสแกนซีเรียล
  const [camPhone, setCamPhone] = useState(false);   // กล้องสแกนเบอร์
  const [scanSerialMsg, setScanSerialMsg] = useState("");
  const [scanPhoneMsg, setScanPhoneMsg] = useState("");
  const [previewTracking, setPreviewTracking] = useState("");
  const [reservedTracking, setReservedTracking] = useState("");

  const serialReaderRef = useRef(null);
  const phoneReaderRef = useRef(null);
  const serialVRef = useRef(null);
  const phoneVRef = useRef(null);
  const phoneCanvasRef = useRef(null);
  const ocrTimerRef = useRef(null);
  const cooldownRef = useRef(false);

  const computePreview = (val) => {
    if (!val.trim()) { setPreviewTracking(""); setReservedTracking(""); return; }
    const existing = sims.find(s => s.serial === val.trim());
    if (existing) {
      setPreviewTracking("⚠️ มีอยู่แล้ว — เลขติดตาม: " + existing.trackingNo);
      setReservedTracking(""); return;
    }
    const reserved = genTracking(new Set(sims.map(s => s.trackingNo)));
    setReservedTracking(reserved);
    const display = simCode ? simCode + reserved : reserved;
    setPreviewTracking("เลขติดตามซิม: " + display);
  };

  // ===== กล้องสแกนซีเรียล =====
  useEffect(() => {
    if (!camSerial) {
      if (serialReaderRef.current) { try { serialReaderRef.current.reset(); } catch(e) {} serialReaderRef.current = null; }
      setScanSerialMsg(""); return;
    }
    setCamPhone(false); // ปิดกล้องเบอร์ถ้าเปิดอยู่
    const start = () => {
      if (!window.ZXing || !serialVRef.current) return;
      try {
        const hints = new Map();
        hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          window.ZXing.BarcodeFormat.CODE_128,
          window.ZXing.BarcodeFormat.CODE_39,
          window.ZXing.BarcodeFormat.EAN_13,
        ]);
        hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
        const reader = new window.ZXing.BrowserMultiFormatReader(hints);
        serialReaderRef.current = reader;
        setScanSerialMsg("🔍 ชี้กล้องไปที่บาร์โค้ดซีเรียลซิม...");
        reader.decodeFromVideoDevice(null, serialVRef.current, (result) => {
          if (result && !cooldownRef.current) {
            const text = result.getText().trim();
            if (text.length >= 10) {
              cooldownRef.current = true;
              setSerial(text);
              computePreview(text);
              setScanSerialMsg("✅ ได้ซีเรียล: " + text.slice(0,16) + (text.length>16?"...":""));
              setCamSerial(false);
              setTimeout(() => { cooldownRef.current = false; }, 1500);
            }
          }
        });
      } catch(e) { setScanSerialMsg("❌ " + e.message); }
    };
    const loadAndStart = () => {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(st => { if (serialVRef.current) { serialVRef.current.srcObject = st; serialVRef.current.play(); } })
        .catch(e => { setScanSerialMsg("❌ " + e.message); setCamSerial(false); });
      if (window.ZXing) start();
      else { const sc = document.createElement("script"); sc.src = "https://unpkg.com/@zxing/library@latest/umd/index.min.js"; sc.onload = start; document.head.appendChild(sc); }
    };
    loadAndStart();
    return () => { if (serialReaderRef.current) { try { serialReaderRef.current.reset(); } catch(e) {} serialReaderRef.current = null; } };
  }, [camSerial]);

  // ===== กล้องสแกนเบอร์ (OCR) =====
  useEffect(() => {
    if (!camPhone) {
      if (phoneReaderRef.current) { try { phoneReaderRef.current.reset(); } catch(e) {} phoneReaderRef.current = null; }
      if (ocrTimerRef.current) { clearInterval(ocrTimerRef.current); ocrTimerRef.current = null; }
      setScanPhoneMsg(""); return;
    }
    setCamSerial(false); // ปิดกล้องซีเรียลถ้าเปิดอยู่

    const runOCR = () => {
      if (!phoneVRef.current || !phoneCanvasRef.current) return;
      const v = phoneVRef.current, cv = phoneCanvasRef.current;
      cv.width = v.videoWidth; cv.height = v.videoHeight;
      cv.getContext("2d").drawImage(v, 0, 0);
      if (!window.Tesseract) return;
      window.Tesseract.recognize(cv, "eng", { tessedit_char_whitelist: "0123456789" })
        .then(({ data: { text } }) => {
          const nums = text.replace(/\D/g,"");
          const m = nums.match(/0[689]\d{8}/);
          if (m) {
            setPhone(m[0]);
            setScanPhoneMsg("✅ ได้เบอร์: " + m[0]);
            if (ocrTimerRef.current) { clearInterval(ocrTimerRef.current); ocrTimerRef.current = null; }
            setCamPhone(false);
          }
        }).catch(() => {});
    };

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(st => {
        if (phoneVRef.current) { phoneVRef.current.srcObject = st; phoneVRef.current.play(); }
        setScanPhoneMsg("🔍 ชี้กล้องไปที่เบอร์โทรบนซิม...");
        const loadTesseract = (cb) => {
          if (window.Tesseract) { cb(); return; }
          const sc = document.createElement("script");
          sc.src = "https://unpkg.com/tesseract.js@4/dist/tesseract.min.js";
          sc.onload = cb; document.head.appendChild(sc);
        };
        loadTesseract(() => { ocrTimerRef.current = setInterval(runOCR, 1500); });
      })
      .catch(e => { setScanPhoneMsg("❌ " + e.message); setCamPhone(false); });

    return () => {
      if (ocrTimerRef.current) { clearInterval(ocrTimerRef.current); ocrTimerRef.current = null; }
    };
  }, [camPhone]);

  const go = () => {
    if (serial.trim()) {
      onScan(serial.trim(), reservedTracking || null, phone.trim() || null, simCode || null);
      setSerial(""); setPhone(""); setPreviewTracking(""); setReservedTracking("");
    }
  };

  return (
    <div style={S.card}>
      <h3 style={S.sectionTitle}>📷 ยิงเลขซีเรียลซิม</h3>

      {/* เลือกโค้ด K / L */}
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14}}>
        <span style={{color:"#94a3b8",fontSize:13,fontWeight:600}}>โค้ดซิม:</span>
        {["K","L"].map(code=>(
          <button key={code} onClick={()=>setSimCode(code)}
            style={{padding:"8px 24px",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:15,
              background:simCode===code?(code==="K"?"linear-gradient(135deg,#4f46e5,#7c3aed)":"linear-gradient(135deg,#059669,#10b981)"):"rgba(255,255,255,0.06)",
              color:simCode===code?"white":"#8b8fa8",
              outline:simCode===code?`2px solid ${code==="K"?"#a78bfa":"#6ee7b7"}`:"none",
            }}>{code}</button>
        ))}
        <span style={{color:simCode==="K"?"#a78bfa":"#6ee7b7",fontSize:12,fontWeight:600,marginLeft:4}}>
          เลือก: {simCode}
        </span>
      </div>

      {/* ===== กล้องสแกนเบอร์โทร ===== */}
      <div style={{background:"rgba(16,185,129,0.06)",border:"1px solid rgba(16,185,129,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{color:"#6ee7b7",fontSize:13,fontWeight:700}}>📞 เบอร์โทร</div>
          <button onClick={()=>setCamPhone(v=>!v)}
            style={{...camPhone?S.btnDO:S.btnS,fontSize:12,padding:"6px 14px"}}>
            {camPhone?"🔴 ปิดกล้อง":"📷 สแกนเบอร์"}
          </button>
        </div>

        {camPhone && (
          <div style={{marginBottom:8}}>
            <div style={{position:"relative",width:"100%",maxWidth:400}}>
              <video ref={phoneVRef} style={{width:"100%",borderRadius:10,border:"2px solid #10b981",display:"block"}} playsInline muted/>
              <div style={{position:"absolute",top:"40%",left:"5%",right:"5%",height:2,background:"rgba(16,185,129,0.8)",transform:"translateY(-50%)"}}/>
              <canvas ref={phoneCanvasRef} style={{display:"none"}}/>
            </div>
            <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:600,textAlign:"center",
              background:scanPhoneMsg.startsWith("✅")?"rgba(5,150,105,0.15)":"rgba(16,185,129,0.08)",
              color:scanPhoneMsg.startsWith("✅")?"#6ee7b7":"#a5b4fc"}}>
              {scanPhoneMsg||"กำลังเตรียมกล้อง..."}
            </div>
          </div>
        )}

        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input style={{...S.input,flex:1,borderColor:phone?"rgba(16,185,129,0.5)":"rgba(16,185,129,0.2)"}}
            value={phone} onChange={e=>setPhone(e.target.value.replace(/[^0-9]/g,""))}
            placeholder="เบอร์โทร (OCR อัตโนมัติ หรือกรอกเอง)"
            maxLength={10} inputMode="numeric"/>
          {phone && <button onClick={()=>setPhone("")} style={{...S.btnD,padding:"8px 10px"}}>✕</button>}
        </div>
        {phone && <div style={{color:"#6ee7b7",fontSize:12,marginTop:4}}>✅ {phone}</div>}
        {!phone && serial && <div style={{color:"#f59e0b",fontSize:11,marginTop:4}}>📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>}
      </div>

      {/* ===== กล้องสแกนซีเรียลซิม ===== */}
      <div style={{background:"rgba(79,70,229,0.06)",border:"1px solid rgba(79,70,229,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{color:"#a5b4fc",fontSize:13,fontWeight:700}}>📋 เลขซีเรียลซิม</div>
          <button onClick={()=>setCamSerial(v=>!v)}
            style={{...camSerial?S.btnDO:S.btnS,fontSize:12,padding:"6px 14px"}}>
            {camSerial?"🔴 ปิดกล้อง":"📷 สแกนซีเรียล"}
          </button>
        </div>

        {camSerial && (
          <div style={{marginBottom:8}}>
            <div style={{position:"relative",width:"100%",maxWidth:400}}>
              <video ref={serialVRef} style={{width:"100%",borderRadius:10,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
              <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(99,102,241,0.8)",transform:"translateY(-50%)",boxShadow:"0 0 8px rgba(99,102,241,0.8)"}}/>
              {[{top:8,left:8,borderTop:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
                {top:8,right:8,borderTop:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"},
                {bottom:8,left:8,borderBottom:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
                {bottom:8,right:8,borderBottom:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"}
              ].map((st,i)=><div key={i} style={{position:"absolute",width:20,height:20,...st}}/>)}
            </div>
            <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:600,textAlign:"center",
              background:scanSerialMsg.startsWith("✅")?"rgba(5,150,105,0.15)":"rgba(79,70,229,0.12)",
              color:scanSerialMsg.startsWith("✅")?"#6ee7b7":"#a5b4fc"}}>
              {scanSerialMsg||"กำลังเตรียมกล้อง..."}
            </div>

        )}

        <div style={{display:"flex",gap:8}}>
          <input style={{...S.input,flex:1,borderColor:serial?"rgba(99,102,241,0.6)":"rgba(99,102,241,0.2)"}}
            value={serial} onChange={e=>{setSerial(e.target.value);computePreview(e.target.value);}}
            placeholder="สแกนหรือกรอกเลขซีเรียลซิม"

          </button>
        </div>
      </div>

      {/* Preview เลขติดตาม */}
      {previewTracking && (
        <div style={{padding:"10px 16px",
          background:previewTracking.startsWith("⚠️")?"rgba(245,158,11,0.12)":"rgba(79,70,229,0.15)",
          border:`1px solid ${previewTracking.startsWith("⚠️")?"rgba(245,158,11,0.4)":"rgba(167,139,250,0.5)"}`,

          </span>
        </div>
      )}
    </div>
  );

function EditPhone({ sim, onUpdate }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(sim.phone || "");

  const save = () => {
    onUpdate(sim.serial, val.trim());
    setEditing(false);
  };

  if (editing) return (
    <div style={{display:"flex",gap:4,alignItems:"center"}}>
      <input
        style={{...S.input,width:110,padding:"4px 8px",fontSize:12}}

        onChange={e=>setVal(e.target.value.replace(/[^0-9]/g,""))}

      />

  return (

    </div>
  );
}

function SimList({ sims, onDelete, onUpdatePhone }) {

  const [scanMsg, setScanMsg] = useState("");
  const scanRef = useRef(null);
  const scanReaderRef = useRef(null);

  const fl=sims.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const pd=fl.slice((pg-1)*pp,pg*pp), pages=Math.ceil(fl.length/pp);

  // สแกนบาร์โค้ดเพื่อค้นหา
  useEffect(() => {
    if (!scanCam) {
      if (scanReaderRef.current) { try{scanReaderRef.current.reset();}catch(e){} scanReaderRef.current=null; }
      setScanMsg(""); return;
    }
    const startScan = () => {
      if (!window.ZXing || !scanRef.current) return;
      const hints = new Map();
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        window.ZXing.BarcodeFormat.CODE_128, window.ZXing.BarcodeFormat.CODE_39,
        window.ZXing.BarcodeFormat.EAN_13, window.ZXing.BarcodeFormat.EAN_8,
      ]);
      hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new window.ZXing.BrowserMultiFormatReader(hints);
      scanReaderRef.current = reader;
      setScanMsg("🔍 ชี้กล้องไปที่เบอร์โทร หรือบาร์โค้ดซีเรียลซิม...");
      reader.decodeFromVideoDevice(null, scanRef.current, (result, err) => {
        if (result) {
          const text = result.getText();
          if (text && text.length >= 8) {
            setQ(text); setPg(1);
            setScanMsg("✅ พบ: " + text);
            setScanCam(false);
          }
        }
      });
    };
    if (window.ZXing) startScan();
    else {
      const sc = document.createElement("script");
      sc.src = "https://unpkg.com/@zxing/library@latest/umd/index.min.js";
      sc.onload = startScan;
      document.head.appendChild(sc);
    }
    return () => { if(scanReaderRef.current){try{scanReaderRef.current.reset();}catch(e){} scanReaderRef.current=null;} };
  }, [scanCam]);

  const csv=()=>{
    const h=["เลขซีเรียล","เลขติดตาม","สถานะ","วันที่เพิ่ม","วันที่สแกน"];
    const r=fl.map(s=>[s.serial,s.trackingNo,s.scannedByCustomer?"✓":"-",fmtDate(s.createdAt),s.scannedAt?fmtDate(s.scannedAt)+" "+fmtTime(s.scannedAt):"-"]);
    const blob=new Blob(["﻿"+[h,...r].map(x=>x.join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
    Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:`sims_${todayKey()}.csv`}).click();
  };
  return (
    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <h3 style={{...S.sectionTitle,margin:0}}>📋 รายการซิมทั้งหมด ({fl.length})</h3>
        <button style={S.btnG} onClick={csv}>📥 Export Excel</button>
      </div>

      {/* ช่องค้นหา + ปุ่มกล้อง */}
      <div style={{display:"flex",gap:8,marginBottom:scanCam?8:12,alignItems:"center"}}>
        <div style={{position:"relative",flex:1}}>
          <input
            style={{...S.input,paddingRight:44}}
            value={q}
            onChange={e=>{setQ(e.target.value);setPg(1);}}
            placeholder="🔍 ค้นหาเลขซีเรียลหรือเลขติดตาม..."
          />
          {q && (
            <button onClick={()=>{setQ("");setPg(1);setScanMsg("");}}
              style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#8b8fa8",fontSize:16,cursor:"pointer",padding:"0 4px"}}>
              ✕
            </button>
          )}
        </div>
        <button
          onClick={()=>setScanCam(v=>!v)}
          style={{...scanCam?S.btnDO:S.btnS, padding:"10px 14px", whiteSpace:"nowrap"}}
          title="สแกนบาร์โค้ดเพื่อค้นหา"
        >
          {scanCam ? "🔴 ปิด" : "📷 สแกน"}
        </button>
      </div>

      {/* กล้องสแกน */}
      {scanCam && (
        <div style={{marginBottom:12}}>
          <div style={{position:"relative",width:"100%",maxWidth:420}}>
            <video ref={scanRef} style={{width:"100%",borderRadius:12,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
            <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(99,102,241,0.8)",transform:"translateY(-50%)",boxShadow:"0 0 8px rgba(99,102,241,0.8)"}}/>
            {[{top:8,left:8,borderTop:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
              {top:8,right:8,borderTop:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"},
              {bottom:8,left:8,borderBottom:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
              {bottom:8,right:8,borderBottom:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"}
            ].map((st,i)=><div key={i} style={{position:"absolute",width:20,height:20,...st}}/>)}
          </div>
          <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,textAlign:"center",fontSize:13,fontWeight:600,
            background:scanMsg.startsWith("✅")?"rgba(5,150,105,0.15)":"rgba(79,70,229,0.12)",
            border:`1px solid ${scanMsg.startsWith("✅")?"rgba(5,150,105,0.4)":"rgba(99,102,241,0.3)"}`,
            color:scanMsg.startsWith("✅")?"#6ee7b7":"#a5b4fc"}}>
            {scanMsg||"กำลังเตรียมกล้อง..."}
          </div>
        </div>
      )}
      {pd.length===0&&<div style={{color:"#8b8fa8",textAlign:"center",padding:32}}>ยังไม่มีข้อมูล</div>}
      <div style={{overflowX:"auto"}}>
        <table style={S.table}>
          <thead><tr>{["#","เลขซีเรียล","เลขติดตาม","📞 เบอร์โทร","สถานะ","วันที่เพิ่ม","ลบ"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {pd.map((s,i)=>(
              <tr key={s.serial} style={{background:i%2===0?"rgba(255,255,255,0.02)":"transparent"}}>
                <td style={S.td}>{(pg-1)*pp+i+1}</td>
                <td style={{...S.td,fontFamily:"monospace",fontSize:12}}>{s.serial}</td>
                <td style={{...S.td,color:"#a78bfa",fontWeight:700}}>{s.trackingNo}</td>
                <td style={S.td}>
                  <EditPhone sim={s} onUpdate={onUpdatePhone}/>
                </td>
                <td style={S.td}><span style={{padding:"2px 8px",borderRadius:99,fontSize:11,background:s.scannedByCustomer?"#064e3b":"#1e1b4b",color:s.scannedByCustomer?"#6ee7b7":"#a5b4fc"}}>{s.scannedByCustomer?"✓ ลงทะเบียนแล้ว":"รอสแกน"}</span></td>
                <td style={{...S.td,fontSize:11,color:"#8b8fa8"}}>{fmtDate(s.createdAt)}</td>
                <td style={S.td}><button onClick={()=>onDelete(s.serial)} style={S.btnD}>🗑</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {pages>1&&<div style={{display:"flex",gap:6,justifyContent:"center",marginTop:12,flexWrap:"wrap"}}>
        {Array.from({length:pages},(_,i)=>i+1).map(p=><button key={p} onClick={()=>setPg(p)} style={{...S.btnS,padding:"4px 10px",background:p===pg?"#4f46e5":undefined,color:p===pg?"white":undefined}}>{p}</button>)}
      </div>}
    </div>
  );
}

// ===== QR MAIN (รวม 3 สถานะ: รอพิมพ์, ยังไม่พิมพ์, พิมพ์แล้ว) =====
function QRMain({ sims, onPreview, bot, chat, onMarkPrinted, onUnmarkPrinted, onDeleteSim }) {
  const [subTab, setSubTab] = useState("new"); // new=ยังไม่พิมพ์, done=พิมพ์แล้ว
  const [sel, setSel] = useState([]);
  const [q, setQ] = useState("");
  const [printing, setPrinting] = useState(false);

  // รอพิมพ์ = ที่เลือกค้างไว้ (ยังไม่ได้พิมพ์จริง) — ใช้ localStorage เก็บ
  const [waiting, setWaiting] = useState(() => {
    try { return JSON.parse(localStorage.getItem("sim_waiting") || "[]"); } catch(e) { return []; }
  });
  const saveWaiting = (arr) => { localStorage.setItem("sim_waiting", JSON.stringify(arr)); setWaiting(arr); };

  const notPrinted = sims.filter(s => !s.printed && !waiting.includes(s.serial));
  const waitingList = sims.filter(s => waiting.includes(s.serial));
  const printed = sims.filter(s => s.printed);

  const fl = (list) => list.filter(s => s.serial.toLowerCase().includes(q.toLowerCase()) || s.trackingNo.includes(q));
  const tog = (serial) => setSel(prev => prev.includes(serial) ? prev.filter(s=>s!==serial) : [...prev,serial]);

  // ย้ายที่เลือกไป "รอพิมพ์"
  const moveToWaiting = () => {
    const newWaiting = [...new Set([...waiting, ...sel])];
    saveWaiting(newWaiting);
    setSel([]);
  };

  // พิมพ์จริง — ย้ายจาก "รอพิมพ์" → "พิมพ์แล้ว"
  // ย้าย QR จาก "ยังไม่พิมพ์" ไป "พิมพ์แล้ว" โดยไม่พิมพ์
  const moveToDone = () => {
    if (sel.length === 0) return;
    const toMove = [...sel];
    setSel([]); // clear selection ก่อน
    setTimeout(() => {
      onMarkPrinted(toMove); // mark หลัง render รอบหนึ่ง
      setTimeout(() => setSubTab("done"), 500); // ย้าย tab หลัง state update
    }, 50);
  };

  const doPrint = async () => {
    const toPrint = sims.filter(s => sel.includes(s.serial));
    if (toPrint.length === 0) return;
    setPrinting(true);

    // สร้าง QR dataURLs
    const qrDataUrls = {};
    for (const s of toPrint) {
      const url = makeQRUrl(s.serial, s.trackingNo, bot, chat, s.phone||"");
      await new Promise(resolve => {
        const div = document.createElement("div");
        div.style.cssText = "position:absolute;left:-9999px;top:-9999px";
        document.body.appendChild(div);
        try {
          new QRCode(div, { text:url, width:200, height:200, colorDark:"#000", colorLight:"#fff", correctLevel:QRCode.CorrectLevel.M });
          setTimeout(() => {
            const cv = div.querySelector("canvas");
            if(cv) qrDataUrls[s.serial] = cv.toDataURL();
            try{document.body.removeChild(div);}catch(e2){}
            resolve();
          }, 400);
        } catch(e) { try{document.body.removeChild(div);}catch(e2){} resolve(); }
      });
    }

    const cards = toPrint.map(s => {
      const d = qrDataUrls[s.serial] || "";
      return `<div class="card">${d?`<img src="${d}" width="200" height="200"/>`:`<div style="width:160px;height:160px;background:#eee;display:flex;align-items:center;justify-content:center">QR</div>`}${s.phone ? `<div class="phone">📞 เบอร์: ${s.phone}</div>` : `<div class="phone-wait">📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>`}<div class="trk">ซิมหมายเลข: ${s.trackingNo}${s.simType==="free" ? " (ฟรีเน็ตเดือนแรก)" : ""}</div><div class="lbl">สแกน QR Code เพื่อรับบาร์โค้ดซิมและทำการลงทะเบียนซิมที่นี่</div><div class="must">⚠️ ต้องสแกนลงทะเบียนผ่าน QR Code นี้เท่านั้น</div><div class="warn">⚠️ สำคัญมาก !!!<br>ห้ามลงทะเบียนซิมหลังเวลา 17:00 น. โดยเด็ดขาด<br>เพราะจะทำให้ซิมใช้งานไม่ได้<br>ถ้าเกิน 17:00 น. ต้องรอลงทะเบียนวันถัดไป<br>ทางร้านหยุดให้บริการทุกวันอาทิตย์และวันหยุดนักขัตฤกษ์</div></div>`;
    }).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>พิมพ์ QR</title><style>*{box-sizing:border-box}body{font-family:'Sarabun',sans-serif;background:#fff;margin:0;padding:0;color:#000}.grid{display:block}.card{border:2px solid #000;border-radius:4mm;padding:3mm 4mm;width:100mm;height:75mm;text-align:center;page-break-inside:avoid;page-break-after:always;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}.card img{width:40mm;height:40mm}.phone{font-size:9pt;font-weight:700;color:#000;margin-top:1.5mm}.phone-wait{font-size:8.5pt;color:#000;margin-top:1.5mm;font-weight:600}.trk{font-size:10pt;font-weight:700;color:#000;margin-top:1mm}.lbl{font-size:7.5pt;color:#000;margin-top:1mm;line-height:1.4}.must{font-size:8pt;color:#000;font-weight:800;margin-top:1.5mm;line-height:1.4}.warn{font-size:7pt;color:#000;font-weight:700;margin-top:2mm;line-height:1.5;border-top:0.5px solid #000;padding-top:1.5mm}@media print{.np{display:none!important}@page{size:100mm 75mm;margin:0}body{margin:0;padding:0}.card{width:100mm;height:75mm;padding:3mm 4mm;border:2px solid #000!important;border-radius:4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="np" style="background:#f5f5f5;border-bottom:2px solid #000;padding:12px 16px;margin-bottom:0">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px">
    <button onclick="window.print()" style="padding:12px 28px;font-size:16px;cursor:pointer;background:#000;color:#fff;border:none;border-radius:8px;font-weight:700">🖨️ พิมพ์ QR Code</button>
    <button onclick="window.close()" style="padding:12px 20px;font-size:15px;cursor:pointer;background:#fff;color:#000;border:2px solid #000;border-radius:8px;font-weight:700">✕ ปิด</button>
    <span id="sizeinfo" style="color:#555;font-size:12px;margin-left:4px"></span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <span style="color:#333;font-size:13px;font-weight:700">⚙️ ปรับก่อนพิมพ์:</span>
    <label style="font-size:13px;color:#333;font-weight:600">แนวพิมพ์:
      <select id="orient" onchange="applyOrientation()" style="margin-left:6px;padding:4px 8px;border:1px solid #999;border-radius:4px;font-size:13px">
        <option value="portrait">แนวตั้ง (Portrait)</option>
        <option value="landscape">แนวนอน (Landscape)</option>
      </select>
    </label>
    <label style="font-size:13px;color:#333">กว้าง (mm): <input id="w" type="number" value="100" min="50" max="297" style="width:60px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
    <label style="font-size:13px;color:#333">สูง (mm): <input id="h" type="number" value="75" min="40" max="297" style="width:60px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
    <label style="font-size:13px;color:#333">ขนาด QR (mm): <input id="q" type="number" value="40" min="20" max="80" style="width:60px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
    <label style="font-size:13px;color:#333">ตัวอักษร (pt): <input id="f" type="number" value="8" min="5" max="16" style="width:50px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
  </div>
</div>
<script>
var PREF_KEY = 'sim_print_prefs';
function savePrefs() {
  var prefs = {
    w: document.getElementById('w').value,
    h: document.getElementById('h').value,
    q: document.getElementById('q').value,
    f: document.getElementById('f').value,
    orient: document.getElementById('orient').value
  };
  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch(e) {}
}
function loadPrefs() {
  try {
    var saved = localStorage.getItem(PREF_KEY);
    if (saved) {
      var p = JSON.parse(saved);
      if (p.w) document.getElementById('w').value = p.w;
      if (p.h) document.getElementById('h').value = p.h;
      if (p.q) document.getElementById('q').value = p.q;
      if (p.f) document.getElementById('f').value = p.f;
      if (p.orient) document.getElementById('orient').value = p.orient;
    }
  } catch(e) {}
}
function applyOrientation() {
  var orient = document.getElementById('orient').value;
  var w = parseFloat(document.getElementById('w').value)||100;
  var h = parseFloat(document.getElementById('h').value)||75;
  if(orient === 'landscape' && w < h) {
    document.getElementById('w').value = h;
    document.getElementById('h').value = w;
  } else if(orient === 'portrait' && w > h) {
    document.getElementById('w').value = h;
    document.getElementById('h').value = w;
  }
  updateSize();
}
function updateSize() {
  var w = parseFloat(document.getElementById('w').value)||100;
  var h = parseFloat(document.getElementById('h').value)||75;
  var q = parseFloat(document.getElementById('q').value)||40;
  var f = parseFloat(document.getElementById('f').value)||8;
  var orient = document.getElementById('orient').value;
  if(w > h && orient === 'portrait') document.getElementById('orient').value = 'landscape';
  if(h > w && orient === 'landscape') document.getElementById('orient').value = 'portrait';
  document.querySelectorAll('.card').forEach(function(c){
    c.style.width = w+'mm'; c.style.height = h+'mm';
  });
  document.querySelectorAll('.card img').forEach(function(img){
    img.style.width = q+'mm'; img.style.height = q+'mm';
  });
  var classes = ['phone','phone-wait','trk','lbl','must','warn'];
  var sizes = [f+1, f+0.5, f+2, f-0.5, f, f-1];
  classes.forEach(function(cls, i){
    document.querySelectorAll('.'+cls).forEach(function(el){ el.style.fontSize = sizes[i]+'pt'; });
  });
  var ps = document.getElementById('pageStyle');
  if(!ps){ ps = document.createElement('style'); ps.id='pageStyle'; document.head.appendChild(ps); }
  ps.textContent = '@media print{@page{size:'+w+'mm '+h+'mm;margin:0}.card{width:'+w+'mm!important;height:'+h+'mm!important}}';
  var orientLabel = w >= h ? '📄 แนวนอน' : '📋 แนวตั้ง';
  document.getElementById('sizeinfo').textContent = orientLabel+' | '+w+'×'+h+'mm | QR '+q+'mm | ตัวอักษร '+f+'pt';
  // บันทึกค่าอัตโนมัติทุกครั้งที่เปลี่ยน
  savePrefs();
}
window.onload = function(){ loadPrefs(); updateSize(); };
<\/script><div class="grid">${cards}</div></body></html>`;
    const blob = new Blob([html],{type:"text/html;charset=utf-8"});

    const printedSerials = toPrint.map(s=>s.serial);
    onMarkPrinted(printedSerials);
    setSel([]);
    setPrinting(false);
    // ย้ายไปแท็บพิมพ์แล้ว
    setTimeout(() => setSubTab("done"), 400);

    // เปิดหน้าพิมพ์ใน tab ใหม่
    setTimeout(() => {
      const w = window.open("", "_blank");
      if (w) { w.document.write(html); w.document.close(); }
      else {
        const a = Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),target:"_blank",rel:"noopener"});
        document.body.appendChild(a); a.click();
        setTimeout(()=>{try{document.body.removeChild(a);}catch(e){}},1000);
      }
    }, 100);
  };

  const subTabs = [
    { id:"new",  label:`🖨️ ยังไม่พิมพ์ (${notPrinted.length})`, color:"#a5b4fc" },
    { id:"done", label:`✅ พิมพ์แล้ว (${printed.length})`,       color:"#6ee7b7" },
  ];

  const currentList = subTab==="new" ? notPrinted : printed;

  return (
    <div style={S.card}>
      <h3 style={{...S.sectionTitle, marginBottom:12}}>🔲 QR Code Serial Sim</h3>

      {/* Sub Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:14,borderBottom:"1px solid rgba(255,255,255,0.08)",paddingBottom:10}}>
        {subTabs.map(st=>(
          <button key={st.id} onClick={()=>{setSubTab(st.id);setSel([]);}}
            style={{flex:1,padding:"8px 4px",border:"none",borderRadius:9,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",
              background:subTab===st.id?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.04)",
              color:subTab===st.id?st.color:"#8b8fa8",
              borderBottom:subTab===st.id?`2px solid ${st.color}`:"2px solid transparent",
            }}>
            {st.label}
          </button>
        ))}
      </div>

      {/* ค้นหา + ปุ่มเลือก */}
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input style={{...S.input,flex:1,minWidth:140}} value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 ค้นหา..."/>
        <button style={S.btnS} onClick={()=>setSel(fl(currentList).map(s=>s.serial))}>เลือกทั้งหมด ({fl(currentList).length})</button>
        <button style={S.btnS} onClick={()=>setSel([])}>ยกเลิก</button>
      </div>

      {/* Action Buttons ตามแต่ละ sub tab */}
      {sel.length > 0 && (
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          {subTab==="new" && (
            <>
              <button onClick={doPrint} disabled={printing}
                style={{...S.btnP,flex:1,opacity:printing?0.6:1}}>
                {printing?"⏳ กำลังสร้าง...":"🖨️ พิมพ์ QR ("+sel.length+")"}
              </button>
              <button
                onClick={moveToDone}

function QRManager({ sims, onPreview, bot, chat, onAfterPrint }) {
  const [sel, setSel] = useState([]);
  const [q, setQ] = useState("");
  const [printing, setPrinting] = useState(false);
  const fl = sims.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const tog = (serial) => setSel(prev=>prev.includes(serial)?prev.filter(s=>s!==serial):[...prev,serial]);

  const doPrint = async () => {
    const picked = sims.filter(s=>sel.includes(s.serial));
    setPrinting(true);
    const qrDataUrls = {};
    for (const s of picked) {
      const url = makeQRUrl(s.serial, s.trackingNo, bot, chat, s.phone||"");
      await new Promise(resolve => {
        const div = document.createElement("div");
        div.style.cssText = "position:absolute;left:-9999px;top:-9999px";
        document.body.appendChild(div);
        try {
          new QRCode(div, { text:url, width:200, height:200, colorDark:"#000", colorLight:"#fff", correctLevel:QRCode.CorrectLevel.M });
          setTimeout(() => {
            const cv = div.querySelector("canvas");
            if (cv) qrDataUrls[s.serial] = cv.toDataURL();
            document.body.removeChild(div);
            resolve();
          }, 400);
        } catch(e) { try{document.body.removeChild(div);}catch(e2){} resolve(); }
      });
    }
    const cards = picked.map(s=>{
      const d = qrDataUrls[s.serial]||"";
      return `<div class="card">${d?`<img src="${d}" width="200" height="200"/>`:`<div style="width:160px;height:160px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:11px">QR</div>`}${s.phone ? `<div class="phone">📞 เบอร์: ${s.phone}</div>` : `<div class="phone-wait">📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>`}<div class="trk">ซิมหมายเลข: ${s.trackingNo}${s.simType==="free" ? " (ฟรีเน็ตเดือนแรก)" : ""}</div><div class="lbl">สแกน QR Code เพื่อรับบาร์โค้ดซิมและทำการลงทะเบียนซิมที่นี่</div><div class="must">⚠️ ต้องสแกนลงทะเบียนผ่าน QR Code นี้เท่านั้น</div><div class="warn">⚠️ สำคัญมาก !!!<br>ห้ามลงทะเบียนซิมหลังเวลา 17:00 น. โดยเด็ดขาด<br>เพราะจะทำให้ซิมใช้งานไม่ได้<br>ถ้าเกิน 17:00 น. ต้องรอลงทะเบียนวันถัดไป<br>ทางร้านหยุดให้บริการทุกวันอาทิตย์และวันหยุดนักขัตฤกษ์</div></div>`;
    }).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>พิมพ์ QR</title><style>*{box-sizing:border-box}body{font-family:'Sarabun',sans-serif;background:#fff;margin:0;padding:0;color:#000}.grid{display:block}.card{border:2px solid #000;border-radius:4mm;padding:3mm 4mm;width:100mm;height:75mm;text-align:center;page-break-inside:avoid;page-break-after:always;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}.card img{width:40mm;height:40mm}.phone{font-size:9pt;font-weight:700;color:#000;margin-top:1.5mm}.phone-wait{font-size:8.5pt;color:#000;margin-top:1.5mm;font-weight:600}.trk{font-size:10pt;font-weight:700;color:#000;margin-top:1mm}.lbl{font-size:7.5pt;color:#000;margin-top:1mm;line-height:1.4}.must{font-size:8pt;color:#000;font-weight:800;margin-top:1.5mm;line-height:1.4}.warn{font-size:7pt;color:#000;font-weight:700;margin-top:2mm;line-height:1.5;border-top:0.5px solid #000;padding-top:1.5mm}@media print{.np{display:none!important}@page{size:100mm 75mm;margin:0}body{margin:0;padding:0}.card{width:100mm;height:75mm;padding:3mm 4mm;border:2px solid #000!important;border-radius:4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="np" style="background:#f5f5f5;border-bottom:2px solid #000;padding:12px 16px;margin-bottom:0">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px">
    <button onclick="window.print()" style="padding:12px 28px;font-size:16px;cursor:pointer;background:#000;color:#fff;border:none;border-radius:8px;font-weight:700">🖨️ พิมพ์ QR Code</button>
    <button onclick="window.close()" style="padding:12px 20px;font-size:15px;cursor:pointer;background:#fff;color:#000;border:2px solid #000;border-radius:8px;font-weight:700">✕ ปิด</button>

  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <span style="color:#333;font-size:13px;font-weight:700">⚙️ ปรับก่อนพิมพ์:</span>
    <label style="font-size:13px;color:#333;font-weight:600">แนวพิมพ์:
      <select id="orient" onchange="applyOrientation()" style="margin-left:6px;padding:4px 8px;border:1px solid #999;border-radius:4px;font-size:13px">
        <option value="portrait">แนวตั้ง (Portrait)</option>
        <option value="landscape">แนวนอน (Landscape)</option>
      </select>
    </label>
    <label style="font-size:13px;color:#333">กว้าง (mm): <input id="w" type="number" value="100" min="50" max="297" style="width:60px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
    <label style="font-size:13px;color:#333">สูง (mm): <input id="h" type="number" value="75" min="40" max="297" style="width:60px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
    <label style="font-size:13px;color:#333">ขนาด QR (mm): <input id="q" type="number" value="40" min="20" max="80" style="width:60px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
    <label style="font-size:13px;color:#333">ตัวอักษร (pt): <input id="f" type="number" value="8" min="5" max="16" style="width:50px;padding:4px;border:1px solid #999;border-radius:4px;font-size:13px" oninput="updateSize()"/></label>
  </div>
</div>
<script>
var PREF_KEY = 'sim_print_prefs';
function savePrefs() {
  var prefs = {
    w: document.getElementById('w').value,
    h: document.getElementById('h').value,
    q: document.getElementById('q').value,
    f: document.getElementById('f').value,
    orient: document.getElementById('orient').value
  };
  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch(e) {}
}
function loadPrefs() {
  try {
    var saved = localStorage.getItem(PREF_KEY);
    if (saved) {
      var p = JSON.parse(saved);
      if (p.w) document.getElementById('w').value = p.w;
      if (p.h) document.getElementById('h').value = p.h;
      if (p.q) document.getElementById('q').value = p.q;
      if (p.f) document.getElementById('f').value = p.f;
      if (p.orient) document.getElementById('orient').value = p.orient;
    }
  } catch(e) {}
}
function applyOrientation() {
  var orient = document.getElementById('orient').value;
  var w = parseFloat(document.getElementById('w').value)||100;
  var h = parseFloat(document.getElementById('h').value)||75;
  if(orient === 'landscape' && w < h) {
    document.getElementById('w').value = h;
    document.getElementById('h').value = w;
  } else if(orient === 'portrait' && w > h) {
    document.getElementById('w').value = h;
    document.getElementById('h').value = w;
  }
  updateSize();
}
function updateSize() {
  var w = parseFloat(document.getElementById('w').value)||100;
  var h = parseFloat(document.getElementById('h').value)||75;
  var q = parseFloat(document.getElementById('q').value)||40;
  var f = parseFloat(document.getElementById('f').value)||8;
  var orient = document.getElementById('orient').value;
  if(w > h && orient === 'portrait') document.getElementById('orient').value = 'landscape';
  if(h > w && orient === 'landscape') document.getElementById('orient').value = 'portrait';
  document.querySelectorAll('.card').forEach(function(c){
    c.style.width = w+'mm'; c.style.height = h+'mm';
  });
  document.querySelectorAll('.card img').forEach(function(img){
    img.style.width = q+'mm'; img.style.height = q+'mm';
  });
  var classes = ['phone','phone-wait','trk','lbl','must','warn'];
  var sizes = [f+1, f+0.5, f+2, f-0.5, f, f-1];
  classes.forEach(function(cls, i){
    document.querySelectorAll('.'+cls).forEach(function(el){ el.style.fontSize = sizes[i]+'pt'; });
  });
  var ps = document.getElementById('pageStyle');
  if(!ps){ ps = document.createElement('style'); ps.id='pageStyle'; document.head.appendChild(ps); }
  ps.textContent = '@media print{@page{size:'+w+'mm '+h+'mm;margin:0}.card{width:'+w+'mm!important;height:'+h+'mm!important}}';
  var orientLabel = w >= h ? '📄 แนวนอน' : '📋 แนวตั้ง';
  document.getElementById('sizeinfo').textContent = orientLabel+' | '+w+'×'+h+'mm | QR '+q+'mm | ตัวอักษร '+f+'pt';
  // บันทึกค่าอัตโนมัติทุกครั้งที่เปลี่ยน
  savePrefs();
}
window.onload = function(){ loadPrefs(); updateSize(); };
<\/script><div class="grid">${cards}</div></body></html>`;
    const blob = new Blob([html],{type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);

    // mark + ย้าย tab ก่อนเปิด window
    onMarkPrinted(sel);

    setTimeout(() => {

  return (

        {fl.slice(0,30).map(s=><QRCard key={s.serial} sim={s} selected={sel.includes(s.serial)} onClick={()=>tog(s.serial)} onPreview={()=>onPreview(s)} bot={bot} chat={chat}/>)}

  );

function Summary({ sims, botToken, chatId, simType }) {

  const [lastSent, setLastSent] = useState("");

  // สรุปข้อมูลวันนี้
  const todayStr = new Date().toISOString().slice(0,10);
  const todayScanned = sims.filter(s => s.scannedByCustomer && s.scannedAt &&
    new Date(s.scannedAt).toISOString().slice(0,10) === todayStr
  );

  // สรุปรายวัน
  const sm = {};
  sims.forEach(s => {
    const k = new Date(s.createdAt).toISOString().slice(0,10);
    if (!sm[k]) sm[k] = { added:0, scanned:0 };
    sm[k].added++;
    if (s.scannedByCustomer) sm[k].scanned++;
  });

");

${lines}`

        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chatId, text: msg })
      });
      if (res.ok) {
        setLastSent(timeStr);
        alert("✅ ส่ง Report สำเร็จแล้วครับ!");
      } else {
        alert("❌ ส่งไม่สำเร็จ กรุณาตรวจสอบ Bot Token และ Chat ID");
      }
    } catch(e) {
      alert("❌ เกิดข้อผิดพลาด: " + e.message);
    }
    setSending(false);
  };

  return (
    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h3 style={{...S.sectionTitle,margin:0}}>📊 สรุปข้อมูล</h3>
        <button onClick={sendReport} disabled={sending}
          style={{...S.btnP,opacity:sending?0.6:1,display:"flex",alignItems:"center",gap:6}}>
          {sending ? "⏳ กำลังส่ง..." : "📤 ส่ง Report Telegram"}
        </button>
      </div>

      {lastSent && (
        <div style={{background:"rgba(5,150,105,0.12)",border:"1px solid rgba(5,150,105,0.3)",borderRadius:10,padding:"8px 14px",marginBottom:12,fontSize:12,color:"#6ee7b7"}}>
          ✅ ส่ง Report ล่าสุดเวลา {lastSent} น.
        </div>
      )}

      {/* สรุปวันนี้ */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
        {[
          { label:"ลงทะเบียนวันนี้", val:todayScanned.length, color:"#6ee7b7" },
          { label:"ซิมทั้งหมด",       val:sims.length,          color:"#a5b4fc" },
          { label:"รอลงทะเบียน",      val:sims.filter(s=>!s.scannedByCustomer).length, color:"#fbbf24" },
        ].map(item=>(
          <div key={item.label} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"12px 8px",textAlign:"center"}}>
            <div style={{color:item.color,fontSize:26,fontWeight:800}}>{item.val}</div>
            <div style={{color:"#8b8fa8",fontSize:11,marginTop:4}}>{item.label}</div>
          </div>
        ))}
      </div>

      {/* รายการที่ลงทะเบียนวันนี้ */}
      <h4 style={{color:"#e2e8f0",fontSize:13,fontWeight:700,marginBottom:8}}>
        ✅ ลงทะเบียนวันนี้ ({todayScanned.length} รายการ)
      </h4>
      {todayScanned.length === 0 ? (
        <div style={{textAlign:"center",padding:24,color:"#8b8fa8",fontSize:13}}>ยังไม่มีลูกค้าลงทะเบียนวันนี้</div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {todayScanned.map((s,i) => (
            <div key={s.serial} style={{background:"rgba(5,150,105,0.08)",border:"1px solid rgba(5,150,105,0.2)",borderRadius:10,padding:"10px 14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{color:"white",fontFamily:"monospace",fontSize:12,fontWeight:700}}>{i+1}. {s.serial}</div>
                  <div style={{color:"#6ee7b7",fontSize:11,marginTop:2}}>📞 {s.phone || "รับหลังลงทะเบียน"}</div>
                  <div style={{color:"#a78bfa",fontSize:11,marginTop:2}}>🔢 ซิมหมายเลข: {s.trackingNo}</div>
                </div>
                <div style={{color:"#8b8fa8",fontSize:10,textAlign:"right"}}>
                  {s.scannedAt ? new Date(s.scannedAt).toLocaleTimeString("th-TH") : ""}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ตารางรายวัน */}
      <h4 style={{color:"#e2e8f0",fontSize:13,fontWeight:700,margin:"16px 0 8px"}}>📅 สรุปรายวัน</h4>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr>{["วันที่","เพิ่มซิม","ลงทะเบียนแล้ว"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr>
          </thead>
          <tbody>
            {Object.entries(sm).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,v])=>(
              <tr key={date} style={{background:date===todayStr?"rgba(5,150,105,0.08)":"transparent"}}>
                <td style={{...S.td,color:date===todayStr?"#6ee7b7":"#e2e8f0"}}>{date}</td>
                <td style={{...S.td,textAlign:"center"}}>{v.added}</td>
                <td style={{...S.td,textAlign:"center",color:"#6ee7b7"}}>{v.scanned}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}
// ===== SETTINGS =====
function Settings({ botToken, chatId, setBotToken, setChatId, onSave }) {
  return (
    <div style={S.card}>
      <h3 style={S.sectionTitle}>⚙️ ตั้งค่า Telegram</h3>
      <div style={{marginBottom:12}}>
        <div style={{color:"#94a3b8",fontSize:12,marginBottom:6}}>Bot Token</div>
        <input style={S.input} value={botToken} onChange={e=>setBotToken(e.target.value)} placeholder="8965070997:AAFB-..."/>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{color:"#94a3b8",fontSize:12,marginBottom:6}}>Chat ID</div>
        <input style={S.input} value={chatId} onChange={e=>setChatId(e.target.value)} placeholder="8795404772"/>
      </div>
      <button style={S.btnP} onClick={()=>{saveBot(botToken);saveChat(chatId);onSave();}}>💾 บันทึก</button>
    </div>
  );
}

// ===== APP =====
function App() {
  const [simType, setSimType] = useState("plain");
  const [simsPlain, setSimsPlain] = useState([]);
  const [simsFree, setSimsFree] = useState([]);
  const [botToken, setBotToken] = useState("");
  const [chatId, setChatId] = useState("");
  const [tab, setTab] = useState("scanner");
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [loading, setLoading] = useState(true);

  const sims = simType === "plain" ? simsPlain : simsFree;
  const setSims = (fn) => {
    if (simType === "plain") setSimsPlain(fn);
    else setSimsFree(fn);
  };

  useEffect(() => {
    setLoading(true);
    loadAll().then(d => {
      setSimsPlain(d.simsPlain || []);
      setSimsFree(d.simsFree || []);
      setBotToken(d.botToken);
      setChatId(d.chatId);
      setLoading(false);
    });
  }, []);

  const toast3 = (msg, type="ok") => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const addSim = (serial, reservedTracking=null, phone=null, simCode="") => {
    if (sims.find(s=>s.serial===serial)) { toast3(`⚠️ ${serial} มีอยู่แล้ว`,"warn"); return; }
    const rawTracking = reservedTracking || genTracking(new Set(sims.map(s=>s.trackingNo)));
    const trackingNo = simCode ? `${simCode}${rawTracking}` : rawTracking;
    const ns = {serial,trackingNo,phone:phone||"",simCode:simCode||"",simType,scannedByCustomer:false,scannedAt:null,createdAt:Date.now(),printed:false};
    setSims(prev => { const u=[ns,...prev]; saveSimsByType(u,simType); addSimToGS(ns,simType); return u; });
    toast3(`✅ เพิ่มซิม ${serial} (เลขติดตาม: ${trackingNo})`);
  };

  const delSim = (serial) => {
    if (!confirm(`ลบซิม ${serial} ?`)) return;
    setSims(prev => { const u=prev.filter(s=>s.serial!==serial); saveSimsByType(u,simType); deleteSimFromGS(serial,simType); return u; });
    toast3("🗑️ ลบแล้ว","warn");
  };

  const updatePhone = (serial, phone) => {
    setSims(prev => { const u=prev.map(s=>s.serial===serial?{...s,phone}:s); saveSimsByType(u,simType); updateSimInGS(serial,{phone},simType); return u; });
    toast3(phone?`✅ บันทึกเบอร์ ${phone}`:"✅ ลบเบอร์แล้ว");
  };

  const markPrinted = (serials) => {
    setSims(prev => {
      const u = prev.map(s=>serials.includes(s.serial)?{...s,printed:true}:s);
      const cfg = SIM_PATHS[simType];
      lsSet(cfg.lsKey, JSON.stringify(u));
      setTimeout(()=>{ serials.forEach(serial=>updateSimInGS(serial,{printed:true},simType)); },100);
      return u;
    });
    toast3(`✅ ย้ายไปพิมพ์แล้ว ${serials.length} รายการ`);
  };

  const unmarkPrinted = (serial) => {
    setSims(prev => { const u=prev.map(s=>s.serial===serial?{...s,printed:false}:s); saveSimsByType(u,simType); updateSimInGS(serial,{printed:false},simType); return u; });
    toast3("↩️ ย้ายกลับยังไม่พิมพ์แล้ว");
  };

  const markScanned = (serial) => {
    const now = Date.now();
    setSims(prev => {
      return prev.map(s => {
        if (s.serial !== serial) return s;
        tgSend(botToken,chatId,`✅ ลูกค้าสแกน QR Code แล้ว!\n📋 เลขซีเรียลซิม: ${s.serial}\n📞 เบอร์โทร: ${s.phone||"รับหลังลงทะเบียนซิม"}\n🔢 เลขติดตาม: ${s.trackingNo}\n⏰ เวลา: ${new Date(now).toLocaleString("th-TH")}`);
        updateSimInGS(s.serial,{scannedByCustomer:true,scannedAt:now},simType);
        return {...s,scannedByCustomer:true,scannedAt:now};
      });
    });
    toast3("✅ อัปเดตสถานะแล้ว");
  };

  const pendingCount  = sims.filter(s=>!s.scannedByCustomer).length;
  const scannedCount  = sims.filter(s=>s.scannedByCustomer).length;
  const todayKey = () => new Date().toISOString().slice(0,10);

  const tabs = [
    {id:"scanner", label:"📷 ยิงซิม"},
    {id:"qr",      label:`🔲 QR Code Serial Sim (${sims.length})`},
    {id:"pending", label:`⏳ รอสแกน (${pendingCount})`},
    {id:"scanned", label:`📋 ลงทะเบียนแล้ว (${scannedCount})`},
    {id:"list",    label:"📋 รายการทั้งหมด"},
    {id:"summary", label:"📊 สรุป"},
    {id:"settings",label:"⚙️ ตั้งค่า"},
  ];

  if (loading) return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0a0a1a,#0f172a,#1a0a2e)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"white",fontFamily:"sans-serif",gap:16}}>
      <div style={{fontSize:52}}>📶</div>
      <div style={{fontSize:18,fontWeight:700}}>SIM Tracker</div>
      <div style={{color:"#8b8fa8",fontSize:13}}>กำลังโหลดข้อมูลจาก Firebase...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(255,255,255,0.1)",borderTop:"3px solid #a78bfa",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return (
    <div style={S.root}>
      {toast&&<div style={{position:"fixed",top:20,right:16,zIndex:9999,background:toast.type==="ok"?"#059669":"#d97706",color:"white",padding:"10px 18px",borderRadius:12,fontWeight:600,fontSize:14,boxShadow:"0 4px 20px rgba(0,0,0,0.4)",animation:"fadeIn 0.3s"}}>{toast.msg}</div>}
      {modal&&<QRCard sim={modal} bot={botToken} chat={chatId} onClose={()=>setModal(null)}/>}

      {/* Header */}
      <div style={{background:"rgba(15,15,40,0.95)",backdropFilter:"blur(20px)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
        <div style={{width:40,height:40,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📶</div>
        <div style={{flex:1}}>
          <div style={{color:"white",fontWeight:800,fontSize:16}}>SIM Tracker</div>
          <div style={{color:"#8b8fa8",fontSize:11}}>ระบบติดตามการเปิดใช้งานซิม</div>
        </div>
        <div style={{textAlign:"center"}}>
          <div style={{color:"#a78bfa",fontWeight:800,fontSize:20}}>{sims.length}</div>
          <div style={{color:"#8b8fa8",fontSize:10}}>ซิมทั้งหมด</div>
        </div>
        <div style={{textAlign:"center"}}>
          <div style={{color:"#6ee7b7",fontWeight:800,fontSize:20}}>{sims.filter(s=>s.scannedByCustomer&&new Date(s.scannedAt||0).toISOString().slice(0,10)===todayKey()).length}</div>
          <div style={{color:"#8b8fa8",fontSize:10}}>สแกนวันนี้</div>
        </div>
      </div>

      {/* SimType Switcher */}
      <div style={{background:"rgba(0,0,0,0.3)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"8px 12px",display:"flex",gap:8,alignItems:"center"}}>
        <span style={{color:"#94a3b8",fontSize:12,fontWeight:600}}>ประเภทซิม:</span>
        {Object.entries(SIM_PATHS).map(([key,cfg])=>(
          <button key={key} onClick={()=>{setSimType(key);setTab("scanner");}}
            style={{padding:"7px 18px",border:"none",borderRadius:20,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,
              background:simType===key?cfg.color:"rgba(255,255,255,0.08)",
              color:simType===key?"white":"#8b8fa8",
              outline:simType===key?`2px solid ${cfg.color}`:"none",
              transition:"all 0.2s"
            }}>
            {cfg.emoji} {cfg.label}
            {simType===key && <span style={{marginLeft:6,background:"rgba(255,255,255,0.2)",borderRadius:99,padding:"1px 7px",fontSize:11}}>
              {(simType==="plain"?simsPlain:simsFree).length}
            </span>}
          </button>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:"flex",overflowX:"auto",borderBottom:"1px solid rgba(255,255,255,0.08)",background:"rgba(15,15,40,0.6)"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{padding:"12px 14px",border:"none",borderBottom:tab===t.id?"2px solid #a78bfa":"2px solid transparent",background:"transparent",color:tab===t.id?"#a78bfa":"#64748b",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:12,whiteSpace:"nowrap"}}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{padding:"0 0 80px"}}>
        {tab==="scanner"&&<Scanner onScan={addSim} sims={sims}/>}
        {tab==="qr"&&<QRMain sims={sims} onPreview={s=>setModal(s)} bot={botToken} chat={chatId} onMarkPrinted={markPrinted} onUnmarkPrinted={unmarkPrinted} onDeleteSim={delSim}/>}
        {tab==="pending"&&<PendingTab sims={sims} onPreview={s=>setModal(s)} onMarkScanned={markScanned}/>}
        {tab==="scanned"&&<ScannedTab sims={sims}/>}
        {tab==="list"&&<SimList sims={sims} onDelete={delSim} onUpdatePhone={updatePhone}/>}
        {tab==="summary"&&<Summary sims={sims} botToken={botToken} chatId={chatId} simType={simType}/>}
        {tab==="settings"&&<Settings botToken={botToken} chatId={chatId} setBotToken={setBotToken} setChatId={setChatId} onSave={()=>toast3("✅ บันทึกแล้ว")}/>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>

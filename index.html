<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SIM Tracker Test</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:40px;background:rgba(255,255,255,0.1);border-radius:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function App() {
  const [count, setCount] = useState(0);
  return (
    <div className="box">
      <div style={{fontSize:52,marginBottom:16}}>📶</div>
      <h1>SIM Tracker</h1>
      <p style={{color:"#a78bfa",margin:"16px 0"}}>ระบบทำงานปกติแล้ว!</p>
      <button 
        onClick={() => setCount(c => c+1)}
        style={{background:"#4f46e5",color:"white",border:"none",borderRadius:10,padding:"12px 24px",fontSize:16,cursor:"pointer"}}>
        กดทดสอบ ({count})
      </button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>SIM Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0a0a1a,#0f172a,#1a0a2e);min-height:100vh;font-family:"Noto Sans Thai",Sarabun,sans-serif;color:white}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.3);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// Firebase
const FB="https://simtracker-3a70d-default-rtdb.asia-southeast1.firebasedatabase.app";
const TYPES={
  plain:{path:"/sims_plain",ls:"sim_plain_v1",label:"ซิมเปล่า",emoji:"📦",color:"#4f46e5"},
  free:{path:"/sims_free",ls:"sim_free_v1",label:"ซิมฟรีเดือนแรก",emoji:"🎁",color:"#059669"}
};
const toKey=s=>String(s).replace(/[.#$[\]]/g,"_");
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const fbG=p=>fetch(FB+p+".json").then(r=>r.json());
const fbS=(p,d)=>fetch(FB+p+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const fbP=(p,d)=>fetch(FB+p+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const fbD=p=>fetch(FB+p+".json",{method:"DELETE"});

const loadT=async t=>{
  const cfg=TYPES[t],raw=lsG(cfg.ls)||"[]";
  let loc=[];try{loc=JSON.parse(raw)}catch(e){}
  try{
    const merged={};
    const d=await Promise.race([fbG(cfg.path),new Promise((_,r)=>setTimeout(()=>r(null),5000))]).catch(()=>null);
    if(d&&typeof d==="object"&&!d.error){Object.values(d).filter(s=>s&&s.serial).forEach(s=>{merged[s.serial]=s;});}
    const fb=Object.values(merged);
    if(fb.length>0){
      const toFix=fb.filter(s=>s.scannedByCustomer&&!s.scannedAt);
      if(toFix.length>0){
        const now=Date.now();
        toFix.forEach(s=>{s.scannedAt=now;fbP(cfg.path+"/"+toKey(s.serial),{scannedAt:now}).catch(()=>{});});
      }
      lsS(cfg.ls,JSON.stringify(fb));return fb;
    }
  }catch(e){}
  return loc;
};
const loadAll=async()=>{
  const [plain,free]=await Promise.all([loadT("plain"),loadT("free")]);
  return{plain,free,bot:lsG("tg_bot")||"",chat:lsG("tg_chat")||""};
};
const saveT=(sims,t)=>{
  const cfg=TYPES[t];lsS(cfg.ls,JSON.stringify(sims));
  const obj={};sims.forEach(s=>{obj[toKey(s.serial)]=s;});
  fbS(cfg.path,obj).catch(()=>{});
};
const addFB=(s,t)=>fbS(TYPES[t].path+"/"+toKey(s.serial),s).catch(()=>{});
const updFB=(serial,u,t)=>fbP(TYPES[t].path+"/"+toKey(serial),u).catch(()=>{});
const delFB=(serial,t)=>fbD(TYPES[t].path+"/"+toKey(serial)).catch(()=>{});
const tgSend=(bot,chat,text)=>{
  if(!bot||!chat)return;
  fetch("https://api.telegram.org/bot"+bot+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text})}).catch(()=>{});
};
const genNo=used=>{let n;do{n=String(Math.floor(Math.random()*99999)+1);}while(used.has(n));return n;};
const fmtD=ts=>ts?new Date(ts).toLocaleDateString("th-TH"):"-";
const todayS=()=>new Date().toISOString().slice(0,10);
const makeURL=(s,t,bot,chat,phone)=>{
  let u="https://programsimpro-del.github.io/Sim/?s="+encodeURIComponent(s)+"&t="+encodeURIComponent(t);
  if(bot)u+="&tgbot="+encodeURIComponent(bot);
  if(chat)u+="&tgchat="+encodeURIComponent(chat);
  if(phone)u+="&phone="+encodeURIComponent(phone);
  return u;
};

const C={
  card:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:16,margin:"12px 12px 0"},
  h3:{color:"#e2e8f0",fontSize:15,fontWeight:700,marginBottom:12},
  inp:{width:"100%",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 14px",color:"white",fontSize:14,outline:"none"},
  btnP:{background:"linear-gradient(135deg,#4f46e5,#7c3aed)",border:"none",borderRadius:10,padding:"10px 18px",color:"white",fontWeight:700,cursor:"pointer",fontSize:14},
  btnS:{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 14px",color:"#e2e8f0",fontWeight:600,cursor:"pointer",fontSize:13},
  btnD:{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"8px 12px",color:"#f87171",cursor:"pointer",fontSize:12},
  btnX:{background:"rgba(239,68,68,0.2)",border:"1px solid rgba(239,68,68,0.5)",borderRadius:10,padding:"10px 14px",color:"#f87171",fontWeight:700,cursor:"pointer"},
  th:{padding:"8px 10px",background:"rgba(255,255,255,0.06)",color:"#94a3b8",fontSize:12,fontWeight:600,textAlign:"left",borderBottom:"1px solid rgba(255,255,255,0.08)"},
  td:{padding:"10px",borderBottom:"1px solid rgba(255,255,255,0.05)",color:"#e2e8f0",fontSize:13},
};

function QR({text,size}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!text)return;
    ref.current.innerHTML="";
    try{new QRCode(ref.current,{text,width:size||120,height:size||120,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});}catch(e){}
  },[text,size]);
  return React.createElement("div",{ref,style:{background:"white",padding:4,borderRadius:4,display:"inline-block"}});
}

function QRModal({sim,bot,chat,onClose}){
  const url=makeURL(sim.serial,sim.trackingNo,bot,chat,sim.phone||"");
  const ft=sim.simType==="free"?" (ฟรีเน็ตเดือนแรก)":"";
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"white",borderRadius:16,padding:20,maxWidth:300,width:"100%",textAlign:"center",color:"#000"}} onClick={e=>e.stopPropagation()}>
        <QR text={url} size={180}/>
        {sim.phone
          ?<div style={{fontWeight:700,marginTop:8,fontSize:13}}>📞 {sim.phone}</div>
          :<div style={{color:"#d97706",marginTop:8,fontSize:12}}>📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>}
        <div style={{fontWeight:700,marginTop:4,fontSize:13}}>ซิมหมายเลข: {sim.trackingNo}{ft}</div>
        <div style={{fontSize:10,marginTop:4,color:"#444",lineHeight:1.5}}>สแกน QR Code เพื่อรับบาร์โค้ดซิมและลงทะเบียนซิมที่นี่</div>
        <div style={{fontSize:10,fontWeight:800,marginTop:3}}>⚠️ ต้องสแกนลงทะเบียนผ่าน QR Code นี้เท่านั้น</div>
        <div style={{fontSize:9,fontWeight:700,marginTop:5,borderTop:"1px solid #ddd",paddingTop:5,lineHeight:1.6}}>
          ⚠️ สำคัญมาก !!! ห้ามลงทะเบียนซิมหลังเวลา 17:00 น.<br/>
          เพราะจะทำให้ซิมใช้งานไม่ได้<br/>
          ถ้าเกิน 17:00 น. ต้องรอลงทะเบียนวันถัดไป<br/>
          ทางร้านหยุดให้บริการทุกวันอาทิตย์และวันหยุดนักขัตฤกษ์
        </div>
        <a href={url} target="_blank" rel="noopener noreferrer" style={{display:"block",marginTop:10,padding:"8px 16px",background:"#4f46e5",color:"white",borderRadius:8,textDecoration:"none",fontWeight:700,fontSize:13}}>🔗 ทดสอบ QR</a>
        <button onClick={onClose} style={{...C.btnS,width:"100%",marginTop:8,color:"#000"}}>ปิด</button>
      </div>
    </div>
  );
}

function Scanner({onScan,sims}){
  const [serial,setSerial]=useState("");
  const [phone,setPhone]=useState("");
  const [code,setCode]=useState("K");
  const [camS,setCamS]=useState(false);
  const [camP,setCamP]=useState(false);
  const [msgS,setMsgS]=useState("");
  const [msgP,setMsgP]=useState("");
  const [prev,setPrev]=useState("");
  const [rsv,setRsv]=useState("");
  const svRef=useRef(null),pvRef=useRef(null),pcRef=useRef(null);
  const srRef=useRef(null),ocrRef=useRef(null),cool=useRef(false);

  const calcP=useCallback((val)=>{
    if(!val.trim()){setPrev("");setRsv("");return;}
    const ex=sims.find(s=>s.serial===val.trim());
    if(ex){setPrev("⚠️ มีอยู่แล้ว: "+ex.trackingNo);setRsv("");return;}
    const n=genNo(new Set(sims.map(s=>s.trackingNo)));
    setRsv(n);setPrev("เลขติดตามซิม: "+(code?code+n:n));
  },[sims,code]);

  useEffect(()=>{
    if(!camS){
      if(srRef.current){try{srRef.current.reset();}catch(e){}srRef.current=null;}
      setMsgS("");return;
    }
    setCamP(false);
    const start=()=>{
      if(!window.ZXing||!svRef.current)return;
      const h=new Map();
      h.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS,[window.ZXing.BarcodeFormat.CODE_128,window.ZXing.BarcodeFormat.CODE_39,window.ZXing.BarcodeFormat.EAN_13]);
      h.set(window.ZXing.DecodeHintType.TRY_HARDER,true);
      const r=new window.ZXing.BrowserMultiFormatReader(h);
      srRef.current=r;setMsgS("🔍 ชี้กล้องที่บาร์โค้ดซีเรียล...");
      r.decodeFromVideoDevice(null,svRef.current,res=>{
        if(res&&!cool.current&&res.getText().length>=10){
          cool.current=true;
          const t=res.getText().trim();
          setSerial(t);calcP(t);
          setMsgS("✅ ได้ซีเรียล: "+t.slice(0,14)+"...");
          setCamS(false);
          setTimeout(()=>{cool.current=false;},1500);
        }
      });
    };
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
      .then(st=>{if(svRef.current){svRef.current.srcObject=st;svRef.current.play();}if(window.ZXing)start();else{const sc=document.createElement("script");sc.src="https://unpkg.com/@zxing/library@latest/umd/index.min.js";sc.onload=start;document.head.appendChild(sc);}})
      .catch(e=>setMsgS("❌ "+e.message));
    return()=>{if(srRef.current){try{srRef.current.reset();}catch(e){}srRef.current=null;}};
  },[camS]);

  useEffect(()=>{
    if(!camP){if(ocrRef.current){clearInterval(ocrRef.current);ocrRef.current=null;}setMsgP("");return;}
    setCamS(false);
    const runOCR=()=>{
      if(!pvRef.current||!pcRef.current)return;
      const v=pvRef.current,cv=pcRef.current;
      cv.width=v.videoWidth;cv.height=v.videoHeight;
      cv.getContext("2d").drawImage(v,0,0);
      if(!window.Tesseract)return;
      window.Tesseract.recognize(cv,"eng",{tessedit_char_whitelist:"0123456789"}).then(({data:{text}})=>{
        const m=text.replace(/\D/g,"").match(/0[689]\d{8}/);
        if(m){setPhone(m[0]);setMsgP("✅ เบอร์: "+m[0]);clearInterval(ocrRef.current);ocrRef.current=null;setCamP(false);}
      }).catch(()=>{});
    };
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
      .then(st=>{
        if(pvRef.current){pvRef.current.srcObject=st;pvRef.current.play();}
        setMsgP("🔍 ชี้กล้องที่เบอร์โทร...");
        const lt=cb=>{if(window.Tesseract){cb();return;}const sc=document.createElement("script");sc.src="https://unpkg.com/tesseract.js@4/dist/tesseract.min.js";sc.onload=cb;document.head.appendChild(sc);};
        lt(()=>{ocrRef.current=setInterval(runOCR,1500);});
      }).catch(e=>setMsgP("❌ "+e.message));
    return()=>{if(ocrRef.current){clearInterval(ocrRef.current);ocrRef.current=null;}};
  },[camP]);

  const go=()=>{
    if(!serial.trim())return;
    onScan(serial.trim(),rsv||null,phone.trim()||null,code||null);
    setSerial("");setPhone("");setPrev("");setRsv("");
  };

  return(
    <div style={C.card}>
      <h3 style={C.h3}>📷 ยิงเลขซีเรียลซิม</h3>
      <div style={{marginBottom:14}}>
        <div style={{color:"#94a3b8",fontSize:12,fontWeight:600,marginBottom:8}}>เครือข่าย:</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[
            {code:"K",label:"True",color:"#e53e3e"},
            {code:"L",label:"True",color:"#4f46e5"},
            {code:"A",label:"AIS",color:"#d97706"},
            {code:"D",label:"DTAC",color:"#0891b2"},
          ].map(n=>(
            <button key={n.code} onClick={()=>setCode(n.code)}
              style={{padding:"10px 8px",border:"2px solid",borderRadius:12,cursor:"pointer",fontFamily:"inherit",fontWeight:800,fontSize:13,
                textAlign:"center",
                background:code===n.code?n.color:"rgba(255,255,255,0.04)",
                borderColor:code===n.code?n.color:"rgba(255,255,255,0.1)",
                color:code===n.code?"white":"#8b8fa8"}}>
              {n.label} <span style={{opacity:0.75,fontSize:11}}>({n.code})</span>
            </button>
          ))}
        </div>
      </div>

      <div style={{background:"rgba(16,185,129,0.06)",border:"1px solid rgba(16,185,129,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{color:"#6ee7b7",fontSize:13,fontWeight:700}}>📞 เบอร์โทร</span>
          <button onClick={()=>setCamP(v=>!v)} style={{...camP?C.btnX:C.btnS,fontSize:12,padding:"6px 14px"}}>{camP?"🔴 ปิด":"📷 สแกนเบอร์"}</button>
        </div>
        {camP&&<div style={{marginBottom:8}}>
          <video ref={pvRef} style={{width:"100%",borderRadius:10,border:"2px solid #10b981",display:"block"}} playsInline muted/>
          <canvas ref={pcRef} style={{display:"none"}}/>
          <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,textAlign:"center",background:"rgba(16,185,129,0.1)",color:"#6ee7b7"}}>{msgP||"กำลังเตรียม..."}</div>
        </div>}
        <div style={{display:"flex",gap:8}}>
          <input style={{...C.inp,flex:1}} value={phone} onChange={e=>setPhone(e.target.value.replace(/[^0-9]/g,""))} placeholder="OCR อัตโนมัติ หรือกรอกเอง" maxLength={10} inputMode="numeric"/>
          {phone&&<button onClick={()=>setPhone("")} style={{...C.btnD,padding:"8px 10px"}}>✕</button>}
        </div>
        {phone&&<div style={{color:"#6ee7b7",fontSize:12,marginTop:4}}>✅ {phone}</div>}
        {!phone&&serial&&<div style={{color:"#f59e0b",fontSize:11,marginTop:4}}>📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>}
      </div>

      <div style={{background:"rgba(79,70,229,0.06)",border:"1px solid rgba(79,70,229,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{color:"#a5b4fc",fontSize:13,fontWeight:700}}>📋 เลขซีเรียลซิม</span>
          <button onClick={()=>setCamS(v=>!v)} style={{...camS?C.btnX:C.btnS,fontSize:12,padding:"6px 14px"}}>{camS?"🔴 ปิด":"📷 สแกนซีเรียล"}</button>
        </div>
        {camS&&<div style={{marginBottom:8}}>
          <div style={{position:"relative"}}>
            <video ref={svRef} style={{width:"100%",borderRadius:10,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
            <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(99,102,241,0.8)",transform:"translateY(-50%)"}}/>
          </div>
          <div style={{marginTop:6,padding:"6px 12px",borderRadius:8,fontSize:12,textAlign:"center",background:"rgba(79,70,229,0.1)",color:"#a5b4fc"}}>{msgS||"กำลังเตรียม..."}</div>
        </div>}
        <div style={{display:"flex",gap:8}}>
          <input style={{...C.inp,flex:1}} value={serial} onChange={e=>{setSerial(e.target.value);calcP(e.target.value);}} placeholder="สแกนหรือกรอกเลขซีเรียล" onKeyDown={e=>e.key==="Enter"&&go()}/>
          <button style={{...C.btnP,opacity:serial.trim()?1:0.4}} onClick={go} disabled={!serial.trim()}>เพิ่ม ➕</button>
        </div>
      </div>

      {prev&&<div style={{padding:"10px 16px",background:prev.startsWith("⚠️")?"rgba(245,158,11,0.12)":"rgba(79,70,229,0.15)",border:"1px solid rgba(167,139,250,0.5)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{color:"#94a3b8",fontSize:12}}>{prev.startsWith("⚠️")?"⚠️ ซีเรียลซ้ำ":"เลขติดตาม ("+code+"):"}</span>
        <span style={{color:"#a78bfa",fontSize:24,fontWeight:800}}>{prev.startsWith("⚠️")?prev.replace("⚠️ มีอยู่แล้ว: ",""):prev.replace("เลขติดตามซิม: ","")}</span>
      </div>}

      {sims.length>0&&<div style={{...C.card,margin:"12px 0 0",padding:12}}>
        <div style={{color:"#8b8fa8",fontSize:12,fontWeight:600,marginBottom:8}}>🕐 เพิ่มล่าสุด</div>
        {sims.slice(0,5).map(s=><div key={s.serial} style={{padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
          <div style={{color:"white",fontFamily:"monospace",fontSize:12}}>{s.serial}</div>
          <div style={{color:"#a78bfa",fontSize:11}}>เลขติดตาม: {s.trackingNo}</div>
        </div>)}
      </div>}
    </div>
  );
}
function QRMain({sims,bot,chat,onMarkPrinted,onUnmarkPrinted,onDeleteSim,onPreview}){
  const [sub,setSub]=useState("new");
  const [sel,setSel]=useState([]);
  const [q,setQ]=useState("");
  const [printing,setPrinting]=useState(false);
  const notP=sims.filter(s=>!s.printed),done=sims.filter(s=>s.printed);
  const cur=sub==="new"?notP:done;
  const fl=cur.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const tog=s=>setSel(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s]);

  const moveToDone=()=>{
    if(!sel.length)return;
    const mv=[...sel];setSel([]);
    setTimeout(()=>{onMarkPrinted(mv);setTimeout(()=>setSub("done"),400);},50);
  };

  const doPrint=async()=>{
    const tp=sims.filter(s=>sel.includes(s.serial));
    if(!tp.length)return;
    setPrinting(true);
    const qm={};
    for(const s of tp){
      const url=makeURL(s.serial,s.trackingNo,bot,chat,s.phone||"");
      await new Promise(res=>{
        const d=document.createElement("div");
        d.style.cssText="position:absolute;left:-9999px;top:-9999px";
        document.body.appendChild(d);
        try{
          new QRCode(d,{text:url,width:200,height:200,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
          setTimeout(()=>{
            const cv=d.querySelector("canvas");
            if(cv)qm[s.serial]=cv.toDataURL();
            try{document.body.removeChild(d);}catch(e){}
            res();
          },400);
        }catch(e){try{document.body.removeChild(d);}catch(e2){}res();}
      });
    }
    const PR=JSON.parse(lsG("sim_print_prefs")||'{"w":100,"h":75,"q":40,"f":8}');
    const cards=tp.map(s=>{
      const ft=s.simType==="free"?" (ฟรีเน็ตเดือนแรก)":"";
      const ph=s.phone?'<div class="ph">📞 '+s.phone+'</div>':'<div class="pw">📞 รับเบอร์โทรหลังลงทะเบียนซิม</div>';
      const img=qm[s.serial]?'<img src="'+qm[s.serial]+'" width="200" height="200" style="width:'+PR.q+'mm;height:'+PR.q+'mm"/>':"";"";

function Summary({sims,bot,chat,simType,onRefresh}){
  const [sending,setSending]=useState(false),[lastSent,setLastSent]=useState("");
  const [refreshing,setRefreshing]=useState(false);
  const [selDate,setSelDate]=useState(()=>todayS());
  const [histSims,setHistSims]=useState(null),[histLoading,setHistLoading]=useState(false);
  const today=todayS();
  const isToday=selDate===today;

  const doRefresh=useCallback(async()=>{
    setRefreshing(true);
    if(onRefresh)await onRefresh();
    setRefreshing(false);
  },[onRefresh]);

  useEffect(()=>{
    if(isToday){setHistSims(null);return;}
    setHistLoading(true);
    const ym=selDate.slice(0,7).replace("-","");
    const dayStart=new Date(selDate+"T00:00:00+07:00").getTime();
    const dayEnd=dayStart+86400000;
    Promise.all([
      fbG("/history/"+ym).catch(()=>null),
      fbG("/sims_plain").catch(()=>null),
      fbG("/sims").catch(()=>null),
    ]).then(([dh,dp,dl])=>{
      const seen=new Set();
      const all=[];
      [dh,dp,dl].forEach(d=>{
        if(!d||typeof d!=="object"||d.error)return;
        Object.values(d).filter(s=>s&&s.serial).forEach(s=>{
          if(seen.has(s.serial))return;
          seen.add(s.serial);
          if(!s.scannedByCustomer)return;
          const t=Number(s.scannedAt||s.registeredAt||0);
          if(t>=dayStart&&t<dayEnd)all.push(s);
        });
      });
      setHistSims(all);
      setHistLoading(false);
    }).catch(()=>{setHistSims([]);setHistLoading(false);});
  },[selDate,isToday]);

  const getCode=s=>{
    // trackingNo สำคัญกว่า เพราะบอกเครือข่ายจริงๆ
    const first=(s.trackingNo||"").toString().toUpperCase().charAt(0);
    if(["K","L","A","D"].includes(first))return first;
    if(s.simCode)return s.simCode.toUpperCase();
    return "";
  };

  const startOfDay=new Date(selDate+"T00:00:00+07:00").getTime();
  const endOfDay=startOfDay+86400000;
  const ts=isToday
    ?sims.filter(s=>{
        if(!s.scannedByCustomer)return false;
        if(!s.scannedAt)return true;
        try{const t=typeof s.scannedAt==="number"?s.scannedAt:Number(s.scannedAt)||new Date(s.scannedAt).getTime();return t>=startOfDay&&t<endOfDay;}catch(e){return true;}
      })
    :(histSims||[]);

  const CODES=[
    {code:"K",label:"True (K)",emoji:"🔴"},
    {code:"L",label:"True (L)",emoji:"🟣"},
    {code:"A",label:"AIS (A)",emoji:"🟡"},
    {code:"D",label:"DTAC (D)",emoji:"🔵"},
    {code:"",label:"ไม่ระบุ",emoji:"⚪"},
  ];
  const tsByCode=code=>ts.filter(s=>getCode(s)===code);

  const sm={};
  sims.forEach(s=>{try{const k=s.createdAt?new Date(s.createdAt).toISOString().slice(0,10):"unknown";if(!sm[k])sm[k]={a:0,sc:0};sm[k].a++;if(s.scannedByCustomer)sm[k].sc++;}catch(e){}});

  const send=async()=>{
    if(!bot||!chat){alert("กรุณาตั้งค่า Bot Token และ Chat ID ก่อน");return;}
    setSending(true);
    const ds=new Date(selDate+"T12:00:00+07:00").toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"});
    const tm=new Date().toLocaleTimeString("th-TH");
    const tgSend=async(text)=>{const r=await fetch("https://api.telegram.org/bot"+bot+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.description||r.status);}};
    const sendGroup=async(list,label,emoji)=>{
      if(list.length===0)return;
      const header="📊 รายงานประจำวัน "+emoji+" "+label+"\n📅 วันที่: "+ds+"\n─────────────────────────\n✅ ลงทะเบียน: "+list.length+" ซิม\n─────────────────────────\n📋 รายการ:\n\n";
      const chunks=[];let cur=header;
      list.forEach((s,i)=>{const line=(i+1)+". "+s.serial+"\n   🔢 ซิมหมายเลข: "+s.trackingNo+"\n   📞 "+(s.phone||"-")+"\n\n";if((cur+line).length>3800){chunks.push(cur);cur=line;}else cur+=line;});
      if(cur)chunks.push(cur);
      for(const chunk of chunks)await tgSend(chunk);
    };
    try{
      if(ts.length===0){await tgSend("📊 รายงานประจำวัน\n📅 วันที่: "+ds+"\n─────────────────────────\n📋 ไม่มีข้อมูลลงทะเบียนในวันนี้");}
      else{for(const c of CODES)await sendGroup(tsByCode(c.code),c.label,c.emoji);}
      setLastSent(tm);alert("✅ ส่ง Report สำเร็จ!");
    }catch(e){alert("❌ ส่งไม่สำเร็จ: "+e.message);}
    setSending(false);
  };

  return<div style={C.card}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>

        {refreshing&&<div style={{width:16,height:16,border:"2px solid rgba(255,255,255,0.1)",borderTop:"2px solid #a78bfa",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>}

      </div>
      <div style={{display:"flex",gap:6}}>
        {isToday&&<button onClick={doRefresh} disabled={refreshing} style={{...C.btnS,opacity:refreshing?0.5:1,fontSize:12,padding:"7px 12px"}}>🔄 รีเฟรช</button>}
        <button onClick={send} disabled={sending||histLoading} style={{...C.btnP,opacity:(sending||histLoading)?0.6:1,fontSize:12}}>{sending?"⏳ กำลังส่ง...":"📤 ส่ง Report"}</button>
      </div>
    </div>

    {/* Date Picker */}

        <button onClick={()=>{const d=new Date(selDate);d.setDate(d.getDate()-1);setSelDate(d.toISOString().slice(0,10));}} style={{...C.btnS,fontSize:12,padding:"8px 10px"}}>◀</button>

function ArchivedTab(){
  const [sims,setSims]=useState([]);
  const [q,setQ]=useState("");
  const [mode,setMode]=useState("single");
  const [txt,setTxt]=useState("");
  const [res,setRes]=useState([]);
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    const paths=["/sims_archived","/sims_plain_archived","/sims_free_archived"];
    Promise.all(paths.map(p=>fbG(p).catch(()=>null))).then(rs=>{
      const all={};
      rs.forEach(d=>{
        if(d&&typeof d==="object"&&!d.error)
          Object.values(d).filter(s=>s&&s.serial).forEach(s=>{all[s.serial]=s;});
      });
      setSims(Object.values(all).sort((a,b)=>(b.printedAt||0)-(a.printedAt||0)));
    }).catch(()=>{});
  },[]);

  const parse=t=>{
    const f=new Set();
    t.split("\n").forEach(l=>{
      const m=l.match(/เลขซีเรียลซิม[: ]+([A-Za-z0-9]{8,})/);
      if(m)f.add(m[1].trim());
      const n=l.match(/([0-9]{10,20})/);
      if(n)f.add(n[1].trim());
    });
    return[...f];
  };

  const find=async s=>{
    const ps=["/sims_archived","/sims_plain_archived","/sims_free_archived","/sims","/sims_plain","/sims_free"];
    for(const p of ps){try{const d=await fbG(p+"/"+toKey(s));if(d&&d.serial)return d;}catch(e){}}
    return null;
  };

  const search=async()=>{
    const serials=[...new Set(parse(txt))];
    if(!serials.length)return;
    setBusy(true);setRes([]);
    const r=[];
    for(const s of serials){const d=await find(s);r.push({s,d});}
    r.sort((a,b)=>(!a.d?1:a.d.scannedByCustomer?0:-1)-(!b.d?1:b.d.scannedByCustomer?0:-1));
    setRes(r);setBusy(false);
  };

  const mark=s=>{
    const now=Date.now();
    ["/sims_archived","/sims_plain_archived","/sims_free_archived","/sims","/sims_plain","/sims_free"]
      .forEach(p=>fbP(p+"/"+toKey(s),{scannedByCustomer:true,scannedAt:now}).catch(()=>{}));
    setSims(prev=>prev.map(x=>x.serial===s?{...x,scannedByCustomer:true}:x));
    setRes(prev=>prev.map(x=>x.s===s&&x.d?{...x,d:{...x.d,scannedByCustomer:true}}:x));
  };

  const nc=k=>({A:"#d97706",K:"#e53e3e",L:"#4f46e5",D:"#0891b2"}[k]||"#6b7280");
  const fl=sims.filter(s=>!q||s.serial.includes(q)||s.trackingNo.includes(q));

  return(
    <div style={C.card}>
      <h3 style={C.h3}>{"🗃️ Archive — "+sims.length+" รายการ"}</h3>
      <div style={{display:"flex",gap:6,marginBottom:12}}>
        {[{id:"single",lb:"🔍 ค้นหา"},{id:"bulk",lb:"📋 Telegram"}].map(m=>(
          <button key={m.id} onClick={()=>{setMode(m.id);setRes([]);}}
            style={{flex:1,padding:8,border:"none",borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",
              background:mode===m.id?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.04)",
              color:mode===m.id?"#a5b4fc":"#8b8fa8"}}>
            {m.lb}
          </button>
        ))}
      </div>

      {mode==="single"?(
        <div>
          <input style={{...C.inp,marginBottom:10}} value={q} onChange={e=>setQ(e.target.value)} placeholder={"ค้นหา serial / ซิมหมายเลข..."}/>
          {fl.map(s=>(
            <div key={s.serial} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",gap:10,alignItems:"center"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:2}}>
                  {s.simCode&&<span style={{background:nc(s.simCode),color:"white",fontSize:9,fontWeight:800,borderRadius:3,padding:"1px 5px"}}>{s.simCode}</span>}
                  <span style={{color:"#a78bfa",fontWeight:700,fontSize:12}}>{"ซิมหมายเลข: "+s.trackingNo}</span>
                </div>
                <div style={{color:"#e2e8f0",fontFamily:"monospace",fontSize:11}}>{s.serial}</div>
                {s.phone&&<div style={{color:"#6ee7b7",fontSize:11}}>{"📞 "+s.phone}</div>}
                <div style={{fontSize:10,marginTop:2,color:s.scannedByCustomer?"#6ee7b7":"#f59e0b"}}>
                  {s.scannedByCustomer?"✅ ลงทะเบียนแล้ว":"⏳ รอสแกน"}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {!s.scannedByCustomer&&<button onClick={()=>mark(s.serial)} style={{...C.btnP,fontSize:11,padding:"5px 8px"}}>{"✅ ลงทะเบียน"}</button>}
              </div>
            </div>
          ))}
        </div>
      ):(
        <div>
          <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder={"วางข้อความ Telegram..."}
            style={{...C.inp,height:120,resize:"vertical",fontSize:12,fontFamily:"monospace",marginBottom:8}}/>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <span style={{color:"#8b8fa8",fontSize:12,alignSelf:"center"}}>{"พบ "+parse(txt).length+" serial"}</span>
            <button onClick={search} disabled={busy||!txt.trim()} style={{...C.btnP,flex:1,opacity:busy||!txt.trim()?0.4:1}}>
              {busy?"⏳ ค้นหา...":"🔍 ค้นหา"}
            </button>
          </div>
          {res.length>0&&(
            <div>
              <div style={{background:"rgba(99,102,241,0.1)",border:"1px solid rgba(99,102,241,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:10}}>
                <div style={{color:"#a5b4fc",fontWeight:700,fontSize:12,marginBottom:6}}>{"📊 สรุป"}</div>
                <div style={{display:"flex",gap:12}}>
                  {[["พบ",res.filter(r=>r.d).length,"#6ee7b7"],["ไม่พบ",res.filter(r=>!r.d).length,"#f87171"],["รอ",res.filter(r=>r.d&&!r.d.scannedByCustomer).length,"#fbbf24"]].map(([l,v,col])=>(
                    <div key={l} style={{textAlign:"center"}}>
                      <div style={{color:col,fontWeight:800,fontSize:18}}>{v}</div>
                      <div style={{color:"#8b8fa8",fontSize:10}}>{l}</div>
                    </div>
                  ))}
                </div>
              </div>
              {res.some(r=>r.d&&!r.d.scannedByCustomer)&&(
                <button onClick={()=>{if(!confirm("ย้ายทั้งหมด?"))return;res.filter(r=>r.d&&!r.d.scannedByCustomer).forEach(r=>mark(r.s));}}
                  style={{...C.btnP,width:"100%",marginBottom:10,background:"linear-gradient(135deg,#059669,#10b981)"}}>
                  {"✅ ย้ายทั้งหมดเป็นลงทะเบียนแล้ว ("+res.filter(r=>r.d&&!r.d.scannedByCustomer).length+" รายการ)"}
                </button>
              )}
              {res.map(r=>(
                <div key={r.s} style={{background:r.d?"rgba(255,255,255,0.03)":"rgba(239,68,68,0.06)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",gap:10,alignItems:"center"}}>
                  <div style={{flex:1}}>
                    {r.d?(
                      <div>
                        <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:2}}>
                          {r.d.simCode&&<span style={{background:nc(r.d.simCode),color:"white",fontSize:9,fontWeight:800,borderRadius:3,padding:"1px 5px"}}>{r.d.simCode}</span>}
                          <span style={{color:"#a78bfa",fontWeight:700,fontSize:12}}>{"ซิมหมายเลข: "+r.d.trackingNo}</span>
                          {r.d.scannedByCustomer&&<span style={{color:"#6ee7b7",fontSize:10}}>{"✅"}</span>}
                        </div>
                        <div style={{color:"#e2e8f0",fontFamily:"monospace",fontSize:11}}>{r.s}</div>
                        {r.d.phone&&<div style={{color:"#6ee7b7",fontSize:11}}>{"📞 "+r.d.phone}</div>}
                      </div>
                    ):(
                      <div style={{color:"#f87171",fontSize:12}}>{"❌ ไม่พบ: "+r.s}</div>
                    )}
                  </div>
                  {r.d&&!r.d.scannedByCustomer&&(
                    <button onClick={()=>mark(r.s)} style={{...C.btnP,fontSize:11,padding:"6px 10px",whiteSpace:"nowrap"}}>{"✅ ลงทะเบียน"}</button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App(){
  const [st,setSt]=useState("plain");
  const [pSims,setPSims]=useState([]);
  const [fSims,setFSims]=useState([]);
  const [bot,setBot]=useState("");
  const [chat,setChat]=useState("");
  const [tab,setTab]=useState("scanner");
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  const [loading,setLoading]=useState(true);

  const sims=st==="plain"?pSims:fSims;
  const setSims=fn=>{if(st==="plain")setPSims(fn);else setFSims(fn);};

  useEffect(()=>{
    loadAll().then(d=>{setPSims(d.plain||[]);setFSims(d.free||[]);setBot(d.bot);setChat(d.chat);setLoading(false);});
  },[]);

  // ฟังก์ชัน fetch ทุก path แล้ว update state
  const fetchAll=useCallback(async()=>{
    try{
      const ym=new Date().toISOString().slice(0,7).replace("-","");
      const [dp,df,dh]=await Promise.all([
        Promise.race([fbG("/sims_plain"),new Promise((_,r)=>setTimeout(()=>r(null),6000))]).catch(()=>null),
        Promise.race([fbG("/sims_free"),new Promise((_,r)=>setTimeout(()=>r(null),6000))]).catch(()=>null),
        Promise.race([fbG("/history/"+ym),new Promise((_,r)=>setTimeout(()=>r(null),6000))]).catch(()=>null),
      ]);
      const mp={};
      if(dp&&typeof dp==="object"&&!dp.error)Object.values(dp).filter(s=>s&&s.serial).forEach(s=>{mp[s.serial]=s;});
      if(dh&&typeof dh==="object"&&!dh.error){
        Object.values(dh).filter(s=>s&&s.serial).forEach(s=>{
          if(!mp[s.serial])mp[s.serial]={...s,scannedByCustomer:true};
          else mp[s.serial]={...mp[s.serial],scannedByCustomer:true,scannedAt:mp[s.serial].scannedAt||s.scannedAt};
        });
      }
      const pa=Object.values(mp);
      if(pa.length)setPSims(old=>{
        const om={};old.forEach(s=>{om[s.serial]=s;});
        pa.forEach(s=>{const loc=om[s.serial];om[s.serial]={...loc,...s,printed:loc&&loc.printed?true:!!s.printed,scannedByCustomer:loc&&loc.scannedByCustomer?true:!!s.scannedByCustomer,scannedAt:(loc&&loc.scannedAt)||s.scannedAt};});
        const next=Object.values(om);
        lsS(TYPES.plain.ls,JSON.stringify(next));
        return next;
      });
      if(df&&typeof df==="object"&&!df.error){
        const fa=Object.values(df).filter(s=>s&&s.serial);
        if(fa.length)setFSims(old=>{
          const om={};old.forEach(s=>{om[s.serial]=s;});
          fa.forEach(s=>{const loc=om[s.serial];om[s.serial]={...loc,...s,printed:loc&&loc.printed?true:!!s.printed,scannedByCustomer:loc&&loc.scannedByCustomer?true:!!s.scannedByCustomer,scannedAt:(loc&&loc.scannedAt)||s.scannedAt};});
          const next=Object.values(om);
          lsS(TYPES.free.ls,JSON.stringify(next));
          return next;
        });
      }
    }catch(e){}
  },[]);

  const fetchBlockRef=useRef(false);
  useEffect(()=>{
    const id=setInterval(()=>{if(!fetchBlockRef.current)fetchAll();},10000);
    const onVis=()=>{if(!document.hidden&&!fetchBlockRef.current)fetchAll();};
    document.addEventListener("visibilitychange",onVis);
    return()=>{clearInterval(id);document.removeEventListener("visibilitychange",onVis);};
  },[fetchAll]);
  const markP=serials=>{
    fetchBlockRef.current=true;
    setSims(prev=>{

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ===== STORAGE =====
// localStorage = primary (เร็ว ไม่หาย)
// Google Sheets = sync (ทุกเครื่องเห็นเหมือนกัน)
const GS_URL = "https://script.google.com/macros/s/AKfycbzv7XhVcLxUWDjjQjI-LVnHsj94IvF5-pjNYagrdldZU4ku3mgQeo2O3bMpXCzIeb-E/exec";
const K_SIMS = "sim_v3";
const K_BOT  = "simtracker_bot_v1";
const K_CHAT = "simtracker_chat_v1";
const K_SYNCED = "sim_gs_synced";

const lsGet = (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };

// อ่านจาก localStorage ก่อนเสมอ — ไม่หายเมื่อรีเฟรช
// sync จาก GS เฉพาะกรณีเครื่องใหม่ (local ว่าง)
const loadAll = async () => {
  const botToken = lsGet(K_BOT) || "";
  const chatId   = lsGet(K_CHAT) || "";

  // อ่าน local ก่อน (migrate key เก่า)
  const localRaw = lsGet(K_SIMS) || lsGet("simtracker_sims_v1") || lsGet("simtracker_sims_v2") || "[]";
  let localSims = [];
  try { localSims = JSON.parse(localRaw); } catch(e) {}

  // ถ้ามีข้อมูล local อยู่แล้ว → ใช้เลย ไม่ต้องรอ GS
  if (localSims.length > 0) {
    // sync GS แบบ background (ไม่บล็อก UI)
    setTimeout(() => syncFromGS(), 1000);
    return { sims: localSims, botToken, chatId };
  }

  // local ว่าง → ลองโหลดจาก GS (เครื่องใหม่หรือ clear cache)
  try {
    const res = await Promise.race([
      fetch(GS_URL + "?action=getAll"),
      new Promise((_, rej) => setTimeout(() => rej("timeout"), 6000))
    ]);
    const json = await res.json();
    if (json.sims && json.sims.length > 0) {
      lsSet(K_SIMS, JSON.stringify(json.sims));
      return { sims: json.sims, botToken, chatId };
    }
  } catch(e) {}

  return { sims: [], botToken, chatId };
};

// sync จาก GS แบบ background — ถ้า GS มีข้อมูลมากกว่า local ให้ merge
let _syncCallback = null;
const setSyncCallback = (fn) => { _syncCallback = fn; };
const syncFromGS = async () => {
  try {
    const res = await fetch(GS_URL + "?action=getAll");
    const json = await res.json();
    if (!json.sims) return;
    const localRaw = lsGet(K_SIMS) || "[]";
    const local = JSON.parse(localRaw);
    // merge: เอา GS เป็นหลัก แต่ถ้า local มีมากกว่าให้ส่ง local ไป GS
    if (json.sims.length > local.length) {
      lsSet(K_SIMS, JSON.stringify(json.sims));
      if (_syncCallback) _syncCallback(json.sims);
    } else if (local.length > json.sims.length) {
      // local มีข้อมูลมากกว่า → push ไป GS
      fetch(GS_URL + "?action=saveAll&data=" + encodeURIComponent(JSON.stringify(local))).catch(() => {});
    }
  } catch(e) {}
};

// บันทึก local ทันที + sync GS async
const saveSims = (sims) => {
  lsSet(K_SIMS, JSON.stringify(sims));
  // sync GS แบบ background
  setTimeout(() => {
    fetch(GS_URL + "?action=saveAll&data=" + encodeURIComponent(JSON.stringify(sims))).catch(() => {});
  }, 100);
};

const saveBot  = (v) => lsSet(K_BOT, v);
const saveChat = (v) => lsSet(K_CHAT, v);

const addSimToGS = (sim) => {
  setTimeout(() => {
    fetch(GS_URL + "?action=addSim&data=" + encodeURIComponent(JSON.stringify(sim))).catch(() => {});
  }, 200);
};

const updateSimInGS = (serial, updates) => {
  setTimeout(() => {
    fetch(GS_URL + "?action=updateSim&serial=" + encodeURIComponent(serial) + "&data=" + encodeURIComponent(JSON.stringify(updates))).catch(() => {});
  }, 200);
};

const deleteSimFromGS = (serial) => {
  setTimeout(() => {
    fetch(GS_URL + "?action=deleteSim&serial=" + encodeURIComponent(serial)).catch(() => {});
  }, 200);
};

// ===== UTILITY =====
const genTracking = (existing) => {
  const d = Math.floor(Math.random() * 4) + 2;
  let n, t = 0;
  do { n = Math.floor(Math.random() * Math.pow(10, d)).toString().padStart(d, "0"); if (++t > 999) break; } while (existing.has(n));
  return n;
};
const fmtDate = (ts) => new Date(ts).toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
const todayKey = () => new Date().toISOString().slice(0, 10);
const tgSend = (bot, chat, text) => {
  if (!bot || !chat) return;
  fetch(`https://api.telegram.org/bot${bot}/sendMessage`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: chat, text }),
  }).catch(() => {});
};

const GITHUB_BASE = "https://programsimpro-del.github.io/Sim";
const makeQRUrl = (serial, trackingNo, bot="", chat="") => {
  let url = `${GITHUB_BASE}/?s=${encodeURIComponent(serial)}&t=${encodeURIComponent(trackingNo)}`;
  if (bot)  url += `&tgbot=${encodeURIComponent(bot)}`;
  if (chat) url += `&tgchat=${encodeURIComponent(chat)}`;
  return url;
};

// ===== BARCODE =====
function Barcode({ value, w=320, h=56 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !value) return;
    const cv = ref.current, ctx = cv.getContext("2d");
    const segs = ["11010000100"];
    for (const ch of value) { let p=""; for (let i=0;i<11;i++) p+=((ch.charCodeAt(0)+32)>>i)&1?"1":"0"; segs.push(p); }
    segs.push("1100011101011");
    const full = segs.join(""), bw = Math.max(1, Math.floor((w-4)/full.length));
    cv.width = full.length*bw+4; cv.height = h;
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#000";
    for (let i=0;i<full.length;i++) if(full[i]==="1") ctx.fillRect(2+i*bw,0,bw,h);
  }, [value]);
  return <canvas ref={ref} style={{display:"block",margin:"0 auto",maxWidth:"100%"}} />;
}

// ===== QR =====
function QR({ text, size=130 }) {
  const ref = useRef(null);
  const [ok, setOk] = useState(false);
  useEffect(() => {
    if (!text || !ref.current) return;
    setOk(false);
    ref.current.innerHTML = "";
    try { new QRCode(ref.current, { text, width:size, height:size, colorDark:"#000", colorLight:"#fff", correctLevel: QRCode.CorrectLevel.M }); setOk(true); } catch(e) {}
  }, [text, size]);
  return (
    <div style={{position:"relative",width:size,height:size,background:"#fff",borderRadius:4}}>
      <div ref={ref}/>
      {!ok && <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#555"}}>Loading...</div>}
    </div>
  );
}

// ===== CUSTOMER MODAL =====
function CustomerModal({ sim, onClose }) {
  const [confirmed, setConfirmed] = useState(false);
  const taRef = useRef(null);
  useEffect(() => { setTimeout(() => { if(taRef.current){taRef.current.focus();taRef.current.select();taRef.current.setSelectionRange(0,9999);} },200); },[]);
  const sel = () => { if(taRef.current){taRef.current.select();taRef.current.setSelectionRange(0,9999);} };
  const doCopy = () => {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(sim.serial).then(()=>setConfirmed(true)).catch(()=>{ sel(); try{document.execCommand("copy");}catch(e){} setConfirmed(true); });
    } else { sel(); try{document.execCommand("copy");}catch(e){} setConfirmed(true); }
  };
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:999,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:14,overflowY:"auto"}}>
      <div style={{background:"linear-gradient(160deg,#0f172a,#1e1b4b)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:20,padding:"20px 16px",maxWidth:420,width:"100%",textAlign:"center",marginTop:16,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:6}}>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.1)",border:"none",borderRadius:8,color:"#aaa",fontSize:18,cursor:"pointer",padding:"2px 10px"}}>✕</button>
        </div>
        <div style={{fontSize:36,marginBottom:6}}>📱</div>
        <h2 style={{color:"white",fontSize:19,fontWeight:800,margin:"0 0 4px"}}>รับเลขซีเรียลซิมของคุณ</h2>
        <div style={{display:"inline-block",background:"rgba(167,139,250,0.15)",border:"1px solid rgba(167,139,250,0.3)",borderRadius:99,padding:"3px 14px",color:"#a78bfa",fontSize:12,fontWeight:700,marginBottom:14}}>เลขติดตาม: {sim.trackingNo}</div>
        <div style={{background:"white",borderRadius:12,padding:"12px 6px 8px",marginBottom:12}}>
          <Barcode value={sim.serial} w={300} h={52}/>
          <div style={{fontFamily:"monospace",fontSize:11,color:"#111",marginTop:5,fontWeight:700,wordBreak:"break-all",letterSpacing:1}}>{sim.serial}</div>
        </div>
        <div style={{background:"rgba(79,70,229,0.1)",border:"1px solid rgba(99,102,241,0.4)",borderRadius:12,padding:"11px",marginBottom:10}}>
          <div style={{color:"#c7d2fe",fontSize:13,fontWeight:700,marginBottom:7}}>เลขซีเรียลซิมของคุณ</div>
          <textarea ref={taRef} readOnly value={sim.serial} rows={2} onClick={sel} onFocus={sel} onTouchStart={()=>setTimeout(sel,50)}
            style={{width:"100%",padding:"9px 6px",background:"rgba(255,255,255,0.12)",border:"2px solid #6366f1",borderRadius:8,color:"white",fontSize:17,fontFamily:"monospace",fontWeight:700,letterSpacing:2,textAlign:"center",resize:"none",outline:"none",WebkitUserSelect:"text",userSelect:"text",cursor:"text",lineHeight:1.5,boxSizing:"border-box"}}/>
        </div>
        <button onClick={doCopy} style={{width:"100%",padding:"13px",background:confirmed?"linear-gradient(135deg,#059669,#10b981)":"linear-gradient(135deg,#4f46e5,#7c3aed)",color:"white",border:"none",borderRadius:11,fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:9,fontFamily:"inherit"}}>
          {confirmed?"✅ คัดลอกแล้ว!":"📋 กดเพื่อคัดลอกเลขซีเรียล"}
        </button>
        <button onClick={()=>confirmed&&window.open("https://app.true.th/prepaid-registration?language=th","_blank","noopener")}

          📝 ลงทะเบียนซิม (True)
        </button>
        {!confirmed&&<div style={{color:"#f59e0b",fontSize:12,marginTop:8}}>⚠️ กดคัดลอกก่อนแล้วค่อยลงทะเบียน</div>}
      </div>

// ===== SCANNED TAB =====
function ScannedTab({ sims }) {
  const [q, setQ] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");

  const fl = sims.filter(s => {
    if (!s.scannedByCustomer) return false;
    if (!(s.serial.toLowerCase().includes(q.toLowerCase()) || s.trackingNo.includes(q))) return false;
    if (dateFrom) {
      const d = new Date(s.scannedAt).toISOString().slice(0,10);
      if (d < dateFrom) return false;
    }
    if (dateTo) {
      const d = new Date(s.scannedAt).toISOString().slice(0,10);
      if (d > dateTo) return false;
    }
    return true;
  });

  const exportExcel = () => {
    const header = ["เลขซีเรียลซิม", "วันที่ลงทะเบียน", "เวลา", "สถานะ"];
    const rows = fl.map(s => [
      s.serial,
      fmtDate(s.scannedAt),
      fmtTime(s.scannedAt),
      "ลงทะเบียนซิมแล้ว"
    ]);
    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8"});
    const label = dateFrom||dateTo ? `_${dateFrom||""}${dateTo?"_to_"+dateTo:""}` : "";
    Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(blob),
      download: `sim_registered${label}_${todayKey()}.csv`
    }).click();
  };

  return (
    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <h3 style={{...S.sectionTitle,margin:0}}>📋 สแกนซิมลงทะเบียนแล้ว ({fl.length})</h3>
        <button style={S.btnG} onClick={exportExcel}>📥 Export Excel</button>
      </div>

      {/* ตัวกรองวันที่ */}
      <div style={{background:"rgba(79,70,229,0.08)",border:"1px solid rgba(79,70,229,0.25)",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
        <div style={{color:"#c7d2fe",fontSize:12,fontWeight:700,marginBottom:8}}>📅 กำหนดช่วงวันที่ (Export เฉพาะช่วงนี้)</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",flexDirection:"column",gap:4,flex:1,minWidth:130}}>
            <label style={{color:"#94a3b8",fontSize:11}}>ตั้งแต่วันที่</label>
            <input type="date" style={{...S.input,fontSize:13,padding:"8px 10px"}} value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4,flex:1,minWidth:130}}>
            <label style={{color:"#94a3b8",fontSize:11}}>ถึงวันที่</label>
            <input type="date" style={{...S.input,fontSize:13,padding:"8px 10px"}} value={dateTo} onChange={e=>setDateTo(e.target.value)}/>
          </div>
          <button style={{...S.btnS,alignSelf:"flex-end",padding:"8px 12px",fontSize:12}} onClick={()=>{setDateFrom("");setDateTo("");}}>ล้างวันที่</button>
        </div>
      </div>

// ===== SCANNER =====
function Scanner({ onScan, sims }) {
  const [manual, setManual] = useState("");
  const [previewTracking, setPreviewTracking] = useState("");
  const [reservedTracking, setReservedTracking] = useState(""); // เลขติดตามที่จองไว้
  const [cam, setCam] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [lastScan, setLastScan] = useState("");
  const [scanMsg, setScanMsg] = useState("");
  const vRef = useRef(null);
  const readerRef = useRef(null);
  const cooldownRef = useRef(false);

  const stopCam = useCallback(() => {
    if (readerRef.current) {
      try { readerRef.current.reset(); } catch(e) {}
      readerRef.current = null;
    }
    setScanning(false);
    setScanMsg("");
  }, []);

  useEffect(() => {
    if (!cam) { stopCam(); return; }

    const startReader = () => {
      if (!window.ZXing || !vRef.current) return;
      try {
        const hints = new Map();
        const formats = [
          window.ZXing.BarcodeFormat.CODE_128,
          window.ZXing.BarcodeFormat.CODE_39,
          window.ZXing.BarcodeFormat.EAN_13,
          window.ZXing.BarcodeFormat.EAN_8,
          window.ZXing.BarcodeFormat.QR_CODE,
        ];
        hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);

        const reader = new window.ZXing.BrowserMultiFormatReader(hints);
        readerRef.current = reader;
        setScanning(true);
        setScanMsg("🔍 ชี้กล้องไปที่บาร์โค้ดซิม...");

        reader.decodeFromVideoDevice(null, vRef.current, (result, err) => {
          if (result && !cooldownRef.current) {
            const text = result.getText();
            if (text && text.length >= 8) {
              cooldownRef.current = true;
              setLastScan(text);
              setScanMsg("✅ สแกนได้ — กดปุ่ม เพิ่ม ➕ เพื่อบันทึก");
              // ใส่ลงช่องกรอก ไม่เพิ่มอัตโนมัติ
              setManual(text);
              computePreview(text);
              setCam(false); // ปิดกล้องหลังสแกน
              setTimeout(() => { cooldownRef.current = false; }, 1500);
            }
          }
        });
      } catch(e) {
        setScanMsg("❌ ไม่สามารถเริ่มสแกนได้: " + e.message);
      }
    };

    if (window.ZXing) {
      startReader();
    } else {
      // โหลด ZXing ถ้ายังไม่มี
      const sc = document.createElement("script");
      sc.src = "https://unpkg.com/@zxing/library@latest/umd/index.min.js";
      sc.onload = startReader;
      sc.onerror = () => setScanMsg("❌ โหลด ZXing ไม่ได้ กรุณากรอกเลขเอง");
      document.head.appendChild(sc);
    }

    return () => stopCam();
  }, [cam, stopCam]);

  // คำนวณเลขติดตามล่วงหน้าเมื่อกรอกเลขซีเรียล
  const computePreview = (val) => {
    if (!val.trim()) { setPreviewTracking(""); setReservedTracking(""); return; }
    // ถ้ามีซีเรียลนี้แล้ว แสดงเลขติดตามเดิม
    const existing = sims.find(s => s.serial === val.trim());
    if (existing) {
      setPreviewTracking("⚠️ มีอยู่แล้ว — เลขติดตาม: " + existing.trackingNo);
      setReservedTracking(""); // ไม่จอง เพราะมีแล้ว
      return;
    }
    // สร้างเลขติดตามและจองไว้ — ใช้เลขนี้จริงเมื่อกดเพิ่ม
    const reserved = genTracking(new Set(sims.map(s => s.trackingNo)));
    setReservedTracking(reserved);
    setPreviewTracking("เลขติดตามซิม: " + reserved);
  };

  const go = () => {
    if (manual.trim()) {
      // ส่ง serial + tracking ที่จองไว้ด้วย
      onScan(manual.trim(), reservedTracking || null);
      setManual("");
      setPreviewTracking("");
      setReservedTracking("");
    }
  };

  return (
    <div style={S.card}>
      <h3 style={S.sectionTitle}>📷 ยิงเลขซีเรียลซิม</h3>

      <button style={cam ? S.btnDO : S.btnS} onClick={() => setCam(v => !v)}>
        {cam ? "🔴 ปิดกล้อง" : "📷 เปิดกล้องสแกนบาร์โค้ด"}
      </button>

      {cam && (
        <div style={{marginTop:12}}>
          {/* กรอบ viewfinder */}
          <div style={{position:"relative",width:"100%",maxWidth:420}}>
            <video ref={vRef} style={{width:"100%",borderRadius:12,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
            {/* เส้นสแกนตรงกลาง */}
            <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(99,102,241,0.8)",transform:"translateY(-50%)",boxShadow:"0 0 8px rgba(99,102,241,0.8)"}}/>
            {/* มุมกรอบ */}
            {[{top:8,left:8,borderTop:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
              {top:8,right:8,borderTop:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"},
              {bottom:8,left:8,borderBottom:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
              {bottom:8,right:8,borderBottom:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"}
            ].map((style,i) => (
              <div key={i} style={{position:"absolute",width:20,height:20,...style}}/>
            ))}
          </div>

          {/* สถานะสแกน */}
          <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,textAlign:"center",fontSize:13,fontWeight:600,
            background: scanMsg.startsWith("✅") ? "rgba(5,150,105,0.15)" : "rgba(79,70,229,0.12)",
            border: `1px solid ${scanMsg.startsWith("✅") ? "rgba(5,150,105,0.4)" : "rgba(99,102,241,0.3)"}`,
            color: scanMsg.startsWith("✅") ? "#6ee7b7" : "#a5b4fc"
          }}>
            {scanMsg || "กำลังเตรียมกล้อง..."}
          </div>

          {lastScan && (
            <div style={{marginTop:8,padding:"10px 14px",background:"rgba(5,150,105,0.12)",border:"1px solid rgba(5,150,105,0.4)",borderRadius:10,fontSize:13,color:"#6ee7b7",textAlign:"center"}}>
              ✅ สแกนได้แล้ว! กดปุ่ม <strong style={{color:"white"}}>เพิ่ม ➕</strong> ด้านล่างเพื่อบันทึก
            </div>
          )}
        </div>
      )}

      {/* กรอกเลขเอง */}
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <input style={S.input} value={manual} onChange={e=>{setManual(e.target.value);computePreview(e.target.value);}}
          placeholder="สแกนบาร์โค้ดหรือกรอกเลขซีเรียลซิม..." onKeyDown={e=>e.key==="Enter"&&go()}/>
        <button style={S.btnP} onClick={go}>เพิ่ม ➕</button>
      </div>

      {/* Preview เลขติดตามซิม */}
      {previewTracking && (
        <div style={{
          marginTop:10,
          padding:"12px 16px",
          background: previewTracking.startsWith("⚠️") ? "rgba(245,158,11,0.12)" : "rgba(79,70,229,0.15)",
          border: `1px solid ${previewTracking.startsWith("⚠️") ? "rgba(245,158,11,0.4)" : "rgba(167,139,250,0.5)"}`,
          borderRadius:12,
          display:"flex",
          alignItems:"center",
          justifyContent:"space-between",
        }}>
          <span style={{color:"#94a3b8",fontSize:12}}>
            {previewTracking.startsWith("⚠️") ? "⚠️ ซีเรียลซ้ำ" : "เลขติดตามซิมที่จะได้รับ:"}
          </span>
          <span style={{
            color: previewTracking.startsWith("⚠️") ? "#fbbf24" : "#a78bfa",
            fontSize: previewTracking.startsWith("⚠️") ? 13 : 26,
            fontWeight:800,
            letterSpacing:2
          }}>
            {previewTracking.startsWith("⚠️") ? previewTracking.replace("⚠️ มีอยู่แล้ว — เลขติดตาม: ","") : previewTracking.replace("เลขติดตามซิม: ","")}
          </span>
        </div>
      )}
    </div>
  );
}

// ===== SIM LIST =====
function SimList({ sims, onDelete }) {
  const [q,setQ]=useState(""); const [pg,setPg]=useState(1); const pp=15;
  const [scanCam, setScanCam] = useState(false);
  const [scanMsg, setScanMsg] = useState("");
  const scanRef = useRef(null);
  const scanReaderRef = useRef(null);

  const fl=sims.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const pd=fl.slice((pg-1)*pp,pg*pp), pages=Math.ceil(fl.length/pp);

  // สแกนบาร์โค้ดเพื่อค้นหา
  useEffect(() => {
    if (!scanCam) {
      if (scanReaderRef.current) { try{scanReaderRef.current.reset();}catch(e){} scanReaderRef.current=null; }
      setScanMsg(""); return;
    }
    const startScan = () => {
      if (!window.ZXing || !scanRef.current) return;
      const hints = new Map();
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        window.ZXing.BarcodeFormat.CODE_128, window.ZXing.BarcodeFormat.CODE_39,
        window.ZXing.BarcodeFormat.EAN_13, window.ZXing.BarcodeFormat.EAN_8,
      ]);
      hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new window.ZXing.BrowserMultiFormatReader(hints);
      scanReaderRef.current = reader;
      setScanMsg("🔍 ชี้กล้องไปที่บาร์โค้ดซิม...");
      reader.decodeFromVideoDevice(null, scanRef.current, (result, err) => {
        if (result) {
          const text = result.getText();
          if (text && text.length >= 8) {
            setQ(text); setPg(1);
            setScanMsg("✅ พบ: " + text);
            setScanCam(false);
          }
        }
      });
    };
    if (window.ZXing) startScan();
    else {
      const sc = document.createElement("script");
      sc.src = "https://unpkg.com/@zxing/library@latest/umd/index.min.js";
      sc.onload = startScan;
      document.head.appendChild(sc);
    }
    return () => { if(scanReaderRef.current){try{scanReaderRef.current.reset();}catch(e){} scanReaderRef.current=null;} };
  }, [scanCam]);

  const csv=()=>{
    const h=["เลขซีเรียล","เลขติดตาม","สถานะ","วันที่เพิ่ม","วันที่สแกน"];
    const r=fl.map(s=>[s.serial,s.trackingNo,s.scannedByCustomer?"✓":"-",fmtDate(s.createdAt),s.scannedAt?fmtDate(s.scannedAt)+" "+fmtTime(s.scannedAt):"-"]);
    const blob=new Blob(["﻿"+[h,...r].map(x=>x.join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
    Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:`sims_${todayKey()}.csv`}).click();
  };
  return (
    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <h3 style={{...S.sectionTitle,margin:0}}>📋 รายการซิมทั้งหมด ({fl.length})</h3>
        <button style={S.btnG} onClick={csv}>📥 Export Excel</button>
      </div>

      {/* ช่องค้นหา + ปุ่มกล้อง */}
      <div style={{display:"flex",gap:8,marginBottom:scanCam?8:12,alignItems:"center"}}>
        <div style={{position:"relative",flex:1}}>
          <input
            style={{...S.input,paddingRight:44}}
            value={q}
            onChange={e=>{setQ(e.target.value);setPg(1);}}
            placeholder="🔍 ค้นหาเลขซีเรียลหรือเลขติดตาม..."
          />
          {q && (
            <button onClick={()=>{setQ("");setPg(1);setScanMsg("");}}
              style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#8b8fa8",fontSize:16,cursor:"pointer",padding:"0 4px"}}>
              ✕
            </button>
          )}
        </div>
        <button
          onClick={()=>setScanCam(v=>!v)}
          style={{...scanCam?S.btnDO:S.btnS, padding:"10px 14px", whiteSpace:"nowrap"}}
          title="สแกนบาร์โค้ดเพื่อค้นหา"
        >
          {scanCam ? "🔴 ปิด" : "📷 สแกน"}
        </button>
      </div>

      {/* กล้องสแกน */}
      {scanCam && (
        <div style={{marginBottom:12}}>
          <div style={{position:"relative",width:"100%",maxWidth:420}}>
            <video ref={scanRef} style={{width:"100%",borderRadius:12,border:"2px solid #4f46e5",display:"block"}} playsInline muted/>
            <div style={{position:"absolute",top:"50%",left:"8%",right:"8%",height:2,background:"rgba(99,102,241,0.8)",transform:"translateY(-50%)",boxShadow:"0 0 8px rgba(99,102,241,0.8)"}}/>
            {[{top:8,left:8,borderTop:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
              {top:8,right:8,borderTop:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"},
              {bottom:8,left:8,borderBottom:"3px solid #a78bfa",borderLeft:"3px solid #a78bfa"},
              {bottom:8,right:8,borderBottom:"3px solid #a78bfa",borderRight:"3px solid #a78bfa"}
            ].map((st,i)=><div key={i} style={{position:"absolute",width:20,height:20,...st}}/>)}
          </div>
          <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,textAlign:"center",fontSize:13,fontWeight:600,
            background:scanMsg.startsWith("✅")?"rgba(5,150,105,0.15)":"rgba(79,70,229,0.12)",
            border:`1px solid ${scanMsg.startsWith("✅")?"rgba(5,150,105,0.4)":"rgba(99,102,241,0.3)"}`,
            color:scanMsg.startsWith("✅")?"#6ee7b7":"#a5b4fc"}}>
            {scanMsg||"กำลังเตรียมกล้อง..."}
          </div>
        </div>
      )}
      {pd.length===0&&<div style={{color:"#8b8fa8",textAlign:"center",padding:32}}>ยังไม่มีข้อมูล</div>}
      <div style={{overflowX:"auto"}}>
        <table style={S.table}>
          <thead><tr>{["#","เลขซีเรียล","เลขติดตาม","สถานะ","วันที่เพิ่ม","ลบ"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {pd.map((s,i)=>(
              <tr key={s.serial} style={{background:i%2===0?"rgba(255,255,255,0.02)":"transparent"}}>
                <td style={S.td}>{(pg-1)*pp+i+1}</td>
                <td style={{...S.td,fontFamily:"monospace",fontSize:12}}>{s.serial}</td>
                <td style={{...S.td,color:"#a78bfa",fontWeight:700}}>{s.trackingNo}</td>
                <td style={S.td}><span style={{padding:"2px 8px",borderRadius:99,fontSize:11,background:s.scannedByCustomer?"#064e3b":"#1e1b4b",color:s.scannedByCustomer?"#6ee7b7":"#a5b4fc"}}>{s.scannedByCustomer?"✓ ลงทะเบียนแล้ว":"รอสแกน"}</span></td>
                <td style={{...S.td,fontSize:11,color:"#8b8fa8"}}>{fmtDate(s.createdAt)}</td>
                <td style={S.td}><button onClick={()=>onDelete(s.serial)} style={S.btnD}>🗑</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {pages>1&&<div style={{display:"flex",gap:6,justifyContent:"center",marginTop:12,flexWrap:"wrap"}}>
        {Array.from({length:pages},(_,i)=>i+1).map(p=><button key={p} onClick={()=>setPg(p)} style={{...S.btnS,padding:"4px 10px",background:p===pg?"#4f46e5":undefined,color:p===pg?"white":undefined}}>{p}</button>)}
      </div>}
    </div>
  );
}

// ===== QR MAIN (รวม 3 สถานะ: รอพิมพ์, ยังไม่พิมพ์, พิมพ์แล้ว) =====
function QRMain({ sims, onPreview, bot, chat, onMarkPrinted, onUnmarkPrinted, onDeleteSim }) {
  const [subTab, setSubTab] = useState("waiting"); // waiting=รอพิมพ์, new=ยังไม่พิมพ์, done=พิมพ์แล้ว
  const [sel, setSel] = useState([]);
  const [q, setQ] = useState("");
  const [printing, setPrinting] = useState(false);

  // รอพิมพ์ = ที่เลือกค้างไว้ (ยังไม่ได้พิมพ์จริง) — ใช้ localStorage เก็บ
  const [waiting, setWaiting] = useState(() => {
    try { return JSON.parse(localStorage.getItem("sim_waiting") || "[]"); } catch(e) { return []; }
  });
  const saveWaiting = (arr) => { localStorage.setItem("sim_waiting", JSON.stringify(arr)); setWaiting(arr); };

  const notPrinted = sims.filter(s => !s.printed && !waiting.includes(s.serial));
  const waitingList = sims.filter(s => waiting.includes(s.serial));
  const printed = sims.filter(s => s.printed);

  const fl = (list) => list.filter(s => s.serial.toLowerCase().includes(q.toLowerCase()) || s.trackingNo.includes(q));
  const tog = (serial) => setSel(prev => prev.includes(serial) ? prev.filter(s=>s!==serial) : [...prev,serial]);

  // ย้ายที่เลือกไป "รอพิมพ์"
  const moveToWaiting = () => {
    const newWaiting = [...new Set([...waiting, ...sel])];
    saveWaiting(newWaiting);
    setSel([]);
  };

  // พิมพ์จริง — ย้ายจาก "รอพิมพ์" → "พิมพ์แล้ว"
  const doPrint = async () => {
    const toPrint = subTab === "waiting" ? waitingList.filter(s => sel.includes(s.serial)) : sims.filter(s => sel.includes(s.serial));
    if (toPrint.length === 0) return;
    setPrinting(true);

    // สร้าง QR dataURLs
    const qrDataUrls = {};
    for (const s of toPrint) {
      const url = makeQRUrl(s.serial, s.trackingNo, bot, chat);
      await new Promise(resolve => {
        const div = document.createElement("div");
        div.style.cssText = "position:absolute;left:-9999px;top:-9999px";
        document.body.appendChild(div);
        try {
          new QRCode(div, { text:url, width:160, height:160, colorDark:"#000", colorLight:"#fff", correctLevel:QRCode.CorrectLevel.M });
          setTimeout(() => {
            const cv = div.querySelector("canvas");
            if(cv) qrDataUrls[s.serial] = cv.toDataURL();
            try{document.body.removeChild(div);}catch(e2){}
            resolve();
          }, 400);
        } catch(e) { try{document.body.removeChild(div);}catch(e2){} resolve(); }
      });
    }

    const cards = toPrint.map(s => {
      const d = qrDataUrls[s.serial] || "";
      return `<div class="card">${d?`<img src="${d}" width="160" height="160"/>`:`<div style="width:160px;height:160px;background:#eee;display:flex;align-items:center;justify-content:center">QR</div>`}<div class="trk">ซิมหมายเลข: ${s.trackingNo}</div><div class="lbl">สแกน QR Code เพื่อรับบาร์โค้ดซิมและทำการลงทะเบียนซิมที่นี่</div></div>`;
    }).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>พิมพ์ QR</title><style>*{box-sizing:border-box}body{font-family:'Sarabun',sans-serif;background:#fff;margin:0;padding:20px}.grid{display:flex;flex-wrap:wrap;gap:14px}.card{border:1px solid #ccc;border-radius:10px;padding:12px;width:184px;text-align:center;page-break-inside:avoid}.trk{font-size:13px;font-weight:700;color:#4f46e5;margin-top:7px}.lbl{font-size:10px;color:#444;margin-top:5px;line-height:1.5}@media print{.np{display:none!important}@page{margin:8mm}}</style></head><body><div class="np" style="margin-bottom:16px"><button onclick="window.print()" style="padding:12px 28px;font-size:16px;cursor:pointer;background:#4f46e5;color:white;border:none;border-radius:8px;font-weight:700">🖨️ พิมพ์ QR Code</button></div><div class="grid">${cards}</div><script>window.onload=function(){setTimeout(function(){window.print();},600)};<\/script></body></html>`;
    const blob = new Blob([html],{type:"text/html;charset=utf-8"});
    const a = Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),target:"_blank",rel:"noopener"});
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);},1000);

    // มาร์คว่าพิมพ์แล้ว + ลบออกจาก waiting
    const printedSerials = toPrint.map(s=>s.serial);
    onMarkPrinted(printedSerials);
    saveWaiting(waiting.filter(s=>!printedSerials.includes(s)));
    setSel([]); setPrinting(false);
  };

  const subTabs = [
    { id:"waiting", label:`🕐 รอพิมพ์ (${waitingList.length})`, color:"#fbbf24" },
    { id:"new",     label:`🖨️ ยังไม่พิมพ์ (${notPrinted.length})`, color:"#a5b4fc" },
    { id:"done",    label:`✅ พิมพ์แล้ว (${printed.length})`, color:"#6ee7b7" },
  ];

  const currentList = subTab==="waiting" ? waitingList : subTab==="new" ? notPrinted : printed;

  return (
    <div style={S.card}>
      <h3 style={{...S.sectionTitle, marginBottom:12}}>🔲 QR Code Serial Sim</h3>

      {/* Sub Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:14,borderBottom:"1px solid rgba(255,255,255,0.08)",paddingBottom:10}}>
        {subTabs.map(st=>(
          <button key={st.id} onClick={()=>{setSubTab(st.id);setSel([]);}}
            style={{flex:1,padding:"8px 4px",border:"none",borderRadius:9,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",
              background:subTab===st.id?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.04)",
              color:subTab===st.id?st.color:"#8b8fa8",
              borderBottom:subTab===st.id?`2px solid ${st.color}`:"2px solid transparent",
            }}>
            {st.label}
          </button>
        ))}
      </div>

      {/* ค้นหา + ปุ่มเลือก */}
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input style={{...S.input,flex:1,minWidth:140}} value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 ค้นหา..."/>
        <button style={S.btnS} onClick={()=>setSel(fl(currentList).map(s=>s.serial))}>เลือกทั้งหมด ({fl(currentList).length})</button>
        <button style={S.btnS} onClick={()=>setSel([])}>ยกเลิก</button>
      </div>

      {/* Action Buttons ตามแต่ละ sub tab */}
      {sel.length > 0 && (
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          {subTab==="new" && (
            <button onClick={moveToWaiting}
              style={{...S.btnS,flex:1,background:"rgba(251,191,36,0.2)",color:"#fbbf24",border:"1px solid rgba(251,191,36,0.4)",fontWeight:700}}>
              🕐 ย้ายไป รอพิมพ์ ({sel.length})
            </button>
          )}
          {(subTab==="waiting" || subTab==="new") && (
            <button onClick={doPrint} disabled={printing}
              style={{...S.btnP,flex:1,opacity:printing?0.6:1}}>
              {printing?"⏳ กำลังสร้าง...":"🖨️ พิมพ์ QR จริง ("+sel.length+")"}
            </button>
          )}
          {subTab==="done" && (
            <button onClick={()=>{sel.forEach(s=>onUnmarkPrinted(s));setSel([]);}}
              style={{...S.btnS,flex:1,color:"#f59e0b",border:"1px solid rgba(245,158,11,0.4)"}}>
              ↩️ ยกเลิกพิมพ์ ({sel.length})
            </button>
          )}
        </div>
      )}

      {/* รายการ */}
      {fl(currentList).length===0 && (
        <div style={{textAlign:"center",padding:36,color:"#8b8fa8"}}>
          <div style={{fontSize:36,marginBottom:8}}>
            {subTab==="waiting"?"🕐":subTab==="new"?"🎉":"📭"}
          </div>
          <div>{subTab==="waiting"?"ยังไม่มีซิมในคิวรอพิมพ์":subTab==="new"?"ยังไม่พิมพ์ QR ครบทุกซิมแล้ว":"ยังไม่มีซิมที่พิมพ์ QR แล้ว"}</div>
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(145px,1fr))",gap:10}}>
        {fl(currentList).map(s=>(
          <div key={s.serial} onClick={()=>tog(s.serial)}
            style={{background:sel.includes(s.serial)?"rgba(79,70,229,0.2)":"rgba(255,255,255,0.04)",
              border:`2px solid ${sel.includes(s.serial)?"#4f46e5":"rgba(255,255,255,0.08)"}`,
              borderRadius:12,padding:10,textAlign:"center",cursor:"pointer",position:"relative"}}>
            {/* เครื่องหมายติก */}
            {sel.includes(s.serial) && (
              <div style={{position:"absolute",top:6,right:6,width:18,height:18,background:"#4f46e5",borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"white",fontWeight:700}}>✓</div>
            )}
            <div style={{background:"#fff",borderRadius:8,padding:5,display:"inline-block",marginBottom:5}}>
              <QR text={makeQRUrl(s.serial,s.trackingNo,bot,chat)} size={110}/>
            </div>
            <div style={{color:"#4f46e5",fontSize:11,fontWeight:700,marginTop:4}}>ซิมหมายเลข: {s.trackingNo}</div>
            <div style={{color:"#64748b",fontSize:9,marginTop:2,lineHeight:1.4}}>สแกน QR Code เพื่อรับบาร์โค้ดซิมและทำการลงทะเบียนซิมที่นี่</div>
            {subTab==="waiting" && <div style={{marginTop:4,fontSize:9,color:"#fbbf24",fontWeight:700}}>🕐 รอพิมพ์</div>}
            {subTab==="done" && <div style={{marginTop:4,fontSize:9,color:"#6ee7b7",fontWeight:700}}>✅ พิมพ์แล้ว</div>}
            <div style={{display:"flex",gap:5,marginTop:7}}>
              <button onClick={e=>{e.stopPropagation();onPreview(s);}} style={{...S.btnS,flex:1,fontSize:10,padding:"4px 0"}}>👁 ทดสอบ</button>
              <button onClick={e=>{e.stopPropagation();onDeleteSim(s.serial);}} style={{...S.btnD,fontSize:10,padding:"4px 8px"}} title="ลบซิมนี้">🗑</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

      </div>

}

// ===== QR MANAGER =====
function QRManager({ sims, onPreview, bot, chat }) {
  const [sel, setSel] = useState([]);
  const [q, setQ] = useState("");
  const [printing, setPrinting] = useState(false);
  const fl = sims.filter(s=>s.serial.toLowerCase().includes(q.toLowerCase())||s.trackingNo.includes(q));
  const tog = (serial) => setSel(prev=>prev.includes(serial)?prev.filter(s=>s!==serial):[...prev,serial]);

  const doPrint = async () => {
    const picked = sims.filter(s=>sel.includes(s.serial));
    setPrinting(true);
    const qrDataUrls = {};
    for (const s of picked) {
      const url = makeQRUrl(s.serial, s.trackingNo, bot, chat);
      await new Promise(resolve => {
        const div = document.createElement("div");
        div.style.cssText = "position:absolute;left:-9999px;top:-9999px";
        document.body.appendChild(div);
        try {
          new QRCode(div, { text:url, width:160, height:160, colorDark:"#000", colorLight:"#fff", correctLevel:QRCode.CorrectLevel.M });
          setTimeout(() => {
            const cv = div.querySelector("canvas");
            if (cv) qrDataUrls[s.serial] = cv.toDataURL();
            document.body.removeChild(div);
            resolve();
          }, 400);
        } catch(e) { try{document.body.removeChild(div);}catch(e2){} resolve(); }
      });
    }
    const cards = picked.map(s=>{
      const d = qrDataUrls[s.serial]||"";
      return `<div class="card">${d?`<img src="${d}" width="160" height="160"/>`:`<div style="width:160px;height:160px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:11px">QR</div>`}<div class="trk">ซิมหมายเลข: ${s.trackingNo}</div><div class="lbl">สแกน QR Code เพื่อรับบาร์โค้ดซิมและทำการลงทะเบียนซิมที่นี่</div></div>`;
    }).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>พิมพ์ QR</title><style>*{box-sizing:border-box}body{font-family:'Sarabun',sans-serif;background:#fff;margin:0;padding:20px}.grid{display:flex;flex-wrap:wrap;gap:14px}.card{border:1px solid #ccc;border-radius:10px;padding:12px;width:184px;text-align:center;page-break-inside:avoid}.trk{font-size:13px;font-weight:700;color:#4f46e5;margin-top:7px}.lbl{font-size:10px;color:#444;margin-top:5px;line-height:1.5}@media print{.np{display:none!important}@page{margin:8mm}}</style></head><body><div class="np" style="margin-bottom:16px"><button onclick="window.print()" style="padding:12px 28px;font-size:16px;cursor:pointer;background:#4f46e5;color:white;border:none;border-radius:8px;font-weight:700">🖨️ พิมพ์ / เลือกเครื่องปริ้น</button></div><div class="grid">${cards}</div><script>window.onload=function(){setTimeout(function(){window.print();},600)};<\/script></body></html>`;
    const blob = new Blob([html],{type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"),{href:url,target:"_blank",rel:"noopener"});
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    setPrinting(false);
  };

  return (
    <div style={S.card}>
      <h3 style={S.sectionTitle}>🔲 จัดการ QR Code</h3>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <input style={{...S.input,flex:1,minWidth:160}} value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 ค้นหา..."/>
        <button style={S.btnS} onClick={()=>setSel(fl.map(s=>s.serial))}>เลือกทั้งหมด ({fl.length})</button>
        <button style={S.btnS} onClick={()=>setSel([])}>ยกเลิก</button>
        <button style={{...S.btnP,opacity:sel.length===0||printing?0.5:1}} onClick={()=>sel.length>0&&!printing&&doPrint()} disabled={sel.length===0||printing}>
          {printing?"⏳ กำลังสร้าง...":"🖨️ พิมพ์ QR ("+sel.length+")"}
        </button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(145px,1fr))",gap:10}}>
        {fl.slice(0,30).map(s=><QRCard key={s.serial} sim={s} selected={sel.includes(s.serial)} onClick={()=>tog(s.serial)} onPreview={()=>onPreview(s)} bot={bot} chat={chat}/>)}
      </div>
      {fl.length===0&&<div style={{color:"#8b8fa8",textAlign:"center",padding:32}}>ยังไม่มีข้อมูล</div>}
    </div>
  );
}

// ===== SUMMARY =====
function Summary({ sims }) {
  const sm={};
  sims.forEach(s=>{
    const k=new Date(s.createdAt).toISOString().slice(0,10);
    if(!sm[k])sm[k]={a:0,sc:0}; sm[k].a++;
    if(s.scannedByCustomer){const k2=new Date(s.scannedAt).toISOString().slice(0,10);if(!sm[k2])sm[k2]={a:0,sc:0};sm[k2].sc++;}
  });
  const dates=Object.keys(sm).sort().reverse();
  return (
    <div style={S.card}>
      <h3 style={S.sectionTitle}>📊 สรุปยอดรายวัน</h3>
      {!dates.length&&<div style={{color:"#8b8fa8",textAlign:"center",padding:32}}>ยังไม่มีข้อมูล</div>}
      <div style={{overflowX:"auto"}}>
        <table style={S.table}>
          <thead><tr>{["วันที่","ซิมที่เพิ่ม","สถานะ","อัตรา"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {dates.map((d,i)=>{
              const row=sm[d],rate=row.a>0?((row.sc/row.a)*100).toFixed(0):0;
              return (<tr key={d} style={{background:i%2===0?"rgba(255,255,255,0.02)":"transparent"}}>
                <td style={S.td}>{new Date(d).toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"})}</td>
                <td style={{...S.td,color:"#a5b4fc"}}>{row.a}</td>
                <td style={{...S.td,color:"#6ee7b7"}}>{row.sc}</td>
                <td style={S.td}><div style={{display:"flex",alignItems:"center",gap:6}}><div style={{height:6,width:70,background:"rgba(255,255,255,0.1)",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${rate}%`,background:"linear-gradient(90deg,#4f46e5,#a78bfa)",borderRadius:3}}/></div><span style={{fontSize:12,color:"#8b8fa8"}}>{rate}%</span></div></td>
              </tr>);
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ===== MAIN APP =====
function App() {
  const [sims, setSims] = useState([]);
  const [botToken, setBotToken] = useState("");
  const [chatId, setChatId] = useState("");
  const [tab, setTab] = useState("scanner");
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    setLoading(true);
    loadAll().then(d => {
      setSims(d.sims);
      setBotToken(d.botToken);
      setChatId(d.chatId);
      setLoading(false);
    });
  }, []);

  const toast3 = (msg,type="ok") => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const addSim = (serial, reservedTracking = null) => {
    if (sims.find(s=>s.serial===serial)) { toast3(`⚠️ ${serial} มีอยู่แล้ว`,"warn"); return; }
    // ใช้ tracking ที่จองไว้จาก preview ถ้ามี มิฉะนั้นสร้างใหม่
    const trackingNo = reservedTracking || genTracking(new Set(sims.map(s=>s.trackingNo)));
    const ns = {serial,trackingNo,scannedByCustomer:false,scannedAt:null,createdAt:Date.now(),printed:false};
    setSims(prev => {
      const u = [ns, ...prev];
      lsSet("simtracker_sims_v1", JSON.stringify(u));
      addSimToGS(ns);
      return u;
    });
    toast3(`✅ เพิ่มซิม ${serial} (เลขติดตาม: ${trackingNo})`);
  };

  const delSim = (serial) => {
    if(!confirm(`ลบซิม ${serial} ?`)) return;
    setSims(prev => {
      const u = prev.filter(s=>s.serial!==serial);
      lsSet("simtracker_sims_v1", JSON.stringify(u));
      deleteSimFromGS(serial);
      return u;
    });
    toast3("🗑️ ลบแล้ว","warn");
  };

  // มาร์คว่าพิมพ์ QR แล้ว
  const markPrinted = (serials) => {
    setSims(prev => {
      const u = prev.map(s => serials.includes(s.serial) ? {...s, printed:true} : s);
      lsSet("simtracker_sims_v1", JSON.stringify(u));
      // sync Google Sheets
      gsCall({ action: "saveAll", data: JSON.stringify(u) });
      return u;
    });
    toast3(`✅ บันทึกว่าพิมพ์ QR แล้ว ${serials.length} รายการ`);
  };

  // ย้ายกลับ "ยังไม่พิมพ์"
  const unmarkPrinted = (serial) => {
    setSims(prev => {
      const u = prev.map(s => s.serial===serial ? {...s, printed:false} : s);
      lsSet("simtracker_sims_v1", JSON.stringify(u));
      gsCall({ action: "saveAll", data: JSON.stringify(u) });
      return u;
    });
    toast3("↩️ ย้ายกลับ ยังไม่พิมพ์ แล้ว");
  };

  const markScanned = (serial) => {
    const now = Date.now();
    setSims(prev=>{
      const u=prev.map(s=>{
        if(s.serial!==serial) return s;
        tgSend(botToken,chatId,`✅ ลูกค้าสแกน QR Code แล้ว!\n📋 เลขซีเรียลซิม: ${s.serial}\n🔢 เลขติดตาม: ${s.trackingNo}\n⏰ เวลา: ${new Date(now).toLocaleString("th-TH")}`);
        updateSimInGS(s.serial, {scannedByCustomer:true, scannedAt:now});
        return {...s,scannedByCustomer:true,scannedAt:now};
      });
      lsSet("simtracker_sims_v1", JSON.stringify(u));
      return u;
    });
    toast3("✅ อัปเดตสถานะแล้ว");
  };

  const today = sims.filter(s=>s.scannedByCustomer&&new Date(s.scannedAt).toISOString().slice(0,10)===todayKey()).length;
  const pendingCount = sims.filter(s=>!s.scannedByCustomer).length;
  const scannedCount = sims.filter(s=>s.scannedByCustomer).length;

  const tabs = [
    {id:"scanner",  label:"📷 ยิงซิม"},
    {id:"qr",       label:`🔲 QR Code Serial Sim (${sims.length})`},
    {id:"pending",  label:`⏳ รอสแกน (${pendingCount})`},
    {id:"scanned",  label:`📋 ลงทะเบียนแล้ว (${scannedCount})`},
    {id:"list",     label:"📋 รายการทั้งหมด"},
    {id:"summary",  label:"📊 สรุป"},
    {id:"settings", label:"⚙️ ตั้งค่า"},
  ];

  if (loading) return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0a0a1a,#0f172a,#1a0a2e)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"white",fontFamily:"sans-serif",gap:16}}>
      <div style={{fontSize:52}}>📶</div>
      <div style={{fontSize:18,fontWeight:700}}>SIM Tracker</div>
      <div style={{color:"#8b8fa8",fontSize:13}}>กำลังโหลดข้อมูลจาก Google Sheets...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(255,255,255,0.1)",borderTop:"3px solid #a78bfa",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return (
    <div style={S.root}>
      {toast&&<div style={{position:"fixed",top:20,right:16,background:toast.type==="warn"?"#92400e":"#064e3b",color:"white",padding:"11px 18px",borderRadius:10,zIndex:9999,fontSize:14,maxWidth:300,boxShadow:"0 4px 20px rgba(0,0,0,.5)",animation:"fadeIn 0.3s"}}>{toast.msg}</div>}
      {modal&&<CustomerModal sim={modal} onClose={()=>setModal(null)}/>}

      <div style={S.header}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:38,height:38,borderRadius:10,background:"linear-gradient(135deg,#4f46e5,#a78bfa)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📶</div>
          <div>
            <div style={{color:"white",fontWeight:800,fontSize:17}}>SIM Tracker</div>
            <div style={{color:"#8b8fa8",fontSize:11}}>ระบบติดตามการเปิดใช้งานซิม</div>
          </div>
        </div>
        <div style={{display:"flex",gap:16}}>
          <div style={{textAlign:"center"}}><div style={{color:"#a78bfa",fontWeight:700,fontSize:20}}>{sims.length}</div><div style={{color:"#8b8fa8",fontSize:10}}>ซิมทั้งหมด</div></div>
          <div style={{textAlign:"center"}}><div style={{color:"#6ee7b7",fontWeight:700,fontSize:20}}>{today}</div><div style={{color:"#8b8fa8",fontSize:10}}>สแกนวันนี้</div></div>
        </div>
      </div>

      <div style={S.tabBar}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,background:tab===t.id?"rgba(79,70,229,0.3)":"transparent",color:tab===t.id?"#a78bfa":"#8b8fa8",borderBottom:tab===t.id?"2px solid #4f46e5":"2px solid transparent"}}>{t.label}</button>)}
      </div>

      <div style={S.content}>
        {tab==="scanner"&&(
          <>
            <Scanner onScan={addSim} sims={sims}/>
            {sims.length>0&&(
              <div style={S.card}>
                <h3 style={S.sectionTitle}>🕐 เพิ่มล่าสุด</h3>
                {sims.slice(0,5).map(s=>(
                  <div key={s.serial} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                    <div>
                      <div style={{color:"white",fontFamily:"monospace",fontSize:13}}>{s.serial}</div>
                      <div style={{color:"#a78bfa",fontSize:11,marginTop:2}}>เลขติดตาม: {s.trackingNo}</div>
                    </div>
                    <button onClick={()=>setModal(s)} style={{...S.btnS,fontSize:11,padding:"3px 9px"}}>👁 ทดสอบ</button>
                  </div>
                ))}
              </div>
            )}
          </>
        )}
        {tab==="qr"&&<QRMain sims={sims} onPreview={s=>setModal(s)} bot={botToken} chat={chatId} onMarkPrinted={markPrinted} onUnmarkPrinted={unmarkPrinted} onDeleteSim={delSim}/>}
        {tab==="pending"&&<PendingTab sims={sims} onPreview={s=>setModal(s)} onMarkScanned={markScanned}/>}
        {tab==="scanned"&&<ScannedTab sims={sims}/>}
        {tab==="list"&&<SimList sims={sims} onDelete={delSim}/>}
        {tab==="summary"&&<Summary sims={sims}/>}
        {tab==="settings"&&<Settings botToken={botToken} chatId={chatId} setBotToken={setBotToken} setChatId={setChatId} onSave={()=>toast3("✅ บันทึกแล้ว")}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
